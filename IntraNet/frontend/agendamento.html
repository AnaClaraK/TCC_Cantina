<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="styleag_es.css">
    <link rel="stylesheet" href="layout.css">
    <title>Agendamento</title>
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <script>
        // Verifica se existe um token no localStorage
        const token = localStorage.getItem("token");

        if (!token) {
            // Se não tem token, nem carrega o resto da página
            alert("Acesso restrito! Redirecionando para o login...");
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="fundo-escuro">
    <div class="d_util">
        <h2 class="h_ag">Agendamento</h2>
        <div id="d_inp">
            <div class="busca-box">
                <img src="../backend/imagens/lupa.png" class="icone-busca">
                <input type="text" id="inputBusca" placeholder="Buscar por nome ou código...">
            </div>
        </div>
    </div>

    <section id="sc_tabela" class="container mt-5">
        <table class="tabela table-striped table-hover border">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Produto</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Quantidade Total</th>
                    <th scope="col">Concluir</th>
                </tr>
            </thead>
            <tbody id="tb_tbl_produtos"></tbody>
        </table>
    </section>

    <dialog id="d_aviso">
        <div class="aviso_box">
            <p id="msg_aviso"></p>
            <div class="aviso_botoes">
                <button id="b_confirmar_aviso">OK</button>
                <button id="b_cancelar_aviso" style="display: none;">Cancelar</button>
            </div>
        </div>
    </dialog>
    
<script>
const aviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");

async function carregarAgendamentos() {
    const tbody = document.getElementById("tb_tbl_produtos");

    try {
        const resposta = await fetch("http://localhost:3000/agendamento", {
            headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`
            }
        });

        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }

        const dados = await resposta.json();

        tbody.innerHTML = "";

        if (!dados || dados.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5">Nenhum agendamento encontrado.</td>
                </tr>
            `;
            return;
        }

        dados.forEach(item => {
            tbody.innerHTML += `
                <tr data-id="${item.id_pedido}">
                    <td>${item.nome || "Cliente"}</td>
                    <td>${item.produto || "-"}</td>
                    <td>R$ ${Number(item.valor_total).toFixed(2).replace(".", ",")}</td>
                    <td>${item.qtd_total}</td>
                    <td>
                        <input 
                            type="checkbox" 
                            class="checkbox-concluir"
                            onchange="concluirAgendamento(${item.id_pedido}, this)"
                        >
                    </td>
                </tr>
            `;
        });

    } catch (erro) {
        console.error("Erro ao carregar agendamentos:", erro);
        tbody.innerHTML = `
            <tr>
                <td colspan="5">Erro ao carregar agendamentos.</td>
            </tr>
        `;
    }
}

async function concluirAgendamento(idPedido, checkbox) {
    if (!checkbox.checked) return;

    exibirAviso(
        "Deseja marcar este agendamento como finalizado?",
        async () => {
            try {
                const resposta = await fetch(`http://localhost:3000/agendamento/${idPedido}/finalizar`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                });

                if (!resposta.ok) {
                    throw new Error(`Erro HTTP: ${resposta.status}`);
                }

                const linha = checkbox.closest("tr");
                linha.remove();

                exibirAviso("Agendamento finalizado com sucesso!");

            } catch (erro) {
                console.error("Erro ao finalizar agendamento:", erro);
                exibirAviso("Erro ao finalizar agendamento.");
                checkbox.checked = false;
            }
        },
        true
    );
}
function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
    msgAviso.innerText = mensagem;
    bCancelarAviso.style.display = mostrarCancelar ? "inline-block" : "none";
    aviso.showModal();

    bConfirmarAviso.onclick = () => {
        aviso.close();
        if (callback) callback();
    };

    bCancelarAviso.onclick = () => {
        aviso.close();
    };
}

const inputBusca = document.getElementById("inputBusca");

inputBusca.addEventListener("keyup", function () {
    const termo = this.value.toLowerCase().trim();
    const linhas = document.querySelectorAll("#tb_tbl_produtos tr");

    linhas.forEach(linha => {
        const textoLinha = linha.textContent.toLowerCase();
        linha.style.display = textoLinha.includes(termo) ? "" : "none";
    });
});

window.addEventListener("load", carregarAgendamentos);
</script>
</body>
</html>
