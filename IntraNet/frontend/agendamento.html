<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>

    <link rel="stylesheet" href="styleag_es.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">

    <title>Agendamento</title>

    <script>
        const token = localStorage.getItem("token");
    </script>
</head>

<body class="fundo-escuro">
    <div class="d_util">
        <h2 class="h_ag">Agendamento</h2>
        <div id="d_inp">
            <div class="busca-box">
                <img src="../backend/imagens/lupa.png" class="icone-busca" alt="Buscar">

                <input type="text" id="inputBusca" placeholder="Buscar por nome ou data...">

                <label for="filtroData" class="icone-calendario">
                    <img src="../backend/imagens/calendariof_p.png" alt="Selecionar data">
                </label>

                <input type="date" id="filtroData">
            </div>
        </div>
    </div>

    <section id="sc_tabela" class="container mt-5">
        <table class="tabela table-striped table-hover border">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Produto</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Quantidade Total</th>
                    <th scope="col">Origem</th>
                    <th scope="col">Data</th>
                    <th scope="col">Concluir</th>
                </tr>
            </thead>
            <tbody id="tb_tbl_produtos"></tbody>
        </table>
    </section>

    <dialog id="d_aviso">
        <div class="aviso_box">
            <p id="msg_aviso"></p>
            <div class="aviso_botoes">
                <button id="b_confirmar_aviso">OK</button>
                <button id="b_cancelar_aviso" style="display: none;">Cancelar</button>
            </div>
        </div>
    </dialog>

<script>
const aviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");
const inputBusca = document.getElementById("inputBusca");
const filtroData = document.getElementById("filtroData");

let contadorOrdenacao = 0;

function aplicarOrdenacaoTabela(idTbody, colunasIgnoradas = []) {
    const tbody = typeof idTbody === "string"
        ? document.getElementById(idTbody)
        : idTbody?.querySelector?.("tbody") || idTbody;

    if (!tbody) return;

    const tabela = tbody.closest("table");
    if (!tabela) return;

    const linhasOriginais = Array.from(tbody.querySelectorAll("tr"));
    linhasOriginais.forEach((tr, index) => {
        if (tr.dataset.indexOriginal === undefined) {
            tr.dataset.indexOriginal = index;
        }
    });

    const cabecalhos = Array.from(tabela.querySelectorAll("thead th"));

    cabecalhos.forEach((th, indice) => {
        if (colunasIgnoradas.includes(indice)) return;

        th.classList.add("sortable");
        if (!th.dataset.ordem) th.dataset.ordem = "none";

        const novoTh = th.cloneNode(true);
        novoTh.dataset.ordem = th.dataset.ordem || "none";
        novoTh.dataset.prioridadeOrdenacao = th.dataset.prioridadeOrdenacao || "";
        th.parentNode.replaceChild(novoTh, th);

        novoTh.addEventListener("click", () => {
            const estadoAtual = novoTh.dataset.ordem || "none";
            const novoEstado = estadoAtual === "none"
                ? "asc"
                : estadoAtual === "asc"
                    ? "desc"
                    : "none";

            novoTh.dataset.ordem = novoEstado;
            novoTh.classList.remove("sort-asc", "sort-desc");

            if (novoEstado === "asc") {
                novoTh.classList.add("sort-asc");
                novoTh.dataset.prioridadeOrdenacao = ++contadorOrdenacao;
            } else if (novoEstado === "desc") {
                novoTh.classList.add("sort-desc");
                novoTh.dataset.prioridadeOrdenacao = ++contadorOrdenacao;
            } else {
                novoTh.dataset.prioridadeOrdenacao = "";
            }

            const ordenacoesAtivas = Array.from(tabela.querySelectorAll("thead th"))
                .map((cab, idx) => ({
                    indice: idx,
                    estado: cab.dataset.ordem || "none",
                    prioridade: Number(cab.dataset.prioridadeOrdenacao || 0)
                }))
                .filter(item => item.estado !== "none")
                .sort((a, b) => b.prioridade - a.prioridade);

            const linhas = Array.from(tbody.querySelectorAll("tr"));

            if (ordenacoesAtivas.length === 0) {
                linhas.sort((a, b) =>
                    Number(a.dataset.indexOriginal || 0) - Number(b.dataset.indexOriginal || 0)
                );
            } else {
                const obterValor = (linha, indice) => {
                    const celula = linha.children[indice];
                    if (!celula) return "";
                    const controle = celula.querySelector("input, select");
                    return controle ? controle.value.trim() : celula.textContent.trim();
                };

                const eAgendamento = tabela.querySelectorAll("thead th").length === 7 && tbody.id === "tb_tbl_produtos";

                linhas.sort((a, b) => {
                    for (const ordem of ordenacoesAtivas) {
                        let resultado;

                        // No Agendamento, a coluna Data usa o valor original guardado no <tr>.
                        if (eAgendamento && ordem.indice === 5) {
                            const dataA = new Date(a.dataset.data || 0).getTime();
                            const dataB = new Date(b.dataset.data || 0).getTime();
                            resultado = dataA - dataB;
                        } else {
                            const valA = obterValor(a, ordem.indice);
                            const valB = obterValor(b, ordem.indice);
                            const textoA = String(valA || "").trim();
                            const textoB = String(valB || "").trim();

                            const numA = parseFloat(textoA
                                .replace(/R\$/g, "")
                                .replace(/#/g, "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim());
                            const numB = parseFloat(textoB
                                .replace(/R\$/g, "")
                                .replace(/#/g, "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim());

                            if (!Number.isNaN(numA) && !Number.isNaN(numB) && textoA !== "" && textoB !== "") {
                                resultado = numA - numB;
                            } else {
                                resultado = textoA.localeCompare(textoB, "pt-BR", {
                                    numeric: true,
                                    sensitivity: "base"
                                });
                            }
                        }

                        if (resultado !== 0) {
                            return ordem.estado === "asc" ? resultado : -resultado;
                        }
                    }

                    return Number(a.dataset.indexOriginal || 0) - Number(b.dataset.indexOriginal || 0);
                });
            }

            linhas.forEach(linha => tbody.appendChild(linha));
        });
    });
}

async function carregarAgendamentos() {
    const tbody = document.getElementById("tb_tbl_produtos");

    try {
        const resposta = await fetch("http://localhost:3000/agendamento", {
            headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`
            }
        });

        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }

        const dados = await resposta.json();

        dados.sort((a, b) => {
            const dataA = new Date(a.data_ag || a.data);
            const dataB = new Date(b.data_ag || b.data);
            return dataA - dataB;
        });

        tbody.innerHTML = "";
        delete tbody.dataset.ordemOriginal;

        if (!dados || dados.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" style="text-align: center;">Nenhum agendamento encontrado.</td>
                </tr>
            `;
            return;
        }

        dados.forEach(item => {
            const dataRaw = item.data_ag || item.data;
            let dataFormatada = "Horário não definido";

            if (dataRaw) {
                const dataObjeto = new Date(dataRaw);

                if (!isNaN(dataObjeto.getTime())) {
                    dataFormatada = dataObjeto.toLocaleString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                    });
                }
            }

            const produtosLista = Array.isArray(item.produtos) 
                ? item.produtos.map(p => p.nome).join(", ") 
                : "-";

            const tr = document.createElement("tr");
            tr.setAttribute("data-id", item.id_pedido);
            tr.setAttribute("data-data", dataRaw || "");

            tr.innerHTML = `
                <td>${item.cliente_nome || "Cliente"}</td>
                <td>${produtosLista}</td>
                <td>R$ ${Number(item.valor_total || 0).toFixed(2).replace(".", ",")}</td>
                <td>${item.qtd_total || 0}</td>
                <td>${item.origem || "-"}</td>
                <td>${dataFormatada}</td>
                <td>
                    <input 
                        type="checkbox" class="chk-concluido" onchange="concluirAgendamento(${item.id_pedido}, this)"
                    >
                </td>
            `;
            tbody.appendChild(tr);
        });

        aplicarOrdenacaoTabela("tb_tbl_produtos", [6]);

    } catch (erro) {
        console.error("Erro ao carregar agendamentos:", erro);
        tbody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align: center;">Erro ao carregar agendamentos.</td>
            </tr>
        `;
    }
}

async function concluirAgendamento(idPedido, checkbox) {
    if (!checkbox.checked) return;
    window.checkboxAtual = checkbox;
    exibirAviso(
        "Deseja marcar este agendamento como finalizado?",
        async () => {
            try {
                const resposta = await fetch(`http://localhost:3000/agendamento/${idPedido}/finalizar`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                });

                if (!resposta.ok) {
                    throw new Error(`Erro HTTP: ${resposta.status}`);
                }

                const linha = checkbox.closest("tr");
                linha.remove();

                exibirAviso("Agendamento finalizado com sucesso!");

            } catch (erro) {
                console.error("Erro ao finalizar agendamento:", erro);
                exibirAviso("Erro ao finalizar agendamento.");
                checkbox.checked = false;
            }
        },
        true
    );
}

function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
    msgAviso.innerText = mensagem;
    bCancelarAviso.style.display = mostrarCancelar ? "inline-block" : "none";
    aviso.showModal();

    bConfirmarAviso.onclick = () => {
        aviso.close();
        if (callback) callback();
    };

    bCancelarAviso.onclick = () => {
        aviso.close();
        if (window.checkboxAtual) {
            window.checkboxAtual.checked = false;
            window.checkboxAtual.blur();
            window.checkboxAtual = null;
        }
    };
}

function normalizarTexto(texto) {
    return (texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function filtrarAgendamentos() {
    const termo = normalizarTexto(inputBusca.value);
    const dataSelecionada = filtroData.value;

    const linhas = document.querySelectorAll("#tb_tbl_produtos tr");

    linhas.forEach(linha => {
        const colunas = linha.getElementsByTagName("td");

        if (colunas.length < 6) return;

        const nomeCliente = normalizarTexto(colunas[0].textContent);
        const dataOriginal = linha.dataset.data;

        let dataLinha = "";

        if (dataOriginal) {
            const data = new Date(dataOriginal);

            if (!isNaN(data.getTime())) {
                const ano = data.getFullYear();
                const mes = String(data.getMonth() + 1).padStart(2, "0");
                const dia = String(data.getDate()).padStart(2, "0");

                dataLinha = `${ano}-${mes}-${dia}`;
            }
        }

        const correspondeNome = nomeCliente.includes(termo);
        const dataFormatada = normalizarTexto(colunas[5].textContent);
        const correspondeBuscaData = dataFormatada.includes(termo);
        const correspondeData = !dataSelecionada || dataLinha === dataSelecionada;

        if ((correspondeNome || correspondeBuscaData) && correspondeData) {
            linha.style.display = "";
        } else {
            linha.style.display = "none";
        }
    });
}

inputBusca.addEventListener("input", filtrarAgendamentos);
filtroData.addEventListener("change", filtrarAgendamentos);

window.addEventListener("load", carregarAgendamentos);
</script>
</body>
</html>
