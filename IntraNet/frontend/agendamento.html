<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="styleag_es.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">

    <title>Agendamento</title>

    <script>
        const token = localStorage.getItem("token");
    </script>
</head>

<body class="fundo-escuro pagina-agendamento">
    <div class="d_util">
        <h2 class="h_ag">Agendamento</h2>
        <button type="button" id="b_clientes_app">
            Clientes do app
            <span id="badge_clientes_app" hidden>0</span>
        </button>
        <div id="d_inp">
            <div class="busca-box">
                <img src="../backend/imagens/lupa.png" class="icone-busca" alt="Buscar">

                <input type="text" id="inputBusca" placeholder="Buscar por nome ou data...">

                <label for="filtroData" class="icone-calendario">
                    <img src="../backend/imagens/calendariof_p.png" alt="Selecionar data">
                </label>

                <input type="date" id="filtroData">
            </div>
        </div>
    </div>

    <section id="sc_tabela" class="container mt-5">
        <table class="tabela table-striped table-hover border">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Produto</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Qtd</th>
                    <th scope="col">Origem</th>
                    <th scope="col">Comanda</th>
                    <th scope="col">Concluir</th>
                </tr>
            </thead>
            <tbody id="tb_tbl_produtos"></tbody>
        </table>
    </section>

    <dialog id="d_clientes_app" class="dlg-clientes-app">
        <section class="clientes-app-modal">
            <header class="clientes-app-cabecalho">
                <div>
                    <h3>Clientes cadastrados no app</h3>
                    <p>Pedidos continuam nesta lista quando passam do horário de retirada e não são finalizados.</p>
                </div>
                <button type="button" id="b_fechar_clientes_app" aria-label="Fechar">×</button>
            </header>

            <div class="clientes-app-filtros">
                <label for="dias_nao_retirado">
                    Mostrar pedido não retirado após
                    <select id="dias_nao_retirado">
                        <option value="2" selected>2 dias</option>
                        <option value="1">1 dia</option>
                    </select>
                </label>
                <input type="search" id="busca_clientes_app" placeholder="Buscar cliente por nome ou e-mail...">
            </div>

            <p id="resumo_clientes_app" class="clientes-app-resumo">Carregando clientes...</p>
            <div id="lista_clientes_app" class="clientes-app-lista"></div>
        </section>
    </dialog>

    <dialog id="d_aviso">
        <div class="aviso_box">
            <p id="msg_aviso"></p>
            <div class="aviso_botoes">
                <button id="b_confirmar_aviso">OK</button>
                <button id="b_cancelar_aviso" style="display: none;">Cancelar</button>
            </div>
        </div>
    </dialog>

<script>
const aviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");
const inputBusca = document.getElementById("inputBusca");
const filtroData = document.getElementById("filtroData");
const modalClientesApp = document.getElementById("d_clientes_app");
const botaoClientesApp = document.getElementById("b_clientes_app");
const botaoFecharClientesApp = document.getElementById("b_fechar_clientes_app");
const listaClientesApp = document.getElementById("lista_clientes_app");
const resumoClientesApp = document.getElementById("resumo_clientes_app");
const buscaClientesApp = document.getElementById("busca_clientes_app");
const diasNaoRetirado = document.getElementById("dias_nao_retirado");
const badgeClientesApp = document.getElementById("badge_clientes_app");

let clientesAppCache = [];
let pedidosNaoRetiradosCache = [];
let contadorOrdenacao = 0;

function aplicarOrdenacaoTabela(idTbody, colunasIgnoradas = []) {
    const tbody = typeof idTbody === "string"
        ? document.getElementById(idTbody)
        : idTbody?.querySelector?.("tbody") || idTbody;

    if (!tbody) return;

    const tabela = tbody.closest("table");
    if (!tabela) return;

    const linhasOriginais = Array.from(tbody.querySelectorAll("tr"));
    linhasOriginais.forEach((tr, index) => {
        if (tr.dataset.indexOriginal === undefined) {
            tr.dataset.indexOriginal = index;
        }
    });

    const cabecalhos = Array.from(tabela.querySelectorAll("thead th"));

    cabecalhos.forEach((th, indice) => {
        if (colunasIgnoradas.includes(indice)) return;

        th.classList.add("sortable");
        if (!th.dataset.ordem) th.dataset.ordem = "none";

        const novoTh = th.cloneNode(true);
        novoTh.dataset.ordem = th.dataset.ordem || "none";
        novoTh.dataset.prioridadeOrdenacao = th.dataset.prioridadeOrdenacao || "";
        th.parentNode.replaceChild(novoTh, th);

        novoTh.addEventListener("click", () => {
            const estadoAtual = novoTh.dataset.ordem || "none";
            const eColunaComanda = novoTh.cellIndex === 5;
            const novoEstado = eColunaComanda
                ? estadoAtual === "none"
                    ? "desc"
                    : estadoAtual === "desc"
                        ? "asc"
                        : "none"
                : estadoAtual === "none"
                    ? "asc"
                    : estadoAtual === "asc"
                        ? "desc"
                        : "none";

            novoTh.dataset.ordem = novoEstado;
            novoTh.classList.remove("sort-asc", "sort-desc");

            if (novoEstado === "asc") {
                novoTh.classList.add("sort-asc");
                novoTh.dataset.prioridadeOrdenacao = ++contadorOrdenacao;
            } else if (novoEstado === "desc") {
                novoTh.classList.add("sort-desc");
                novoTh.dataset.prioridadeOrdenacao = ++contadorOrdenacao;
            } else {
                novoTh.dataset.prioridadeOrdenacao = "";
            }

            const ordenacoesAtivas = Array.from(tabela.querySelectorAll("thead th"))
                .map((cab, idx) => ({
                    indice: idx,
                    estado: cab.dataset.ordem || "none",
                    prioridade: Number(cab.dataset.prioridadeOrdenacao || 0)
                }))
                .filter(item => item.estado !== "none")
                .sort((a, b) => b.prioridade - a.prioridade);

            const linhas = Array.from(tbody.querySelectorAll("tr"));

            if (ordenacoesAtivas.length === 0) {
                linhas.sort((a, b) =>
                    Number(a.dataset.indexOriginal || 0) - Number(b.dataset.indexOriginal || 0)
                );
            } else {
                const obterValor = (linha, indice) => {
                    const celula = linha.children[indice];
                    if (!celula) return "";
                    const controle = celula.querySelector("input, select");
                    return controle ? controle.value.trim() : celula.textContent.trim();
                };

                const eAgendamento = tabela.querySelectorAll("thead th").length === 7 && tbody.id === "tb_tbl_produtos";

                linhas.sort((a, b) => {
                    for (const ordem of ordenacoesAtivas) {
                        let resultado;

                        // No Agendamento, a coluna Data usa o valor original guardado no <tr>.
                        if (eAgendamento && ordem.indice === 5) {
                            const dataA = new Date(a.dataset.data || 0).getTime();
                            const dataB = new Date(b.dataset.data || 0).getTime();
                            resultado = dataA - dataB;
                        } else {
                            const valA = obterValor(a, ordem.indice);
                            const valB = obterValor(b, ordem.indice);
                            const textoA = String(valA || "").trim();
                            const textoB = String(valB || "").trim();

                            const numA = parseFloat(textoA
                                .replace(/R\$/g, "")
                                .replace(/#/g, "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim());
                            const numB = parseFloat(textoB
                                .replace(/R\$/g, "")
                                .replace(/#/g, "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim());

                            if (!Number.isNaN(numA) && !Number.isNaN(numB) && textoA !== "" && textoB !== "") {
                                resultado = numA - numB;
                            } else {
                                resultado = textoA.localeCompare(textoB, "pt-BR", {
                                    numeric: true,
                                    sensitivity: "base"
                                });
                            }
                        }

                        if (resultado !== 0) {
                            return ordem.estado === "asc" ? resultado : -resultado;
                        }
                    }

                    return Number(a.dataset.indexOriginal || 0) - Number(b.dataset.indexOriginal || 0);
                });
            }

            linhas.forEach(linha => tbody.appendChild(linha));
        });
    });
}

async function carregarAgendamentos() {
    const tbody = document.getElementById("tb_tbl_produtos");

    try {
        const resposta = await fetch("http://localhost:3000/agendamento", {
            headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`
            }
        });

        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }

        const dados = await resposta.json();

        dados.sort((a, b) => {
            const dataA = new Date(a.data_ag || a.data);
            const dataB = new Date(b.data_ag || b.data);
            return dataB - dataA;
        });

        tbody.innerHTML = "";
        delete tbody.dataset.ordemOriginal;

        if (!dados || dados.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" style="text-align: center;">Nenhum agendamento encontrado.</td>
                </tr>
            `;
            return;
        }

        dados.forEach(item => {
            const dataRaw = item.data_ag || item.data;
            let dataFormatada = "Horário não definido";

            if (dataRaw) {
                const dataObjeto = new Date(dataRaw);

                if (!isNaN(dataObjeto.getTime())) {
                    dataFormatada = dataObjeto.toLocaleString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                    });
                }
            }

            const produtosLista = Array.isArray(item.produtos) 
                ? item.produtos.map(p => p.nome).join(", ") 
                : "-";

            const tr = document.createElement("tr");
            tr.setAttribute("data-id", item.id_pedido);
            tr.setAttribute("data-data", dataRaw || "");

            tr.innerHTML = `
                <td>${item.cliente_nome || "Cliente"}</td>
                <td>${produtosLista}</td>
                <td>R$ ${Number(item.valor_total || 0).toFixed(2).replace(".", ",")}</td>
                <td>${item.qtd_total || 0}</td>
                <td>${item.origem || "-"}</td>
                <td>${item.num_pedido ?? item.id_pedido ?? "-"}</td>
                <td>
                    <input 
                        type="checkbox" class="chk-concluido" onchange="concluirAgendamento(${item.id_pedido}, this)"
                    >
                </td>
            `;
            tbody.appendChild(tr);
        });

        aplicarOrdenacaoTabela("tb_tbl_produtos", [6]);

    } catch (erro) {
        console.error("Erro ao carregar agendamentos:", erro);
        tbody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align: center;">Erro ao carregar agendamentos.</td>
            </tr>
        `;
    }
}

async function concluirAgendamento(idPedido, checkbox) {
    if (!checkbox.checked) return;
    window.checkboxAtual = checkbox;
    exibirAviso(
        "Deseja marcar este agendamento como finalizado?",
        async () => {
            try {
                const resposta = await fetch(`http://localhost:3000/agendamento/${idPedido}/finalizar`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                });

                if (!resposta.ok) {
                    throw new Error(`Erro HTTP: ${resposta.status}`);
                }

                const linha = checkbox.closest("tr");
                linha.remove();

                exibirAviso("Agendamento finalizado com sucesso!");

            } catch (erro) {
                console.error("Erro ao finalizar agendamento:", erro);
                exibirAviso("Erro ao finalizar agendamento.");
                checkbox.checked = false;
            }
        },
        true
    );
}

function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
    msgAviso.innerText = mensagem;
    bCancelarAviso.style.display = mostrarCancelar ? "inline-block" : "none";
    aviso.showModal();

    bConfirmarAviso.onclick = () => {
        aviso.close();
        if (callback) callback();
    };

    bCancelarAviso.onclick = () => {
        aviso.close();
        if (window.checkboxAtual) {
            window.checkboxAtual.checked = false;
            window.checkboxAtual.blur();
            window.checkboxAtual = null;
        }
    };
}

function normalizarTexto(texto) {
    return (texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function filtrarAgendamentos() {
    const termo = normalizarTexto(inputBusca.value);
    const dataSelecionada = filtroData.value;

    const linhas = document.querySelectorAll("#tb_tbl_produtos tr");

    linhas.forEach(linha => {
        const colunas = linha.getElementsByTagName("td");

        if (colunas.length < 6) return;

        const nomeCliente = normalizarTexto(colunas[0].textContent);
        const dataOriginal = linha.dataset.data;

        let dataLinha = "";

        if (dataOriginal) {
            const data = new Date(dataOriginal);

            if (!isNaN(data.getTime())) {
                const ano = data.getFullYear();
                const mes = String(data.getMonth() + 1).padStart(2, "0");
                const dia = String(data.getDate()).padStart(2, "0");

                dataLinha = `${ano}-${mes}-${dia}`;
            }
        }

        const correspondeNome = nomeCliente.includes(termo);
        const dataFormatada = normalizarTexto(colunas[5].textContent);
        const correspondeBuscaData = dataFormatada.includes(termo);
        const correspondeData = !dataSelecionada || dataLinha === dataSelecionada;

        if ((correspondeNome || correspondeBuscaData) && correspondeData) {
            linha.style.display = "";
        } else {
            linha.style.display = "none";
        }
    });
}

inputBusca.addEventListener("input", filtrarAgendamentos);
filtroData.addEventListener("change", filtrarAgendamentos);

function escaparHtml(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[caractere]);
}

function formatarDataCliente(valor) {
    if (!valor) return "Data não informada";
    const data = new Date(String(valor).replace(" ", "T"));
    if (Number.isNaN(data.getTime())) return escaparHtml(valor);
    return data.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function formatarValorCliente(valor) {
    return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

async function carregarClientesApp() {
    listaClientesApp.innerHTML = '<p class="clientes-app-vazio">Carregando clientes...</p>';
    resumoClientesApp.textContent = "Consultando clientes e pedidos do aplicativo...";

    try {
        const dias = Number(diasNaoRetirado.value) === 1 ? 1 : 2;
        const resposta = await fetch(`http://localhost:3000/agendamento/clientes-app?dias=${dias}`, {
            headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`
            }
        });

        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok) {
            throw new Error(dados.erro || `Erro HTTP: ${resposta.status}`);
        }

        clientesAppCache = Array.isArray(dados.clientes) ? dados.clientes : [];
        pedidosNaoRetiradosCache = Array.isArray(dados.pedidos_nao_retirados)
            ? dados.pedidos_nao_retirados
            : [];

        badgeClientesApp.textContent = String(pedidosNaoRetiradosCache.length);
        badgeClientesApp.hidden = pedidosNaoRetiradosCache.length === 0;

        resumoClientesApp.textContent =
            `${clientesAppCache.length} cliente(s) cadastrado(s) · ` +
            `${pedidosNaoRetiradosCache.length} pedido(s) não retirado(s) após ${dias} dia(s).`;

        renderizarClientesApp();
    } catch (erro) {
        console.error("Erro ao carregar clientes do app:", erro);
        resumoClientesApp.textContent = "Não foi possível carregar os clientes.";
        listaClientesApp.innerHTML = `<p class="clientes-app-erro">${escaparHtml(erro.message || "Erro ao carregar os dados.")}</p>`;
    }
}

function renderizarClientesApp() {
    const termo = normalizarTexto(buscaClientesApp.value);
    const clientes = clientesAppCache
        .filter(cliente =>
            normalizarTexto(`${cliente.nome || ""} ${cliente.email || ""}`).includes(termo)
        )
        .sort((a, b) => {
            const atrasadosA = pedidosNaoRetiradosCache.filter(
                p => Number(p.id_user) === Number(a.id_user)
            );
            const atrasadosB = pedidosNaoRetiradosCache.filter(
                p => Number(p.id_user) === Number(b.id_user)
            );

            // 1. Quem tem pedido atrasado sobe para o topo
            if (atrasadosA.length > 0 && atrasadosB.length === 0) return -1;
            if (atrasadosA.length === 0 && atrasadosB.length > 0) return 1;

            // 2. Entre dois clientes atrasados, quem tem mais dias de atraso aparece primeiro
            if (atrasadosA.length > 0 && atrasadosB.length > 0) {
                const maxDiasA = Math.max(...atrasadosA.map(p => Number(p.dias_atraso || 0)));
                const maxDiasB = Math.max(...atrasadosB.map(p => Number(p.dias_atraso || 0)));
                if (maxDiasB !== maxDiasA) return maxDiasB - maxDiasA;
            }

            // 3. Desempate por ordem alfabética do nome
            return (a.nome || "").localeCompare(b.nome || "", "pt-BR");
        });

    if (clientes.length === 0) {
        listaClientesApp.innerHTML = '<p class="clientes-app-vazio">Nenhum cliente encontrado.</p>';
        return;
    }

    listaClientesApp.innerHTML = clientes.map(cliente => {
        const idUser = Number(cliente.id_user);
        const pedidosCliente = pedidosNaoRetiradosCache.filter(
            pedido => Number(pedido.id_user) === idUser
        );
        const bloqueado = Number(cliente.bloqueado_app) === 1;
        const cadastradoEm = cliente.data_criacao
            ? formatarDataCliente(cliente.data_criacao).split(" ")[0]
            : "-";

        const pedidosHtml = pedidosCliente.length > 0
            ? `<div class="clientes-app-pedidos">
                ${pedidosCliente.map(pedido => `
                    <article class="cliente-app-pedido">
                        <div class="cliente-app-pedido-topo">
                            <strong>Pedido #${escaparHtml(pedido.num_pedido)}</strong>
                            <span>${Number(pedido.dias_atraso || 0)} dia(s) de atraso</span>
                        </div>
                        <p><b>Retirada marcada:</b> ${escaparHtml(formatarDataCliente(pedido.data_ag))}</p>
                        <p><b>Produtos:</b> ${escaparHtml(pedido.produtos || "-")}</p>
                        <p><b>Total:</b> ${escaparHtml(formatarValorCliente(pedido.valor_total))}</p>
                    </article>
                `).join("")}
            </div>`
            : '<p class="cliente-app-sem-pendencia">Nenhum pedido não retirado.</p>';

        let acao = '<span class="cliente-app-status cliente-app-status-ok">Sem pendências</span>';
        if (bloqueado) {
            acao = '<span class="cliente-app-status cliente-app-status-bloqueado">Compras pelo app bloqueadas até regularizar</span>';
        } else if (pedidosCliente.length > 0) {
            acao = `<button type="button" class="b_bloquear_cliente_app" data-id-user="${idUser}">Bloquear compras pelo app</button>`;
        }

        return `
            <article class="cliente-app-card">
                <div class="cliente-app-identificacao">
                    <div>
                        <h4>${escaparHtml(cliente.nome || "Cliente")}</h4>
                        <p>${escaparHtml(cliente.email || "E-mail não informado")}</p>
                        <small>Cadastro: ${escaparHtml(cadastradoEm)}</small>
                    </div>
                    ${acao}
                </div>
                ${pedidosHtml}
            </article>
        `;
    }).join("");
}
botaoFecharClientesApp.addEventListener("click", () => modalClientesApp.close());

diasNaoRetirado.addEventListener("change", carregarClientesApp);
buscaClientesApp.addEventListener("input", renderizarClientesApp);

listaClientesApp.addEventListener("click", event => {
    const botao = event.target.closest(".b_bloquear_cliente_app");
    if (!botao) return;

    const idUser = Number(botao.dataset.idUser);
    const cliente = clientesAppCache.find(item => Number(item.id_user) === idUser);
    const nome = cliente?.nome || "este cliente";

    exibirAviso(
        `Bloquear as compras de ${nome} pelo aplicativo até que todos os pedidos não retirados sejam regularizados?`,
        async () => {
            botao.disabled = true;
            try {
                const resposta = await fetch(`http://localhost:3000/agendamento/clientes-app/${idUser}/bloqueio`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                });

                const resultado = await resposta.json().catch(() => ({}));
                if (!resposta.ok) {
                    throw new Error(resultado.erro || `Erro HTTP: ${resposta.status}`);
                }

                await carregarClientesApp();
                exibirAviso(resultado.mensagem || "Cliente bloqueado com sucesso.");
            } catch (erro) {
                console.error("Erro ao bloquear cliente:", erro);
                botao.disabled = false;
                exibirAviso(erro.message || "Não foi possível bloquear este cliente.");
            }
        },
        true
    );
});

window.addEventListener("load", carregarAgendamentos);
</script>
</body>
</html>
