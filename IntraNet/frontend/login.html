<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">

    <title>Login</title>

    <link rel="stylesheet" href="stylelog.css">
</head>

<body>

    <div class="container">

        <div class="quadrado">

            <h1 class="lb_login">Login</h1>

            <div class="container-respostas">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    class="input-field"
                    placeholder="Digite seu email"
                >

                <br>

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    class="input-field"
                    placeholder="Sua senha"
                >

            </div>

            <p class="link-recuperar">
                <a href="rec_senha.html">Esqueceu a senha?</a>
            </p>

            <div class="container-fim">

                <p
                    id="respostas"
                    class="respostas"
                ></p>

            </div>

            <button
                id="btn_entrar"
                class="btn_entrar"
            >
                Entrar
            </button>

        </div>

    </div>

    <!-- Script de controle global da Sidebar e Autenticação -->
    <script src="sidebar_header.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const btnEntrar = document.getElementById("btn_entrar");
            const inputs = document.querySelectorAll(".input-field");

            // =====================================================
            // NORMALIZAR FOTO
            // =====================================================

            function normalizarFoto(foto) {

                if (!foto || foto === "null" || foto === "undefined") {
                    return "";
                }

                foto = String(foto).trim();

                if (foto.startsWith("http://") || foto.startsWith("https://")) {
                    return foto;
                }

                if (foto.startsWith("/imagens/")) {
                    return foto;
                }

                if (foto.startsWith("imagens/")) {
                    return "/" + foto;
                }

                return "/imagens/" + foto;
            }


            // =====================================================
            // LOGIN
            // =====================================================

            const realizarLogin = async (e) => {

                if (e) {
                    e.preventDefault();
                }

                const email = document.getElementById("email").value.trim();
                const senha = document.getElementById("senha").value;
                const pMessageEl = document.getElementById("respostas");

                // =================================================
                // VALIDAÇÃO
                // =================================================

                if (!email || !senha) {
                    pMessageEl.innerText = "Preencha todos os campos.";
                    pMessageEl.style.color = "red";
                    return;
                }

                pMessageEl.innerText = "Validando...";
                pMessageEl.style.color = "#333";

                try {

                    console.log("1. Enviando dados para o servidor...");

                    const resposta = await fetch("http://localhost:3000/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email, senha })
                    });

                    console.log("2. Resposta recebida do servidor:", resposta.status);

                    const dados = await resposta.json();

                    console.log("3. Dados retornados:", dados);

                    // =================================================
                    // LOGIN OK
                    // =================================================

                    if (resposta.ok) {

                        pMessageEl.innerText = "Login realizado! Redirecionando...";
                        pMessageEl.style.color = "green";

                        // =================================================
                        // SALVAMENTO NO LOCALSTORAGE
                        // =================================================

                        if (dados.token) {
                            localStorage.setItem("token", dados.token);
                        }

                        if (dados.usuario) {
                            localStorage.setItem("usuarioNome", dados.usuario.nome || "");
                            localStorage.setItem("usuarioEmail", dados.usuario.email || "");

                            const fotoNormalizada = normalizarFoto(dados.usuario.foto);
                            localStorage.setItem("usuarioFoto", fotoNormalizada);

                            console.log("Foto salva no LocalStorage:", fotoNormalizada);
                        }

                        console.log("4. Token e dados salvos no LocalStorage. Redirecionando...");

                        // Aguarda 100ms para garantir a gravação síncrona do Storage antes do carregamento da index.html
                        setTimeout(() => {
                            window.location.replace("index.html");
                        }, 100);

                    } else {

                        pMessageEl.innerText = dados.resposta || "Erro no login.";
                        pMessageEl.style.color = "red";

                    }

                } catch (error) {

                    console.error("ERRO NO FETCH:", error);
                    pMessageEl.innerText = "Erro ao conectar com o servidor.";
                    pMessageEl.style.color = "red";

                }

            };


            // =====================================================
            // ENTER NOS CAMPOS
            // =====================================================

            inputs.forEach((input, index) => {

                input.addEventListener("keydown", (e) => {

                    if (e.key === "Enter") {
                        e.preventDefault();

                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            realizarLogin(e);
                        }
                    }

                });

            });


            // =====================================================
            // BOTÃO ENTRAR
            // =====================================================

            btnEntrar.addEventListener("click", realizarLogin);

        });

    </script>

</body>

</html>
