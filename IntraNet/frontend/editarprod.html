<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">

    <title>Editar Produto - Grano Vita</title>

</head>

<body>

<div class="form-container">

    <h2>Editar Produto</h2>

    <form id="formProduto" enctype="multipart/form-data">

        <div class="busca-container">
            <label for="inp_busca_editar">Buscar Produto *</label>

            <input
                type="text"
                id="inp_busca_editar"
                placeholder="Digite o código ou nome do produto..."
                autocomplete="off"
            >

            <ul id="lista_sugestoes"></ul>
</div>

        <div class="form-row">

            <div class="form-group" style="flex: 2;">
                <label for="nome">Nome do Produto *</label>

                <input
                    type="text"
                    name="nome"
                    id="nome"
                    required
                    disabled
                    placeholder="Selecione um produto"
                >
            </div>

            <div class="form-group" style="flex: 1;">
                <label for="ativo">Status do Produto</label>

                <select
                    name="ativo"
                    id="ativo"
                    disabled
                >
                    <option value="1">Ativo</option>
                    <option value="0">Inativo</option>
                </select>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="valor_bruto">
                    Valor Custo/Bruto (R$) *
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="valor_bruto"
                    id="valor_bruto"
                    placeholder="0.00"
                    required
                    disabled
                >
            </div>

            <div class="form-group">
                <label for="porcentagem_lucro">
                    Lucro (%)
                </label>

                <input
                    type="number"
                    step="any"
                    name="porcentagem_lucro"
                    id="porcentagem_lucro"
                    value="50"
                    placeholder="50"
                    disabled
                >
            </div>

            <div class="form-group">
                <label for="preco">
                    Preço Venda (R$)
                </label>

                <div class="preco-venda-controle">
                    <input
                        type="text"
                        name="preco"
                        id="preco"
                        placeholder="0,00"
                        class="input-disabled"
                        inputmode="decimal"
                        readonly
                        disabled
                    >
                    <button type="button" id="btnDesbloquearPrecoEdicao" class="botao-desbloquear-preco" aria-label="Desbloquear edição do preço de venda" aria-pressed="false" title="Desbloquear preço de venda" disabled><img src="../backend/imagens/cadeado_p.png" alt="" aria-hidden="true"></button>
                </div>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="codigo">
                    Código de Barras *
                </label>

                <input
                    type="text"
                    name="codigo_barras"
                    id="codigo"
                    placeholder="Selecione um produto"
                    required
                    disabled
                >
            </div>

            <div class="form-group">
                <label for="qtd">
                    Qtd Atual
                </label>

                <input
                    type="number"
                    name="qtd"
                    id="qtd"
                    value="0"
                    min="0"
                    disabled
                >
            </div>

            <div class="form-group">
                <label for="qtd_min">
                    Qtd Mínima
                </label>

                <input
                    type="number"
                    name="qtd_min"
                    id="qtd_min"
                    value="5"
                    min="0"
                    disabled
                >
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    name="descricao"
                    id="descricao"
                    rows="3"
                    placeholder="Descrição opcional do produto..."
                    disabled
                ></textarea>

            </div>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label>
                    Imagem do Produto
                </label>

                <div class="produto-img-container">

                    <div class="produto-img">
                        <img
                            id="preview-img"
                            src="images/img_ntf.png"
                            alt="Imagem do produto"
                        >
                    </div>

                    <div class="imagem-info">

                        <input
                            type="text"
                            name="img_nome"
                            id="img_nome"
                            placeholder="Nome da imagem"
                            disabled
                        >

                        <input
                            type="file"
                            name="img"
                            id="inputImagem"
                            accept="image/*"
                            disabled
                        >

                    </div>

                </div>

            </div>

        </div>

        <div class="botoes">

            <button
                type="submit"
                class="btn-submit"
            >
                Salvar Alterações
            </button>

            <button
                type="button"
                class="btn-submit btn-cancelar"
                onclick="window.location.href='estoque.html'"
            >
                Cancelar
            </button>

        </div>

    </form>

</div>

<dialog id="d_aviso">
    <div class="aviso_box">
        <p id="msg_aviso"></p>
        <div class="aviso_botoes">
            <button id="b_confirmar_aviso">OK</button>
            <button id="b_cancelar_aviso" style="display:none;">Cancelar</button>
        </div>
    </div>
</dialog>
<script>

const nome = document.getElementById("nome");
const codigo = document.getElementById("codigo");
const preco = document.getElementById("preco");
const btnDesbloquearPreco = document.getElementById("btnDesbloquearPrecoEdicao");
const qtd = document.getElementById("qtd");
const descricao = document.getElementById("descricao");
const previewImg = document.getElementById("preview-img");
const inputImagem = document.getElementById("inputImagem");
const formProduto = document.getElementById("formProduto");
const qtdMin = document.getElementById("qtd_min");
const ativo = document.getElementById("ativo");

const inpBusca =
    document.getElementById("inp_busca_editar");

const lista =
    document.getElementById("lista_sugestoes");

const valorBruto =
    document.getElementById("valor_bruto");

const porcentagemLucro =
    document.getElementById("porcentagem_lucro");

const modalAviso =
    document.getElementById("d_aviso");

const msgAviso =
    document.getElementById("msg_aviso");

const bConfirmarAviso =
    document.getElementById("b_confirmar_aviso");

const bCancelarAviso =
    document.getElementById("b_cancelar_aviso");

const campoNomeImagem =
    document.getElementById("img_nome");

const camposEdicao = [
    nome,
    codigo,
    preco,
    btnDesbloquearPreco,
    qtd,
    qtdMin,
    ativo,
    descricao,
    campoNomeImagem,
    inputImagem,
    valorBruto,
    porcentagemLucro
];

let produtosCache = [];
let produtoSelecionado = null;
let indexSelecionado = -1;
let precoDesbloqueado = false;
let precoManualAtivo = false;

function exibirAviso(
    mensagem,
    callback = null,
    mostrarCancelar = false
) {

    msgAviso.innerHTML = mensagem;

    bCancelarAviso.style.display =
        mostrarCancelar
            ? "inline-block"
            : "none";

    modalAviso.showModal();

    bConfirmarAviso.onclick = () => {

        modalAviso.close();

        if (callback) {
            callback();
        }

    };

    bCancelarAviso.onclick = () => {
        modalAviso.close();
    };

}

codigo.addEventListener(
    "input",
    () => {

        codigo.value =
            codigo.value.replace(/\D/g, "");

    }
);

async function carregarProdutos() {

    try {

        const res = await apiFetch(
            "http://localhost:3000/produtos"
        );

        const dados =
            await res.json();

        console.log(
            "PRODUTOS CARREGADOS:",
            dados
        );

        produtosCache =
            dados.produtos || dados;

    } catch (erro) {

        console.error(
            "Erro ao carregar produtos:",
            erro
        );

    }

}

carregarProdutos();

inpBusca.addEventListener(
    "input",
    () => {

        const termo =
            inpBusca.value
                .toLowerCase();

        lista.innerHTML = "";

        indexSelecionado = -1;

        if (!termo) {
            return;
        }

        const filtrados =
            produtosCache
                .filter(p =>

                    (p.nome || "")
                        .toLowerCase()
                        .includes(termo)

                    ||

                    (p.codigo_barras || "")
                        .startsWith(termo)

                )
                .slice(0, 5);

        filtrados.forEach(p => {

            const li =
                document.createElement("li");

            li.textContent =
                p.nome;

            li.onclick = () =>
                selecionarProduto(p);

            lista.appendChild(li);

        });

    }
);

inpBusca.addEventListener(
    "keydown",
    e => {

        const itens =
            lista.querySelectorAll("li");

        if (e.key === "ArrowDown") {

            indexSelecionado++;

            if (
                indexSelecionado >=
                itens.length
            ) {
                indexSelecionado = 0;
            }

            atualizarSelecao(itens);

        }

        if (e.key === "ArrowUp") {

            indexSelecionado--;

            if (indexSelecionado < 0) {

                indexSelecionado =
                    itens.length - 1;

            }

            atualizarSelecao(itens);

        }

        if (e.key === "Enter") {

            e.preventDefault();

            if (itens[indexSelecionado]) {

                itens[indexSelecionado]
                    .click();

            }

        }

    }
);

function atualizarSelecao(itens) {

    itens.forEach(li => {

        li.classList.remove("ativo");

    });

    if (itens[indexSelecionado]) {

        itens[indexSelecionado]
            .classList
            .add("ativo");

    }

}

function converterValorMonetario(valor) {
    let texto = String(valor ?? "").trim().replace(/[^0-9,.-]/g, "");
    if (texto.includes(",") && texto.includes(".")) {
        texto = texto.replace(/\./g, "").replace(",", ".");
    } else {
        texto = texto.replace(",", ".");
    }
    return Number(texto);
}

function atualizarPorcentagemPeloPreco() {
    const bruto = converterValorMonetario(valorBruto.value);
    const venda = converterValorMonetario(preco.value);
    if (!Number.isFinite(bruto) || bruto <= 0 || !Number.isFinite(venda)) return;
    porcentagemLucro.value = (((venda / bruto) - 1) * 100).toFixed(6);
}

function calcularPrecoVenda() {
    const valorBrutoAtual = converterValorMonetario(valorBruto.value) || 0;
    const porcentagem = converterValorMonetario(porcentagemLucro.value) || 0;

    if (precoManualAtivo) {
        atualizarPorcentagemPeloPreco();
        return;
    }

    const precoVenda = valorBrutoAtual + (valorBrutoAtual * (porcentagem / 100));
    preco.value = precoVenda.toFixed(2).replace(".", ",");
}

function definirPrecoDesbloqueado(desbloqueado) {
    precoDesbloqueado = Boolean(desbloqueado);
    preco.readOnly = !precoDesbloqueado;
    preco.classList.toggle("input-disabled", !precoDesbloqueado);
    btnDesbloquearPreco.setAttribute("aria-label", precoDesbloqueado ? "Bloquear edição do preço de venda" : "Desbloquear edição do preço de venda");
    btnDesbloquearPreco.setAttribute("aria-pressed", String(precoDesbloqueado));
    btnDesbloquearPreco.title = precoDesbloqueado ? "Bloquear edição do preço de venda" : "Desbloquear preço de venda";
    if (precoDesbloqueado) {
        preco.focus();
        preco.select();
    }
}

btnDesbloquearPreco.addEventListener("click", () => {
    if (precoDesbloqueado) {
        definirPrecoDesbloqueado(false);
        return;
    }

    exibirAviso(
        "Tem certeza de que deseja desbloquear a alteração direta do preço de venda?",
        () => definirPrecoDesbloqueado(true),
        true
    );
});

preco.addEventListener("input", () => {
    if (!precoDesbloqueado) return;
    precoManualAtivo = true;
    atualizarPorcentagemPeloPreco();
});

function selecionarProduto(p) {

    produtoSelecionado = p;

    inpBusca.value =
        p.nome || "";
nome.value =
        p.nome || "";

    codigo.value =
        p.codigo_barras || "";

    valorBruto.value =
        p.valor_bruto || 0;

    porcentagemLucro.value =
        p.porcentagem_lucro || 0;

    qtd.value =
        p.qtd || 0;

    qtdMin.value =
        p.qtd_min || 0;

    descricao.value =
        p.descricao || "";

    preco.value = converterValorMonetario(p.preco).toFixed(2).replace(".", ",");
    precoManualAtivo = false;
    precoDesbloqueado = false;

    if (p.ativo !== undefined) {

        ativo.value =
            p.ativo;

    } else {

        ativo.value = "1";

    }

    if (p.img) {

        previewImg.src =
            `http://localhost:3000/images/${p.img}`;

    } else {

        previewImg.src =
            "images/img_ntf.png";

    }

    if (p.img) {

        campoNomeImagem.value =
            p.img.replace(
                /\.[[^/.]+$/,
                ""
            );

    } else {

        campoNomeImagem.value =
            "";

    }

    camposEdicao.forEach(
        campo => {

            campo.disabled = false;

        }
    );

    preco.disabled = false;
    definirPrecoDesbloqueado(false);

    lista.innerHTML = "";

}

valorBruto.addEventListener("input", calcularPrecoVenda);

porcentagemLucro.addEventListener("input", () => {
    precoManualAtivo = false;
    calcularPrecoVenda();
});

inputImagem.addEventListener(
    "change",
    () => {

        const file =
            inputImagem.files[0];

        if (file) {

            previewImg.src =
                URL.createObjectURL(file);

        }

    }
);

formProduto.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        if (!produtoSelecionado) {

            exibirAviso(
                "Selecione um produto primeiro antes de salvar alterações."
            );

            return;

        }

        const valorBrutoAtual = converterValorMonetario(valorBruto.value) || 0;
        let precoCalculado = converterValorMonetario(preco.value);
        let porcentagem = converterValorMonetario(porcentagemLucro.value) || 0;

        if (precoManualAtivo) {
            if (valorBrutoAtual <= 0 || !Number.isFinite(precoCalculado) || precoCalculado <= 0) {
                exibirAviso("Informe um custo/bruto e um preço de venda válidos.");
                return;
            }
            porcentagem = ((precoCalculado / valorBrutoAtual) - 1) * 100;
            porcentagemLucro.value = porcentagem.toFixed(6);
        } else {
            precoCalculado = valorBrutoAtual + (valorBrutoAtual * (porcentagem / 100));
            preco.value = precoCalculado.toFixed(2).replace(".", ",");
        }

        if (!Number.isFinite(precoCalculado) || precoCalculado <= 0) {
            exibirAviso("O preço de venda precisa ser maior que zero.");
            return;
        }

        const formData =
            new FormData(formProduto);

        formData.set(
            "valor_bruto",
            valorBrutoAtual
        );

        formData.set(
            "porcentagem_lucro",
            porcentagem
        );

        formData.set(
            "preco",
            precoCalculado.toFixed(2)
        );

        try {

            const res =
                await apiFetch(
                    `http://localhost:3000/produtos/cod/${produtoSelecionado.id_produto}`,
                    {
                        method: "PUT",
                        body: formData
                    }
                );

            if (res.ok) {

                exibirAviso(
                    "Produto atualizado com sucesso!",
                    () => {

                        formProduto.reset();

                        produtoSelecionado =
                            null;
previewImg.src =
                            "images/img_ntf.png";

                        inpBusca.value =
                            "";

                        camposEdicao.forEach(
                            campo => {

                                campo.disabled =
                                    true;

                            }
                        );

                        preco.disabled = true;
                        preco.readOnly = true;
                        preco.classList.add("input-disabled");
                        precoDesbloqueado = false;
                        precoManualAtivo = false;
                        btnDesbloquearPreco.setAttribute("aria-label", "Desbloquear edição do preço de venda");
                        btnDesbloquearPreco.setAttribute("aria-pressed", "false");
                        carregarProdutos();

                    }
                );

            } else {

                const dados =
                    await res
                        .json()
                        .catch(
                            () => ({})
                        );

                exibirAviso(
                    dados.erro ||
                    "Erro ao atualizar o produto no servidor."
                );

            }

        } catch (erro) {

            console.error(
                "Erro:",
                erro
            );

            exibirAviso(
                "Erro de conexão com o servidor."
            );

        }

    }
);

</script>

</body>
</html>
