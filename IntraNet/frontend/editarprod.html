<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <title>Editar Produto</title>
    <script>
        // Verifica se existe um token no localStorage
        const token = localStorage.getItem("token");
    
        if (!token) {
            // Se não tem token, impede a leitura do HTML e joga para o login
            window.location.replace("login.html");
        }
    </script>
</head>

<body class="fundo-escuro">


   <form id="formProduto" enctype="multipart/form-data" class="form-editar-produto">
    <h2>Editar Produto</h2>

    <div class="container-flex">

        <!-- COLUNA ESQUERDA -->
        <div class="coluna">

            <label class="label-amarela">Buscar Produto</label>

            <input
                type="text"
                class="inp_m"
                id="inp_busca_editar"
                placeholder="Código ou nome"
            >

            <ul id="lista_sugestoes"></ul>

            <p class="pm selecionado-produto">
                Selecionado:
                <span id="s_produto">---</span>
            </p>

            <div class="produto-img">
    <img id="preview-img" src="images/img_ntf.png">
        </div>

            <label class="label-amarela" style="margin-top:12px;">Nome da Imagem</label>

            <input
                type="text"
                name="img_nome"
                id="img_nome"
                class="inp_p"
                placeholder="Ex: strog_carne"
                disabled
            >

            <label id="labelTrocarImagem" class="file-label file-label-editar">
                Trocar Imagem
                <input type="file" name="img" id="inputImagem" accept="image/*" disabled>
            </label>

        </div>


        <!-- COLUNA DIREITA -->
        <div class="coluna">

            <label class="label-amarela">Nome</label>
            <input type="text" name="nome" id="nome" class="inp_p" disabled>

            <div class="linha-campos">

                <div>
                    <label class="label-amarela">Código</label>
                    <input
                        type="text"
                        name="codigo_barras"
                        id="codigo"
                        class="inp_p"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        disabled
                    >
                </div>

                <div>
                    <label class="label-amarela">Preço</label>
                    <input
                        type="number"
                        step="0.01"
                        name="preco"
                        id="preco"
                        class="inp_p"
                        disabled
                    >
                </div>

            </div>

            <label class="label-amarela">Quantidade em Estoque</label>
            <input type="number" name="qtd" id="qtd" class="inp_p" disabled>

            <label class="label-amarela">Qtd. Mínima</label>
            <input type="number" name="qtd_min" id="qtd_min" class="inp_p" disabled>

            <label class="label-amarela">Descrição</label>
            <textarea
                name="descricao"
                id="descricao"
                class="inp_p descricao-produto"
                disabled
            ></textarea>

        </div>

    </div>


    <!-- BOTÕES ABAIXO DAS DUAS COLUNAS -->
    <div class="botoes-fileira">

        <button type="submit" class="btn-p">
            Salvar Alterações
        </button>

        <button
            type="button"
            onclick="window.location.href='estoque.html'"
            class="btn-p btn-cinza"
        >
            Cancelar
        </button>

    </div>

</form>

<dialog id="d_aviso">
    <div class="aviso_box">
        <div id="msg_aviso"></div>
        <div class="aviso_botoes">
            <button id="b_confirmar_aviso">OK</button>
            <button id="b_cancelar_aviso">Cancelar</button>
        </div>
    </div>
</dialog>

<script>
const nome = document.getElementById("nome");
const codigo = document.getElementById("codigo");
const preco = document.getElementById("preco");
const qtd = document.getElementById("qtd");
const descricao = document.getElementById("descricao");
const previewImg = document.getElementById("preview-img");
const inputImagem = document.getElementById("inputImagem");
const formProduto = document.getElementById("formProduto");
const qtdMin = document.getElementById("qtd_min"); 
const inpBusca = document.getElementById("inp_busca_editar");
const lista = document.getElementById("lista_sugestoes");

const modalAviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");
const campoNomeImagem = document.getElementById("img_nome");
const labelTrocarImagem = document.getElementById("labelTrocarImagem");
const camposEdicao = [
    nome,
    codigo,
    preco,
    qtd,
    qtdMin,
    descricao,
    campoNomeImagem,
    inputImagem
];

let produtosCache = [];
let produtoSelecionado = null;
let indexSelecionado = -1;

// Função genérica de aviso estruturada com o seu layout CSS
function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
    msgAviso.innerHTML = mensagem;
    
    bCancelarAviso.style.display = mostrarCancelar ? "inline-block" : "none";

    modalAviso.showModal();

    bConfirmarAviso.onclick = () => {
        modalAviso.close();
        if (callback) callback();
    };

    bCancelarAviso.onclick = () => {
        modalAviso.close();
    };
}
// Permite somente números no código de barras
codigo.addEventListener("input", () => {
    codigo.value = codigo.value.replace(/\D/g, "");
});

// carregar produtos
async function carregarProdutos(){
    const res = await apiFetch("http://localhost:3000/produtos");
    produtosCache = await res.json();
}
carregarProdutos();

// busca
inpBusca.addEventListener("input", () => {
    const termo = inpBusca.value.toLowerCase();
    lista.innerHTML = "";
    indexSelecionado = -1;

    if(!termo) return;

    const filtrados = produtosCache.filter(p =>
        (p.nome || "").toLowerCase().includes(termo) ||
        (p.codigo_barras || "").startsWith(termo)
    ).slice(0, 5);

    filtrados.forEach((p, i) => {
        const li = document.createElement("li");
        li.textContent = p.nome;

        li.onclick = () => selecionarProduto(p);

        lista.appendChild(li);
    });
});

// teclado (↑ ↓ ENTER)
inpBusca.addEventListener("keydown", (e) => {
    const itens = lista.querySelectorAll("li");

    if(e.key === "ArrowDown"){
        indexSelecionado++;
        if(indexSelecionado >= itens.length) indexSelecionado = 0;
        atualizarSelecao(itens);
    }

    if(e.key === "ArrowUp"){
        indexSelecionado--;
        if(indexSelecionado < 0) indexSelecionado = itens.length - 1;
        atualizarSelecao(itens);
    }

    if(e.key === "Enter"){
        e.preventDefault();
        if(itens[indexSelecionado]){
            itens[indexSelecionado].click();
        }
    }
});

function atualizarSelecao(itens){
    itens.forEach(li => li.classList.remove("ativo"));

    if(itens[indexSelecionado]){
        itens[indexSelecionado].classList.add("ativo");
    }
}

// selecionar produto
function selecionarProduto(p){
    produtoSelecionado = p;

    inpBusca.value = p.nome;
    document.getElementById("s_produto").innerText = p.nome;

    if(nome) nome.value = p.nome || "";
    if(codigo) codigo.value = p.codigo_barras || "";
    if(preco) preco.value = p.preco || 0;
    if(qtd) qtd.value = p.qtd || 0;
    if(descricao) descricao.value = p.descricao || "";
    if(qtdMin) qtdMin.value = p.qtd_min || 0;

    // IMAGEM ATUAL
    if(p.img){
        previewImg.src = `http://localhost:3000/images/${p.img}`;
        previewImg.style.display = "block";
    } else {
        previewImg.src = "images/img_ntf.png";
    }

    // NOME DA IMAGEM
    if (p.img) {
        campoNomeImagem.value = p.img.replace(/\.[^/.]+$/, "");
    } else {
        campoNomeImagem.value = "";
    }

// HABILITA TODOS OS CAMPOS DE EDIÇÃO
camposEdicao.forEach(campo => {
    campo.disabled = false;
});

labelTrocarImagem.classList.add("habilitado");
lista.innerHTML = "";
}

// preview imagem
inputImagem.addEventListener("change", () => {
    const file = inputImagem.files[0];
    if(file){
        previewImg.src = URL.createObjectURL(file);
    }
});

// salvar
formProduto.addEventListener("submit", async (e)=>{
    e.preventDefault();

    if(!produtoSelecionado){
        exibirAviso("Selecione um produto primeiro antes de salvar alterações.");
        return;
    }

    const formData = new FormData(formProduto);
    

    try {
        console.log(formData.get("img"));
        const res = await apiFetch(`http://localhost:3000/produtos/cod/${produtoSelecionado.id_produto}`, {
            method: "PUT",
            body: formData
        });

        if (res.ok) {
            exibirAviso("Produto atualizado com sucesso!", () => {
               formProduto.reset();

                produtoSelecionado = null;

                document.getElementById("s_produto").innerText = "---";

                previewImg.src = "images/img_ntf.png";

                inpBusca.value = "";

                // BLOQUEIA TODOS OS CAMPOS NOVAMENTE
camposEdicao.forEach(campo => {
    campo.disabled = true;
});

labelTrocarImagem.classList.remove("habilitado");
                formProduto.reset(); 
                produtoSelecionado = null;

                document.getElementById("s_produto").innerText = "---"; 
                previewImg.src = "images/img_ntf.png"; 
                inpBusca.value = ""; 
                labelTrocarImagem.classList.remove("habilitado");

                                
                carregarProdutos(); 
            });
        } else {
            exibirAviso("Erro ao atualizar o produto no servidor.");
        }
    } catch (erro) {
        console.error("Erro:", erro);
        exibirAviso("Erro de conexão com o servidor.");
    }
});
</script>

</body>
</html>
