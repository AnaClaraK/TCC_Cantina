<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes Fiado</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="styleag_es.css">
    <link rel="stylesheet" href="style_clientef.css">
    <script src="sidebar_header.js"></script>
    <script>
        (function() {
            const token = localStorage.getItem("token");
            if (!token) {
                exibirAviso("Acesso restrito! Redirecionando para o login...");
                window.location.replace("login.html"); 
                throw new Error("Acesso negado: Redirecionando...");
            }
        })();
    </script>
</head>

<body class="fundo-escuro">

<div class="d_util">
    <h2 class="h_ag">Contas</h2>
    <button id="b_addq"><span id="s_addq">Novo Cliente</span></button>
    <button id="b_nova_compra">Nova Compra</button>

    <div id="d_inp">
        <div class="busca-box">
            <img src="/imagens/lupa.png" class="icone-busca">
            <input type="text" id="inputBusca" placeholder="Buscar cliente...">
        </div>
    </div>
</div>

<section id="sc_tabela" class="container mt-5">
    <table class="tabela">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Produtos</th>
                <th>Total</th>
                <th>Quantidade</th>
                <th>Origem</th>
                <th>Data Venc.</th>
                <th>Concluir</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</section>

<!-- MODAL NOVO CLIENTE -->
<dialog id="modal_cliente">
    <div class="modal_box">
        <button id="b_close_modal_cliente">x</button>
        <h2 class="modal_titulo">Novo Cliente</h2>
        <input class="inp_m" id="nome" placeholder="Nome completo">
        <input class="inp_m" id="cpf" placeholder="CPF">
        <input class="inp_m" id="telefone" placeholder="Telefone">
        <input class="inp_m" id="endereco" placeholder="Endereço">
        <button id="b_addf">Cadastrar</button>
    </div>
</dialog>

<!-- MODAL ADICIONAR COMPRA (Sem forma de pagamento, entra direto como Fiado) -->
<dialog id="d_modal_fiado">
    <div class="modal_box">
        <button id="b_close_modal">x</button>
        <h2 class="modal_titulo">Nova Compra Fiado</h2>
        
        <input type="text" class="inp_m" id="inp_busca_cliente" placeholder="Buscar cliente...">
        <ul id="lista_clientes"></ul>

        <p class="pm">Cliente: <span id="s_cliente">---</span></p>
        <button id="b_abrir_produtos">Adicionar Produtos</button>
        <div id="produtos_selecionados"></div>

        <p class="pm">Total: <span id="s_total_fiado">R$ 0,00</span></p>

        <label class="pm" style="display:block; margin-top:10px;">Data de Vencimento:</label>
        <input type="date" class="inp_m" id="inp_data_fiado">

        <button id="b_salvar_fiado">Salvar Compra</button>
    </div>
</dialog>

<!-- MODAL PRODUTOS -->
<dialog id="d_modal_produtos">
    <div class="modal_box">
        <button id="b_close_produtos">x</button>
        <h2 class="modal_titulo">Selecionar Produtos</h2>
        <input type="text" class="inp_m" id="inp_busca_produto" placeholder="Buscar produto...">
        <ul id="lista_produtos"></ul>
        <div id="area_produtos_modal"></div>
        <button id="b_salvar_produtos">Salvar Produtos</button>
    </div>
</dialog>

<!-- MODAL AVISO / CONCLUSÃO DE PAGAMENTO -->
<dialog id="d_aviso">
    <div class="aviso_box">
        <div id="msg_aviso"></div>
        
        <div id="menuFiltroPagamento" style="display:none; margin-top:15px;">

            <div class="itemFiltro ativo" data-pag="Dinheiro">
                Dinheiro
            </div>
        
            <div class="itemFiltro" data-pag="Pix">
                Pix
            </div>
        
            <div class="itemFiltro" data-pag="Cartão de Crédito">
                Cartão de Crédito
            </div>
        
            <div class="itemFiltro" data-pag="Cartão de Débito">
                Cartão de Débito
            </div>
        
        </div>

        <div class="aviso_botoes" style="margin-top: 20px;">
            <button id="b_confirmar_aviso">OK</button>
            <button id="b_cancelar_aviso">Cancelar</button>
        </div>
    </div>
</dialog>

<script>
const modalFiado = document.getElementById("d_modal_fiado");
const modalProdutos = document.getElementById("d_modal_produtos");
const modalCliente = document.getElementById("modal_cliente");
const listaClientes = document.getElementById("lista_clientes");
const listaProdutos = document.getElementById("lista_produtos");
const areaProdutosModal = document.getElementById("area_produtos_modal");
const areaProdutosPrincipal = document.getElementById("produtos_selecionados");
const modalAviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");
let clientesCache = [];
let produtosCache = [];
let clienteSelecionado = null;
let produtosSelecionados = [];
let clientePendente = null;
let checkboxAtual = null;

/* MODAIS */
document.getElementById("b_nova_compra").onclick = async () => {
    limparCompra();
    modalFiado.showModal();
    await carregarClientesModal();
};

document.getElementById("b_addq").onclick = () => { modalCliente.showModal(); };
document.getElementById("b_close_modal").onclick = () => { modalFiado.close(); };
document.getElementById("b_close_produtos").onclick = () => { modalProdutos.close(); };
document.getElementById("b_close_modal_cliente").onclick = () => { modalCliente.close(); };

/* CLIENTES */
async function carregarClientesModal(){
    const res = await fetch("http://localhost:3000/clientes-fiado", {
        headers: { Authorization: `Bearer ${localStorage.getItem("token")}` }
    });
    clientesCache = await res.json();
}

function renderClientes(clientes){
    listaClientes.innerHTML = "";
    if(clientes.length <= 0){
        listaClientes.style.display = "none";
        return;
    }
    listaClientes.style.display = "block";
    clientes.slice(0, 10).forEach(cliente => {
        const li = document.createElement("li");
        li.innerText = cliente.nome_completo;
        li.onclick = () => { tentarSelecionarCliente(cliente); };
        listaClientes.appendChild(li);
    });
}

function tentarSelecionarCliente(cliente){
    if(clienteSelecionado && produtosSelecionados.length > 0 && clienteSelecionado.id_cliente !== cliente.id_cliente){
        clientePendente = cliente;
        exibirAviso("Trocar cliente removerá os produtos atuais. Continuar?", () => {
            produtosSelecionados = [];
            renderProdutosSelecionados();
            selecionarCliente(clientePendente);
            clientePendente = null;
        }, true);
        return;
    }
    selecionarCliente(cliente);
}

function selecionarCliente(cliente){
    clienteSelecionado = cliente;
    document.getElementById("s_cliente").innerText = cliente.nome_completo;
    document.getElementById("inp_busca_cliente").value = cliente.nome_completo;
    listaClientes.innerHTML = "";
    listaClientes.style.display = "none";
}

document.getElementById("inp_busca_cliente").addEventListener("input", function(){
    const termo = this.value.toLowerCase().trim();
    if(!termo){
        listaClientes.style.display = "none";
        return;
    }
    const filtrados = clientesCache.filter(c => c.nome_completo.toLowerCase().includes(termo));
    renderClientes(filtrados);
});

/* PRODUTOS */
document.getElementById("b_abrir_produtos").onclick = async () => {
    if(!clienteSelecionado){
        exibirAviso("Selecione um cliente primeiro");
        return;
    }
    modalProdutos.showModal();
    if(Array.isArray(produtosCache) && produtosCache.length > 0){
        renderProdutos(produtosCache);
        return;
    }
    try{
        const res = await fetch("http://localhost:3000/produtos", {
            headers: { Authorization: `Bearer ${localStorage.getItem("token")}` }
        });
        produtosCache = await res.json();
        renderProdutos(produtosCache);
    }catch(err){
        exibirAviso("Erro de conexão ao carregar produtos");
    }
};

function renderProdutos(produtos){
    listaProdutos.innerHTML = "";
    produtos.slice(0, 10).forEach(produto => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${produto.nome}</span> <span>R$ ${Number(produto.preco).toFixed(2).replace(".", ",")}</span>`;
        li.onclick = () => { adicionarProduto(produto); };
        listaProdutos.appendChild(li);
    });
}

document.getElementById("inp_busca_produto").addEventListener("input", function(){
    const termo = this.value.toLowerCase();
    const filtrados = produtosCache.filter(p => p.nome.toLowerCase().includes(termo));
    renderProdutos(filtrados);
});

function adicionarProduto(produto){
    const existe = produtosSelecionados.find(p => p.id_produto === produto.id_produto);
    const estoque = Number(produto.qtd);
    if(existe){
        if(existe.qtdSelecionada >= estoque){
            exibirAviso("Estoque máximo atingido");
            return;
        }
        existe.qtdSelecionada++;
    }else{
        if(estoque <= 0){
            exibirAviso("Produto sem estoque");
            return;
        }
        produtosSelecionados.push({ ...produto, estoque: estoque, qtdSelecionada: 1 });
    }
    renderProdutosSelecionados();
}

function alterarQtd(id, valor){
    const produto = produtosSelecionados.find(p => p.id_produto === id);
    if(!produto) return;
    if(valor > 0 && produto.qtdSelecionada >= produto.estoque){
        exibirAviso("Limite do estoque");
        return;
    }
    produto.qtdSelecionada += valor;
    if(produto.qtdSelecionada <= 0){
        produtosSelecionados = produtosSelecionados.filter(p => p.id_produto !== id);
    }
    renderProdutosSelecionados();
}

function atualizarQtdManual(id, valor){
    const produto = produtosSelecionados.find(p => p.id_produto === id);
    if(!produto) return;
    valor = Number(valor);
    if(valor > produto.estoque){
        valor = produto.estoque;
        exibirAviso("Quantidade ajustada ao estoque");
    }
    if(valor <= 0){
        produtosSelecionados = produtosSelecionados.filter(p => p.id_produto !== id);
    }else{
        produto.qtdSelecionada = valor;
    }
    renderProdutosSelecionados();
}

function renderProdutosSelecionados(){
    areaProdutosModal.innerHTML = "";
    areaProdutosPrincipal.innerHTML = "";
    let total = 0;

    produtosSelecionados.forEach(produto => {
        total += Number(produto.preco) * produto.qtdSelecionada;
        const html = `
            <div class="produto_item_modal">
                <div class="produto_nome_modal">${produto.nome}</div>
                <div class="controles_qtd">
                    <button class="btn_qtd" onclick="alterarQtd(${produto.id_produto}, -1)">-</button>
                    <input class="inp_qtd_modal" value="${produto.qtdSelecionada}" onchange="atualizarQtdManual(${produto.id_produto}, this.value)">
                    <button class="btn_qtd" onclick="alterarQtd(${produto.id_produto}, 1)">+</button>
                </div>
            </div>`;
        areaProdutosModal.innerHTML += html;
        areaProdutosPrincipal.innerHTML += html;
    });
    document.getElementById("s_total_fiado").innerText = `R$ ${total.toFixed(2).replace(".", ",")}`;
}

document.getElementById("b_salvar_produtos").onclick = () => { modalProdutos.close(); };

/* SALVAR COMPRA INICIAL */
document.getElementById("b_salvar_fiado").onclick = async () => {
    const data = document.getElementById("inp_data_fiado").value;

    if(!clienteSelecionado){ exibirAviso("Selecione um cliente"); return; }
    if(produtosSelecionados.length <= 0){ exibirAviso("Adicione produtos"); return; }
    if(!data){ exibirAviso("Selecione uma data de vencimento"); return; }

    const total = produtosSelecionados.reduce((acc, p) => acc + (Number(p.preco) * p.qtdSelecionada), 0);

    const res = await fetch("http://localhost:3000/contas-fiado", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${localStorage.getItem("token")}`
        },
        body: JSON.stringify({
            id_cliente: clienteSelecionado.id_cliente,
            valor: total,
            vencimento: data,
            produtos: produtosSelecionados
        })
    });

    if(res.ok){
        exibirAviso("Compra salva com sucesso!");
        modalFiado.close();
        limparCompra();
        carregarContasFiado();
    }else{
        exibirAviso("Erro ao salvar a compra.");
    }
};

/* CADASTRO CLIENTE */
document.getElementById("b_addf").onclick = async () => {
    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const endereco = document.getElementById("endereco").value.trim();

    if (!nome || !cpf || !telefone || !endereco) {
        exibirAviso("Por favor, preencha todas as informações.");
        return; 
    }

    const res = await fetch("http://localhost:3000/clientes-fiado", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${localStorage.getItem("token")}`
        },
        body: JSON.stringify({ nome_completo: nome, cpf, telefone, endereco })
    });

    if (res.ok) {
        exibirAviso("Cliente cadastrado com sucesso!");
        modalCliente.close();
        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("endereco").value = "";
        carregarClientesModal();
    }
};
const menuFiltroPagamento =
document.getElementById("menuFiltroPagamento");

let formaPagamentoSelecionada = "Pix";

document
.querySelectorAll("#menuFiltroPagamento .itemFiltro")
.forEach(item => {

    item.onclick = () => {

        document
        .querySelectorAll("#menuFiltroPagamento .itemFiltro")
        .forEach(i => i.classList.remove("ativo"));

        item.classList.add("ativo");

        formaPagamentoSelecionada =
        item.dataset.pag;
    };
});

/* AVISOS E PAGAMENTO COMPLETO */
function exibirAviso(
    mensagem,
    callback = null,
    mostrarCancelar = false,
    mostrarPagamento = false
){

    msgAviso.innerText = mensagem;

    menuFiltroPagamento.style.display =
    mostrarPagamento
    ? "block"
    : "none";

    bCancelarAviso.style.display =
    mostrarCancelar
    ? "block"
    : "none";

    modalAviso.showModal();

    bConfirmarAviso.onclick = () => {

        modalAviso.close();

        if(callback){
            callback();
        }
    };

    bCancelarAviso.onclick = () => {

        modalAviso.close();

        if(checkboxAtual){

            checkboxAtual.checked = false;
            checkboxAtual = null;
        }
    };
}

function limparCompra(){
    clienteSelecionado = null;
    produtosSelecionados = [];
    document.getElementById("s_cliente").innerText = "---";
    document.getElementById("inp_busca_cliente").value = "";
    document.getElementById("inp_data_fiado").value = "";
    document.getElementById("s_total_fiado").innerText = "R$ 0,00";
    areaProdutosModal.innerHTML = "";
    areaProdutosPrincipal.innerHTML = "";
    listaClientes.style.display = "none";
}

/* CARREGAR TABELA PRINCIPAL */
async function carregarContasFiado(){
    const res = await fetch("http://localhost:3000/contas-fiado", {
        headers: { Authorization: `Bearer ${localStorage.getItem("token")}` }
    });
    const dados = await res.json();
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    dados.forEach(conta => {
        const dataFormatada = conta.data_vencimento ? conta.data_vencimento.split("T")[0].split("-").reverse().join("/") : "-";
        tbody.innerHTML += `
            <tr>
                <td>${conta.nome_completo}</td>
                <td>${conta.produtos || "-"}</td>
                <td>R$ ${Number(conta.valor_final).toFixed(2).replace(".", ",")}</td>
                <td>${conta.quantidade_total || 0}</td>
                <td>${conta.origem}</td>
                <td>${dataFormatada}</td>
                <td>
                    ${conta.status === "Finalizado" ? "✅" : `<input type="checkbox" class="chk-concluido" onchange="abrirModalPagamento(${conta.id_pedido}, this)">`}
                </td>
            </tr>`;
    });
}

function abrirModalPagamento(idPedido, checkbox){
    if(!checkbox.checked) return;
    checkboxAtual = checkbox;

    // Dispara o modal passando 'true' para ativar a caixa de seleção de pagamento
    exibirAviso("Deseja concluir o pagamento desta conta fiado?", async () => {
        const formaEscolhida =formaPagamentoSelecionada;
        await pagarConta(idPedido, formaEscolhida);
    }, true, true);
}

async function pagarConta(idPedido, formaPagamento){
    const res = await fetch(`http://localhost:3000/contas-fiado/${idPedido}/pagar`, {
        method: "PUT",
        headers: { 
            "Content-Type": "application/json",
            Authorization: `Bearer ${localStorage.getItem("token")}` 
        },
        body: JSON.stringify({ form_pag: formaPagamento })
    });

    if(res.ok){
        carregarContasFiado();
    }else{
        exibirAviso("Erro ao processar pagamento.");
        if(checkboxAtual) checkboxAtual.checked = false;
    }
}

carregarContasFiado();
</script>
</body>
</html>
