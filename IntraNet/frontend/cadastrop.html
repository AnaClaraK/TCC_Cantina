<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <script src="sidebar_header.js"></script>
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <script>
        (function() {
            const token = localStorage.getItem("token");
    
            if (!token) {
                // Como o diálogo ainda não carregou aqui no head, mantemos a estratégia de segurança
                exibirAviso("Acesso restrito! Redirecionando para o login...");
                window.location.replace("login.html"); 
                throw new Error("Acesso negado: Redirecionando...");
            }
        })();
    </script>
</head>
<body class="fundo-escuro">
    <main class="main-cadastro">
        <form id="formProduto" enctype="multipart/form-data" novalidate>
            <h2>Cadastro de Produto</h2>

            <input type="text" name="codigo" id="codigo" class="inp_p" placeholder="Código">
            <input type="text" name="nome" id="nome" class="inp_p" placeholder="Nome">
            <input type="text" name="descricao" id="descricao" class="inp_p" placeholder="Descrição">
            <input type="number" name="preco" id="preco" class="inp_p" placeholder="Preço" step="0.01">
            <input type="number" name="quantidade" id="quantidade" class="inp_p" placeholder="Quantidade">
            <select name="id_categoria" id="categoria" class="inp_p">
                <option value="">Selecione a categoria</option>
            </select>
            <label class="file-label">
                Escolher imagem do produto
                <input type="file" name="imagem" id="inputImagem" accept="image/*">
            </label>

            <img id="preview">

            <button type="submit" class="btn-form">Cadastrar Produto</button>
        </form>
    </main>

    <dialog id="d_aviso">
        <div class="aviso_box">
            <p id="msg_aviso"></p>
            <div class="aviso_botoes">
                <button id="b_confirmar_aviso">OK</button>
                <button id="b_cancelar_aviso" style="display:none;">Cancelar</button>
            </div>
        </div>
    </dialog>

    <script>
        // Variáveis para o novo aviso
        const aviso = document.getElementById("d_aviso");
        const msgAviso = document.getElementById("msg_aviso");
        const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
        const bCancelarAviso = document.getElementById("b_cancelar_aviso");

        // Função para exibir aviso bonitinho
        function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
            msgAviso.innerText = mensagem;
            bCancelarAviso.style.display = mostrarCancelar ? "block" : "none";

            aviso.showModal();

            bConfirmarAviso.onclick = () => {
                aviso.close();
                if (callback) callback();
            };

            bCancelarAviso.onclick = () => {
                aviso.close();

                if (window.checkboxAtual) {
                    window.checkboxAtual.checked = false;
                    window.checkboxAtual.blur();
                    window.checkboxAtual = null;
                }
            };
        }

        const inputImagem = document.getElementById("inputImagem");
        const preview = document.getElementById("preview");

        inputImagem.addEventListener("change", () => {
            const file = inputImagem.files[0];
            if(file){
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });

        document.getElementById("formProduto").addEventListener("submit", async (e) => {
            e.preventDefault();

            // Pega os valores dos campos para validação manual
            const codigo = document.getElementById("codigo").value.trim();
            const nome = document.getElementById("nome").value.trim();
            const preco = document.getElementById("preco").value;
            const qtd = document.getElementById("quantidade").value;
            const categoria = document.getElementById("categoria").value;

            // Validações que disparam o seu Modal Customizado
            if (nome === "---" || !codigo || !nome) {
                exibirAviso("Por favor, preencha o código e o nome do produto corretamente.");
                return;
            }

            if (!preco || preco <= 0) {
                exibirAviso("Digite um preço válido.");
                return;
            }

            if (!qtd || qtd <= 0) {
                exibirAviso("Digite uma quantidade válida.");
                return;
            }

            if (!categoria) {
                exibirAviso("Selecione uma categoria para o produto.");
                return;
            }

            const formData = new FormData(e.target);

            try {
                const res = await apiFetch("http://localhost:3000/produtos", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if(res.ok){
                    exibirAviso(data.mensagem || "Produto cadastrado com sucesso!");
                    e.target.reset();
                    preview.style.display = "none";
                }
                else{
                    exibirAviso(data.erro || "Erro ao cadastrar.");
                }
            } catch (err) {
                exibirAviso("Erro de servidor.");
            }
        });

        async function carregarCategorias() {
            try {
                const res = await apiFetch("http://localhost:3000/categorias");
                const categorias = await res.json();
                const select = document.getElementById("categoria");

                categorias.forEach(cat => {
                    select.innerHTML += `
                        <option value="${cat.id_categoria}">
                            ${cat.nome}
                        </option>
                    `;
                });
            } catch (err) {
                console.error(err);
                exibirAviso("Erro ao carregar categorias");
            }
        }

        carregarCategorias();
    </script>
</body>
</html>
