<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <title>Cadastro de Produtos - Grano Vita</title>
</head>

<body class="fundo-laranja">

    <div class="form-container">
        <h2>Cadastrar Novo Produto</h2>

        <form id="form_cadastrar_produto" enctype="multipart/form-data">

            <!-- NOME E CATEGORIA -->
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="nome">Nome do Produto *</label>
                    <input type="text" id="nome" required placeholder="Ex: Pão de Queijo">
                </div>

                <div class="form-group" style="flex: 1;">
                    <label for="id_categoria">Categoria *</label>
                    <select id="id_categoria" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
            </div>

            <!-- VALOR BRUTO, LUCRO E PREÇO DE VENDA -->
            <div class="form-row">
                <div class="form-group">
                    <label for="valor_bruto">Valor Custo/Bruto (R$) *</label>
                    <input type="number" step="0.01" id="valor_bruto" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="porcentagem_lucro">Lucro (%)</label>
                    <input type="number" step="0.1" id="porcentagem_lucro" value="50" placeholder="50">
                </div>

                <div class="form-group">
                    <label for="preco_final">Preço Venda (R$)</label>
                    <input type="text" id="preco_final" placeholder="0,00" class="input-disabled" readonly>
                </div>
            </div>

            <!-- CÓDIGO DE BARRAS E ESTOQUE -->
            <div class="form-row">
                <div class="form-group">
                    <label for="codigo">Código de Barras *</label>
                    <input type="text" id="codigo" placeholder="Buscando..." required>
                </div>

                <div class="form-group">
                    <label for="quantidade">Qtd Atual</label>
                    <input type="number" id="quantidade" placeholder="0" min="0">
                </div>

                <div class="form-group">
                    <label for="qtd_min">Qtd Mínima</label>
                    <input type="number" id="qtd_min" placeholder="5" min="0">
                </div>
            </div>

            <!-- DESCRIÇÃO E IMAGEM -->
            <div class="form-row">
                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="3" placeholder="Descrição opcional do produto..."></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="imagem">Imagem do Produto</label>
                    <input type="file" id="imagem" accept="image/*">
                </div>
            </div>

            <button type="submit" class="btn-submit">Cadastrar Produto</button>
        </form>
    </div>

    <!-- MODAL NOVA CATEGORIA -->
    <dialog id="modalNovaCategoria">
        <div class="modal-categoria-box">
            <h2>Nova Categoria</h2>
            <p>Cadastre uma nova categoria para utilizar nos produtos.</p>

            <form id="formNovaCategoria">
                <label for="nomeNovaCategoria">Nome da categoria *</label>
                <input
                    type="text"
                    id="nomeNovaCategoria"
                    maxlength="100"
                    required
                    placeholder="Ex: Bebidas"
                >

                <div class="modal-categoria-acoes">
                    <button type="button" id="btnCancelarCategoria">Cancelar</button>
                    <button type="submit" id="btnSalvarCategoria">Cadastrar categoria</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- MODAL DE AVISO PADRÃO (IGUAL AO PDV) -->
    <dialog id="d_aviso">
        <div class="aviso_box">
            <p id="msg_aviso"></p>
            <div class="aviso_botoes">
                <button id="b_confirmar_aviso">OK</button>
                <button id="b_cancelar_aviso" style="display:none;">Cancelar</button>
            </div>
        </div>
    </dialog>

    <script>
        const API_BASE_URL = "http://localhost:3000";

        // Seletores do modal de aviso customizado
        const aviso = document.getElementById("d_aviso");
        const msgAviso = document.getElementById("msg_aviso");
        const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
        const bCancelarAviso = document.getElementById("b_cancelar_aviso");

        // Função padronizada para exibir avisos em substituição ao alert/confirm
        function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
            msgAviso.innerText = mensagem;
            bCancelarAviso.style.display = mostrarCancelar ? "block" : "none";

            try {
                aviso.showModal();
            } catch (e) {
                console.error("Erro ao abrir modal de aviso:", e);
            }

            bConfirmarAviso.onclick = () => {
                aviso.close();
                if (callback) callback();
            };

            bCancelarAviso.onclick = () => {
                aviso.close();
            };
        }

        aviso.addEventListener("cancel", (event) => {
            event.preventDefault();
        });

        // 1. Carregar Categorias no <select>
        async function carregarCategorias() {
            const selectCategoria = document.getElementById("id_categoria");

            try {
                const res = await fetch(`${API_BASE_URL}/categorias`, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    }
                });

                if (!res.ok) {
                    throw new Error("Erro ao buscar categorias");
                }

                const categorias = await res.json();

                selectCategoria.innerHTML = '<option value="">Selecione...</option>';

                categorias.forEach(cat => {
                    const option = document.createElement("option");
                    option.value = cat.id_categoria;
                    option.textContent = cat.nome;
                    selectCategoria.appendChild(option);
                });

            } catch (err) {
                console.error("Erro ao carregar categorias:", err);
                selectCategoria.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        // 2. Abrir modal de nova categoria a partir do header
        window.abrirModalNovaCategoria = function () {
            const modal = document.getElementById("modalNovaCategoria");
            const input = document.getElementById("nomeNovaCategoria");

            if (!modal || !input) {
                return;
            }

            input.value = "";
            modal.showModal();

            setTimeout(() => {
                input.focus();
            }, 80);
        };

        // 3. Fechar modal de nova categoria
        document.getElementById("btnCancelarCategoria")?.addEventListener("click", () => {
            document.getElementById("modalNovaCategoria")?.close();
        });

        // 4. Cadastrar nova categoria
        document.getElementById("formNovaCategoria")?.addEventListener("submit", async event => {
            event.preventDefault();

            const input = document.getElementById("nomeNovaCategoria");
            const nome = input.value.trim();
            const botao = document.getElementById("btnSalvarCategoria");

            if (!nome) {
                exibirAviso("Informe o nome da categoria.", () => input.focus());
                return;
            }

            try {
                botao.disabled = true;

                const resposta = await fetch(`${API_BASE_URL}/categorias`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    },
                    body: JSON.stringify({
                        nome
                    })
                });

                const dados = await resposta.json().catch(() => ({}));

                if (!resposta.ok) {
                    throw new Error(
                        dados.erro ||
                        "Erro ao cadastrar categoria."
                    );
                }

                await carregarCategorias();

                const selectCategoria = document.getElementById("id_categoria");

                if (dados.id_categoria) {
                    selectCategoria.value = String(dados.id_categoria);
                }

                document.getElementById("modalNovaCategoria")?.close();

                exibirAviso("Categoria cadastrada com sucesso!");

            } catch (erro) {
                console.error("Erro ao cadastrar categoria:", erro);
                exibirAviso(erro.message || "Erro de conexão ao cadastrar categoria.");
            } finally {
                botao.disabled = false;
            }
        });

        // 5. Buscar o Próximo Código de Barras
        async function carregarProximoCodigo() {
            const inputCodigo = document.getElementById("codigo");

            try {
                const res = await fetch(`${API_BASE_URL}/produtos/proximo-codigo`, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    }
                });

                if (!res.ok) {
                    throw new Error("Erro ao buscar próximo código");
                }

                const dados = await res.json();

                if (dados.proximoCodigo) {
                    inputCodigo.value = dados.proximoCodigo;
                }

            } catch (err) {
                console.error("Erro ao carregar próximo código:", err);
                inputCodigo.placeholder = "Digite o código";
            }
        }

        // 6. Cálculo Dinâmico do Preço Final
        function calcularPrecoVenda() {
            const valorBruto =
                parseFloat(document.getElementById("valor_bruto").value) || 0;

            const porcentagem =
                parseFloat(document.getElementById("porcentagem_lucro").value) || 0;

            const precoVenda =
                valorBruto + (valorBruto * (porcentagem / 100));

            document.getElementById("preco_final").value =
                precoVenda.toFixed(2).replace(".", ",");
        }

        document
            .getElementById("valor_bruto")
            .addEventListener("input", calcularPrecoVenda);

        document
            .getElementById("porcentagem_lucro")
            .addEventListener("input", calcularPrecoVenda);

        // 7. Envio do Formulário de Cadastro
        document
            .getElementById("form_cadastrar_produto")
            .addEventListener("submit", async e => {
                e.preventDefault();

                const valorBruto =
                    parseFloat(document.getElementById("valor_bruto").value) || 0;

                const porcentagem =
                    parseFloat(document.getElementById("porcentagem_lucro").value) || 0;

                const precoCalculado =
                    (valorBruto + (valorBruto * (porcentagem / 100))).toFixed(2);

                const formData = new FormData();

                formData.append(
                    "nome",
                    document.getElementById("nome").value
                );

                formData.append(
                    "codigo",
                    document.getElementById("codigo").value
                );

                formData.append(
                    "valor_bruto",
                    valorBruto
                );

                formData.append(
                    "porcentagem_lucro",
                    porcentagem
                );

                formData.append(
                    "preco",
                    precoCalculado
                );

                // Tratamento: Se nada for digitado no campo de quantidade, define como 0
                const qtdDigitada = document.getElementById("quantidade").value.trim();
                const qtdFinal = qtdDigitada === "" ? 0 : parseInt(qtdDigitada, 10);
                formData.append("quantidade", qtdFinal);

                // Tratamento: Se nada for digitado em qtd_min, define como 0
                const qtdMinDigitada = document.getElementById("qtd_min").value.trim();
                const qtdMinFinal = qtdMinDigitada === "" ? 0 : parseInt(qtdMinDigitada, 10);
                formData.append("qtd_min", qtdMinFinal);

                formData.append(
                    "descricao",
                    document.getElementById("descricao").value
                );

                formData.append(
                    "id_categoria",
                    document.getElementById("id_categoria").value
                );

                const fileInput =
                    document.getElementById("imagem");

                if (fileInput.files[0]) {
                    formData.append(
                        "imagem",
                        fileInput.files[0]
                    );
                }

                try {
                    const resposta = await fetch(
                        `${API_BASE_URL}/produtos`,
                        {
                            method: "POST",
                            headers: {
                                "Authorization":
                                    `Bearer ${localStorage.getItem("token")}`
                            },
                            body: formData
                        }
                    );

                    const dados =
                        await resposta.json();

                    if (resposta.ok) {
                        exibirAviso("Produto cadastrado com sucesso!", () => {
                            location.reload();
                        });
                    } else {
                        exibirAviso(
                            dados.erro ||
                            "Erro ao cadastrar produto"
                        );
                    }

                } catch (erro) {
                    console.error("Erro no cadastro:", erro);
                    exibirAviso("Erro de conexão ao cadastrar produto.");
                }
            });

        // Inicialização ao carregar a página
        document.addEventListener("DOMContentLoaded", () => {
            carregarCategorias();
            carregarProximoCodigo();
        });
    </script>

</body>
</html>
