<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <title>Cadastro de Produtos - Grano Vita</title>

</head>

<body class="fundo-laranja">

    <div class="form-container">
        <h2>Cadastrar Novo Produto</h2>

        <form id="form_cadastrar_produto" enctype="multipart/form-data">

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="nome">Nome do Produto *</label>
                    <input type="text" id="nome" required placeholder="Ex: Pão de Queijo">
                </div>

                <div class="form-group" style="flex: 1;">
                    <label for="id_categoria">Categoria *</label>
                    <select id="id_categoria" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="valor_bruto">Valor Custo/Bruto (R$) *</label>
                    <input type="number" step="0.01" id="valor_bruto" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="porcentagem_lucro">Lucro (%)</label>
                    <input type="number" step="any" id="porcentagem_lucro" value="50" placeholder="50">
                </div>

                <div class="form-group">
                    <label for="preco_final">Preço Venda (R$)</label>
                    <div class="preco-venda-controle">
                        <input type="text" id="preco_final" placeholder="0,00" class="input-disabled" readonly inputmode="decimal">
                        <button type="button" id="btnDesbloquearPrecoCadastro" class="botao-desbloquear-preco" aria-label="Desbloquear edição do preço de venda" aria-pressed="false" title="Desbloquear preço de venda"><img src="../backend/imagens/cadeado_p.png" alt="" aria-hidden="true"></button>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="codigo">Código de Barras *</label>
                    <input type="text" id="codigo" placeholder="Buscando..." required>
                </div>

                <div class="form-group">
                    <label for="quantidade">Qtd Atual</label>
                    <input type="number" id="quantidade" placeholder="0" min="0">
                </div>

                <div class="form-group">
                    <label for="qtd_min">Qtd Mínima</label>
                    <input type="number" id="qtd_min" placeholder="5" min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="3" placeholder="Descrição opcional do produto..."></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="imagem">Imagem do Produto</label>
                    <input type="file" id="imagem" accept="image/*">
                </div>
            </div>

            <button type="submit" class="btn-submit">Cadastrar Produto</button>
        </form>
    </div>

    <dialog id="modalNovaCategoria">
        <div class="modal-categoria-box">
            <h2>Nova Categoria</h2>
            <p>Cadastre uma nova categoria para utilizar nos produtos.</p>

            <form id="formNovaCategoria">
                <label for="nomeNovaCategoria">Nome da categoria *</label>
                <input
                    type="text"
                    id="nomeNovaCategoria"
                    maxlength="100"
                    required
                    placeholder="Ex: Bebidas"
                >

                <div class="modal-categoria-acoes">
                    <button type="button" id="btnCancelarCategoria">Cancelar</button>
                    <button type="submit" id="btnSalvarCategoria">Cadastrar categoria</button>
                </div>
            </form>
        </div>
    </dialog>

    <dialog id="d_aviso">
        <div class="aviso_box">
            <p id="msg_aviso"></p>
            <div class="aviso_botoes">
                <button id="b_confirmar_aviso">OK</button>
                <button id="b_cancelar_aviso" style="display:none;">Cancelar</button>
            </div>
        </div>
    </dialog>

    <script>
        const API_BASE_URL = "http://localhost:3000";

        const aviso = document.getElementById("d_aviso");
        const msgAviso = document.getElementById("msg_aviso");
        const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
        const bCancelarAviso = document.getElementById("b_cancelar_aviso");

        function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
            msgAviso.innerText = mensagem;
            bCancelarAviso.style.display = mostrarCancelar ? "block" : "none";

            try {
                aviso.showModal();
            } catch (e) {
                console.error("Erro ao abrir modal de aviso:", e);
            }

            bConfirmarAviso.onclick = () => {
                aviso.close();
                if (callback) callback();
            };

            bCancelarAviso.onclick = () => {
                aviso.close();
            };
        }

        aviso.addEventListener("cancel", (event) => {
            event.preventDefault();
        });

        async function carregarCategorias() {
            const selectCategoria = document.getElementById("id_categoria");

            try {
                const res = await fetch(`${API_BASE_URL}/categorias`, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    }
                });

                if (!res.ok) {
                    throw new Error("Erro ao buscar categorias");
                }

                const categorias = await res.json();

                selectCategoria.innerHTML = '<option value="">Selecione...</option>';

                categorias.forEach(cat => {
                    const option = document.createElement("option");
                    option.value = cat.id_categoria;
                    option.textContent = cat.nome;
                    selectCategoria.appendChild(option);
                });

            } catch (err) {
                console.error("Erro ao carregar categorias:", err);
                selectCategoria.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        window.abrirModalNovaCategoria = function () {
            const modal = document.getElementById("modalNovaCategoria");
            const input = document.getElementById("nomeNovaCategoria");

            if (!modal || !input) {
                return;
            }

            input.value = "";
            modal.showModal();

            setTimeout(() => {
                input.focus();
            }, 80);
        };

        document.getElementById("btnCancelarCategoria")?.addEventListener("click", () => {
            document.getElementById("modalNovaCategoria")?.close();
        });

        document.getElementById("formNovaCategoria")?.addEventListener("submit", async event => {
            event.preventDefault();

            const input = document.getElementById("nomeNovaCategoria");
            const nome = input.value.trim();
            const botao = document.getElementById("btnSalvarCategoria");

            if (!nome) {
                exibirAviso("Informe o nome da categoria.", () => input.focus());
                return;
            }

            try {
                botao.disabled = true;

                const resposta = await fetch(`${API_BASE_URL}/categorias`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    },
                    body: JSON.stringify({
                        nome
                    })
                });

                const dados = await resposta.json().catch(() => ({}));

                if (!resposta.ok) {
                    throw new Error(
                        dados.erro ||
                        "Erro ao cadastrar categoria."
                    );
                }

                await carregarCategorias();

                const selectCategoria = document.getElementById("id_categoria");

                if (dados.id_categoria) {
                    selectCategoria.value = String(dados.id_categoria);
                }

                document.getElementById("modalNovaCategoria")?.close();

                exibirAviso("Categoria cadastrada com sucesso!");

            } catch (erro) {
                console.error("Erro ao cadastrar categoria:", erro);
                exibirAviso(erro.message || "Erro de conexão ao cadastrar categoria.");
            } finally {
                botao.disabled = false;
            }
        });

        async function carregarProximoCodigo() {
            const inputCodigo = document.getElementById("codigo");

            try {
                const res = await fetch(`${API_BASE_URL}/produtos/proximo-codigo`, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    }
                });

                if (!res.ok) {
                    throw new Error("Erro ao buscar próximo código");
                }

                const dados = await res.json();

                if (dados.proximoCodigo) {
                    inputCodigo.value = dados.proximoCodigo;
                }

            } catch (err) {
                console.error("Erro ao carregar próximo código:", err);
                inputCodigo.placeholder = "Digite o código";
            }
        }

        const inputValorBruto = document.getElementById("valor_bruto");
        const inputPorcentagemLucro = document.getElementById("porcentagem_lucro");
        const inputPrecoVenda = document.getElementById("preco_final");
        const btnDesbloquearPreco = document.getElementById("btnDesbloquearPrecoCadastro");
        let precoVendaDesbloqueado = false;
        let precoVendaManual = false;

        function converterValorMonetario(valor) {
            let texto = String(valor ?? "").trim().replace(/[^0-9,.-]/g, "");
            if (texto.includes(",") && texto.includes(".")) {
                texto = texto.replace(/\./g, "").replace(",", ".");
            } else {
                texto = texto.replace(",", ".");
            }
            return Number(texto);
        }

        function atualizarPorcentagemPeloPreco() {
            const bruto = converterValorMonetario(inputValorBruto.value);
            const venda = converterValorMonetario(inputPrecoVenda.value);
            if (!Number.isFinite(bruto) || bruto <= 0 || !Number.isFinite(venda)) return;
            inputPorcentagemLucro.value = (((venda / bruto) - 1) * 100).toFixed(6);
        }

        function calcularPrecoVenda() {
            const valorBruto = converterValorMonetario(inputValorBruto.value) || 0;
            const porcentagem = converterValorMonetario(inputPorcentagemLucro.value) || 0;

            if (precoVendaManual) {
                atualizarPorcentagemPeloPreco();
                return;
            }

            const precoVenda = valorBruto + (valorBruto * (porcentagem / 100));
            inputPrecoVenda.value = precoVenda.toFixed(2).replace(".", ",");
        }

        function definirPrecoVendaDesbloqueado(desbloqueado) {
            precoVendaDesbloqueado = Boolean(desbloqueado);
            inputPrecoVenda.readOnly = !precoVendaDesbloqueado;
            inputPrecoVenda.classList.toggle("input-disabled", !precoVendaDesbloqueado);
            btnDesbloquearPreco.setAttribute("aria-label", precoVendaDesbloqueado ? "Bloquear edição do preço de venda" : "Desbloquear edição do preço de venda");
            btnDesbloquearPreco.setAttribute("aria-pressed", String(precoVendaDesbloqueado));
            btnDesbloquearPreco.title = precoVendaDesbloqueado ? "Bloquear edição do preço de venda" : "Desbloquear preço de venda";
            if (precoVendaDesbloqueado) {
                inputPrecoVenda.focus();
                inputPrecoVenda.select();
            }
        }

        btnDesbloquearPreco.addEventListener("click", () => {
            if (precoVendaDesbloqueado) {
                definirPrecoVendaDesbloqueado(false);
                return;
            }

            exibirAviso(
                "Tem certeza de que deseja desbloquear a alteração direta do preço de venda?",
                () => definirPrecoVendaDesbloqueado(true),
                true
            );
        });

        inputPrecoVenda.addEventListener("input", () => {
            if (!precoVendaDesbloqueado) return;
            precoVendaManual = true;
            atualizarPorcentagemPeloPreco();
        });

        inputValorBruto.addEventListener("input", calcularPrecoVenda);

        inputPorcentagemLucro.addEventListener("input", () => {
            precoVendaManual = false;
            calcularPrecoVenda();
        });

        document
            .getElementById("form_cadastrar_produto")
            .addEventListener("submit", async e => {
                e.preventDefault();

                const valorBruto = converterValorMonetario(inputValorBruto.value) || 0;
                let precoCalculado = converterValorMonetario(inputPrecoVenda.value);
                let porcentagem = converterValorMonetario(inputPorcentagemLucro.value) || 0;

                if (precoVendaManual) {
                    if (valorBruto <= 0 || !Number.isFinite(precoCalculado) || precoCalculado <= 0) {
                        exibirAviso("Informe um custo/bruto e um preço de venda válidos.");
                        return;
                    }
                    porcentagem = ((precoCalculado / valorBruto) - 1) * 100;
                    inputPorcentagemLucro.value = porcentagem.toFixed(6);
                } else {
                    precoCalculado = valorBruto + (valorBruto * (porcentagem / 100));
                }

                if (!Number.isFinite(precoCalculado) || precoCalculado <= 0) {
                    exibirAviso("O preço de venda precisa ser maior que zero.");
                    return;
                }

                const formData = new FormData();

                formData.append(
                    "nome",
                    document.getElementById("nome").value
                );

                formData.append(
                    "codigo",
                    document.getElementById("codigo").value
                );

                formData.append(
                    "valor_bruto",
                    valorBruto
                );

                formData.append(
                    "porcentagem_lucro",
                    porcentagem
                );

                formData.append(
                    "preco",
                    precoCalculado.toFixed(2)
                );

                const qtdDigitada = document.getElementById("quantidade").value.trim();
                const qtdFinal = qtdDigitada === "" ? 0 : parseInt(qtdDigitada, 10);
                formData.append("quantidade", qtdFinal);

                const qtdMinDigitada = document.getElementById("qtd_min").value.trim();
                const qtdMinFinal = qtdMinDigitada === "" ? 0 : parseInt(qtdMinDigitada, 10);
                formData.append("qtd_min", qtdMinFinal);

                formData.append(
                    "descricao",
                    document.getElementById("descricao").value
                );

                formData.append(
                    "id_categoria",
                    document.getElementById("id_categoria").value
                );

                const fileInput =
                    document.getElementById("imagem");

                if (fileInput.files[0]) {
                    formData.append(
                        "imagem",
                        fileInput.files[0]
                    );
                }

                try {
                    const resposta = await fetch(
                        `${API_BASE_URL}/produtos`,
                        {
                            method: "POST",
                            headers: {
                                "Authorization":
                                    `Bearer ${localStorage.getItem("token")}`
                            },
                            body: formData
                        }
                    );

                    const dados =
                        await resposta.json();

                    if (resposta.ok) {
                        exibirAviso("Produto cadastrado com sucesso!", () => {
                            location.reload();
                        });
                    } else {
                        exibirAviso(
                            dados.erro ||
                            "Erro ao cadastrar produto"
                        );
                    }

                } catch (erro) {
                    console.error("Erro no cadastro:", erro);
                    exibirAviso("Erro de conexão ao cadastrar produto.");
                }
            });

        document.addEventListener("DOMContentLoaded", () => {
            carregarCategorias();
            carregarProximoCodigo();
        });
</script>

</body>
</html>
