<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <script src="sidebar_header.js"></script>
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <script>
        (function() {
            const token = localStorage.getItem("token");
    
            if (!token) {
                // 1. Exibe a mensagem primeiro
                alert("Acesso restrito! Redirecionando para o login...");
                
                // 2. Só então redireciona
                window.location.replace("login.html"); 
                
                // 3. Força a interrupção da leitura do resto do HTML
                throw new Error("Acesso negado: Redirecionando...");
            }
        })();
    </script>
</head>
<body class="fundo-escuro">
    <main class="main-cadastro">
        <form id="formProduto" enctype="multipart/form-data">
            <h2>Cadastro de Produto</h2>

            <input type="text" name="codigo" class="inp_p" placeholder="Código" required>
            <input type="text" name="nome" class="inp_p" placeholder="Nome" required>
            <input type="text" name="descricao" class="inp_p" placeholder="Descrição">
            <input type="number" name="preco" class="inp_p" placeholder="Preço" step="0.01" required>
            <input type="number" name="quantidade" class="inp_p" placeholder="Quantidade" required>
            <select name="id_categoria" id="categoria" class="inp_p" required>
                <option value="">Selecione a categoria</option>
            </select>
            <label class="file-label">
                Escolher imagem do produto
                <input type="file" name="imagem" id="inputImagem" accept="image/*">
            </label>

            <img id="preview">

            <button type="submit" class="btn-form">Cadastrar Produto</button>
        </form>
    </main>

    <script>
        const inputImagem = document.getElementById("inputImagem");
        const preview = document.getElementById("preview");

        inputImagem.addEventListener("change", () => {
            const file = inputImagem.files[0];
            if(file){
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });

        document.getElementById("formProduto").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const res = await apiFetch("http://localhost:3000/produtos", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if(res.ok){
                    alert(data.mensagem);
                    e.target.reset();
                    preview.style.display = "none";
                }
                else{
                    alert(data.erro || "Erro ao cadastrar.");
                }
            } catch (err) {
                alert("Erro de servidor.");
            }
        });
async function carregarCategorias() {

    try {

        const res = await apiFetch("http://localhost:3000/categorias");

        const categorias = await res.json();

        const select = document.getElementById("categoria");

        categorias.forEach(cat => {

            select.innerHTML += `
                <option value="${cat.id_categoria}">
                    ${cat.nome}
                </option>
            `;
        });

    } catch (err) {

        console.error(err);
        alert("Erro ao carregar categorias");
    }
}

carregarCategorias();

    </script>
</body>
</html>
