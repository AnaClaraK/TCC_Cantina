<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <title>Cadastro de Cliente Fiado</title>
    
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <script src="sidebar_header.js"></script>
    
    <script>
        (function() {
            const token = localStorage.getItem("token");
    
            if (!token) {
                alert("Acesso restrito! Redirecionando para o login...");
                window.location.replace("login.html"); 
                throw new Error("Acesso negado: Redirecionando...");
            }
        })();
    </script>
</head>
<body class="fundo-escuro">
    <body class="fundo-escuro">

        <div class="d_util">
        
            <h2 class="h_ag">
                Clientes Fiado
            </h2>
        
            <button id="btn_abrir_modal">
                + Novo Cliente
            </button>
        
        </div>
        
        <section id="sc_tabela">
        
            <table class="tabela">
        
                <thead>
        
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th>Adicionar Compra</th>
                    </tr>
        
                </thead>
        
                <tbody id="tbody"></tbody>
        
            </table>
        
        </section>
        
        <dialog id="modal_cliente">
        
            <main class="main-cadastro">
        
                <form id="formClienteFiado" class="modal_box">
        
                    <h2>Cadastro de Cliente Fiado</h2>
        
                    <input
                        class="inp_p"
                        id="nome"
                        placeholder="Nome completo"
                        required
                    >
        
                    <input
                        class="inp_p"
                        id="cpf"
                        placeholder="CPF"
                        required
                    >
        
                    <input
                        class="inp_p"
                        id="telefone"
                        placeholder="Telefone"
                        required
                    >
        
                    <input
                        class="inp_p"
                        id="endereco"
                        placeholder="Endereço"
                    >
        
                    <button
                        type="submit"
                        id="b_cadastrar"
                        class="btn-form"
                    >
                        Cadastrar
                    </button>
        
                </form>
        
            </main>
        
        </dialog>
        
        <dialog id="modal_compra">
        
            <main class="main-cadastro">
        
                <form id="formCompraFiado" class="modal_box">
        
                    <h2>Adicionar Compra</h2>
        
                    <input
                        class="inp_p"
                        id="cliente_compra"
                        readonly
                    >
        
                    <input
                        class="inp_p"
                        id="telefone_compra"
                        readonly
                    >
        
                    <input
                        type="number"
                        class="inp_p"
                        id="valor_compra"
                        placeholder="Valor"
                        step="0.01"
                        required
                    >
        
                    <input
                        type="date"
                        class="inp_p"
                        id="vencimento_compra"
                        required
                    >
        
                    <button
                        type="submit"
                        class="btn-form"
                    >
                        Salvar Compra
                    </button>
        
                </form>
        
            </main>
        
        </dialog>
        <script>

            const tbody =
            document.getElementById("tbody");
            
            const modalCliente =
            document.getElementById("modal_cliente");
            
            const modalCompra =
            document.getElementById("modal_compra");
            
            let clienteSelecionado = null;
            
            document
            .getElementById("btn_abrir_modal")
            .addEventListener("click", () => {
            
                modalCliente.showModal();
            });
            
            async function carregarClientes(){
            
                try{
            
                    const res = await apiFetch(
                        "http://localhost:3000/clientes-fiado",
                        {
                            headers:{
                                Authorization:
                                `Bearer ${localStorage.getItem("token")}`
                            }
                        }
                    );
            
                    const clientes = await res.json();
            
                    tbody.innerHTML = "";
            
                    clientes.forEach(cliente => {
            
                        tbody.innerHTML += `
            
                        <tr>
            
                            <td>
                                ${cliente.nome_completo}
                            </td>
            
                            <td>
                                ${cliente.cpf}
                            </td>
            
                            <td>
                                ${cliente.telefone}
                            </td>
            
                            <td>
                                ${cliente.endereco || "-"}
                            </td>
            
                            <td>
            
                                <button
                                    onclick='abrirCompra(
                                        ${JSON.stringify(cliente)}
                                    )'
                                >
                                    + Compra
                                </button>
            
                            </td>
            
                        </tr>
                        `;
                    });
            
                } catch(err){
            
                    console.error(err);
            
                    alert("Erro ao carregar clientes");
                }
            }
            
            function abrirCompra(cliente){
            
                clienteSelecionado = cliente;
            
                document
                .getElementById("cliente_compra")
                .value = cliente.nome_completo;
            
                document
                .getElementById("telefone_compra")
                .value = cliente.telefone;
            
                document
                .getElementById("valor_compra")
                .value = "";
            
                document
                .getElementById("vencimento_compra")
                .value = "";
            
                modalCompra.showModal();
            }
            
            document
            .getElementById("formClienteFiado")
            .addEventListener("submit", async (e) => {
            
                e.preventDefault();
            
                const nome_completo =
                document.getElementById("nome")
                .value.trim();
            
                const cpf =
                document.getElementById("cpf")
                .value.trim();
            
                const telefone =
                document.getElementById("telefone")
                .value.trim();
            
                const endereco =
                document.getElementById("endereco")
                .value.trim();
            
                try {
            
                    const res = await apiFetch(
                        "http://localhost:3000/clientes-fiado",
                        {
                            method: "POST",
            
                            headers: {
                                "Content-Type":
                                "application/json",
            
                                Authorization:
                                `Bearer ${localStorage.getItem("token")}`
                            },
            
                            body: JSON.stringify({
                                nome_completo,
                                cpf,
                                telefone,
                                endereco
                            })
                        }
                    );
            
                    const data = await res.json();
            
                    if (res.ok) {
            
                        alert(
                            "Cliente cadastrado!"
                        );
            
                        e.target.reset();
            
                        modalCliente.close();
            
                        carregarClientes();
            
                    } else {
            
                        alert(
                            data.erro || "Erro"
                        );
                    }
            
                } catch (err) {
            
                    console.error(err);
            
                    alert(
                        "Erro no servidor"
                    );
                }
            });
            
            document
            .getElementById("formCompraFiado")
            .addEventListener("submit", async (e) => {
            
                e.preventDefault();
            
                const valor =
                document.getElementById(
                    "valor_compra"
                ).value;
            
                const vencimento =
                document.getElementById(
                    "vencimento_compra"
                ).value;
            
                try{
            
                    const res = await apiFetch(
                        "http://localhost:3000/contas-fiado",
                        {
                            method:"POST",
            
                            headers:{
                                "Content-Type":
                                "application/json",
            
                                Authorization:
                                `Bearer ${localStorage.getItem("token")}`
                            },
            
                            body: JSON.stringify({
            
                                id_cliente:
                                clienteSelecionado.id_cliente,
            
                                valor,
            
                                vencimento
                            })
                        }
                    );
            
                    const data =
                    await res.json();
            
                    if(res.ok){
            
                        alert(
                            "Compra adicionada!"
                        );
            
                        modalCompra.close();
            
                    } else {
            
                        alert(
                            data.erro || "Erro"
                        );
                    }
            
                } catch(err){
            
                    console.error(err);
            
                    alert(
                        "Erro ao salvar compra"
                    );
                }
            });
            
            carregarClientes();
            
            </script>
</body>
</html>
