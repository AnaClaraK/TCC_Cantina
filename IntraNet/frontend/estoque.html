<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="styleag_es.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <title>Estoque</title>
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.replace("login.html"); 
        }
    </script>
</head>

<body class="fundo-escuro">

<div class="d_util">
    <h2 class="h_ag">Estoque</h2>
    <button id="b_addq">
      <span id="s_addq">Adicionar quantidade</span>
    </button>
    <div id="d_inp">
        <div class="busca-box">
            <img src="../backend/imagens/lupa.png" class="icone-busca">
            <input type="text" id="inputBusca" placeholder="Buscar por nome ou código...">
        </div>
    </div>
</div>

<section id="sc_tabela" class="container mt-5">
<table class="tabela" id="tabela_estoque">
    <thead>
        <tr>
            <th data-col="codigo_barras">Código</th>
            <th data-col="nome">Produto</th>
            <th data-col="categoria_nome">Categoria</th>
            <th data-col="preco">Preço</th>
            <th data-col="qtd">Quantidade</th>
            <th data-col="disponivel">Disponível</th>
            <th data-col="qtd_min">Qtd Mínima</th>
            <th data-col="ativo">Ações</th>
        </tr>
    </thead>
    <tbody id="tb_tbl_produtos"></tbody>
</table>
</section>

<dialog id="d_modal">
    <div class="modal_box">
        <button id="b_close_modal">x</button>
        <h2>Atualizar Quantidade</h2>

        <input type="text" class="inp_m" id="inp_busca_modal" placeholder="Código ou nome">
        <ul id="lista_sugestoes"></ul>

        <p class="pm">Selecionado: <span id="s_produto">---</span></p>
        <p class="pm">Quantidade atual: <span id="s_qtda">0</span></p>

        <input type="number" class="inp_m" id="inp_add_qtd" value="0">
        <button class="b_addf" id="b_addf" type="button">Adicionar</button>

        <div class="modal_footer">
            <p class="pmf">Use as setas ↑ ↓ e Enter para selecionar</p>
        </div>
    </div>
</dialog>

<dialog id="d_aviso">
    <div class="aviso_box">
        <div id="msg_aviso"></div>
        <div class="aviso_botoes">
            <button id="b_confirmar_aviso">OK</button>
            <button id="b_cancelar_aviso">Cancelar</button>
        </div>
    </div>
</dialog>

<script>
async function apiFetch(url, options) {
    const response = await fetch(url, options);
    if (!response.ok) throw new Error('Erro na requisição: ' + response.status);
    return response;
}

const modal = document.getElementById("d_modal");
const b_addq = document.getElementById("b_addq");
const b_addf = document.getElementById("b_addf");
const tabela = document.getElementById("tb_tbl_produtos");

const inpBuscaModal = document.getElementById("inp_busca_modal");
const lista = document.getElementById("lista_sugestoes");
const inpAddQtd = document.getElementById("inp_add_qtd");

const modalAviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");

let produtosCache = [];
let indexSelecionado = -1;
let ordenacaoAtual = { coluna: 'ativo', direcao: 'desc' };

const inputBusca = document.getElementById("inputBusca");

function normalizarTexto(texto) {
    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
    msgAviso.innerHTML = mensagem;
    bCancelarAviso.style.display = mostrarCancelar ? "inline-block" : "none";
    modalAviso.showModal();

    bConfirmarAviso.onclick = () => {
        modalAviso.close();
        if (callback) callback();
    };
    bCancelarAviso.onclick = () => {
        modalAviso.close();
    };
}

// ===============================================
// SISTEMA DE ORDENAÇÃO GENÉRICO PARA TABELAS
// ===============================================
function ordenarProdutos(coluna) {
    if (ordenacaoAtual.coluna === coluna) {
        ordenacaoAtual.direcao = ordenacaoAtual.direcao === 'asc' ? 'desc' : 'asc';
    } else {
        ordenacaoAtual.coluna = coluna;
        ordenacaoAtual.direcao = 'asc';
    }

    produtosCache.sort((a, b) => {
        // Mantém inativos sempre no final por padrão
        if (coluna !== 'ativo') {
            if (a.ativo !== b.ativo) return b.ativo - a.ativo;
        }

        let valA = a[coluna] ?? '';
        let valB = b[coluna] ?? '';

        if (!isNaN(parseFloat(valA)) && !isNaN(parseFloat(valB))) {
            valA = Number(valA);
            valB = Number(valB);
        } else {
            valA = String(valA).toLowerCase();
            valB = String(valB).toLowerCase();
        }

        if (valA < valB) return ordenacaoAtual.direcao === 'asc' ? -1 : 1;
        if (valA > valB) return ordenacaoAtual.direcao === 'asc' ? 1 : -1;
        return 0;
    });

    renderizarTabela();
    atualizarCabecalhoOrdenacao(coluna);
}

function atualizarCabecalhoOrdenacao(colunaAtiva) {
    document.querySelectorAll("#tabela_estoque thead th").forEach(th => {
        th.classList.remove("sort-asc", "sort-desc");
        if (th.dataset.col === colunaAtiva) {
            th.classList.add(ordenacaoAtual.direcao === 'asc' ? 'sort-asc' : 'sort-desc');
        }
    });
}

// Configura evento de clique em todas as colunas
document.querySelectorAll("#tabela_estoque thead th").forEach(th => {
    th.addEventListener("click", () => {
        const coluna = th.dataset.col;
        if (coluna) ordenarProdutos(coluna);
    });
});

// ===============================================
// RENDERIZAÇÃO DA TABELA
// ===============================================
function renderizarTabela() {
    tabela.innerHTML = "";

    produtosCache.forEach(p => {
        const estaAtivo = p.ativo === 1 || p.ativo === true;
        const tr = document.createElement("tr");

        if (!estaAtivo) tr.classList.add("linha-inativa");

        tr.innerHTML = `
            <td>${p.codigo_barras || ""}</td>
            <td>${p.nome || ""}</td>
            <td>${p.categoria_nome || ""}</td>
            <td>R$ ${parseFloat(p.preco || 0).toFixed(2).replace(".", ",")}</td>
            <td>${p.qtd || 0}</td>
            <td>${p.disponivel || 0}</td>
            <td>${p.qtd_min || 0}</td>
            <td>
                <button class="${estaAtivo ? 'btn-inativar' : 'btn-ativar'}" onclick="alternarStatusProduto(${p.id_produto}, ${estaAtivo})">
                    ${estaAtivo ? 'Inativar' : 'Ativar'}
                </button>
            </td>
        `;
        tabela.appendChild(tr);
    });
}

async function alternarStatusProduto(id, statusAtual) {
    const novoStatus = !statusAtual;
    try {
        await apiFetch(`http://localhost:3000/produtos/cod/${id}/status`, {
            method: "PUT",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem("token")}`
            },
            body: JSON.stringify({ ativo: novoStatus })
        });
        carregarProdutos();
    } catch (err) {
        exibirAviso("Erro ao alterar o status do produto.");
    }
}

async function carregarProdutos() {
    try {
        const res = await apiFetch("http://localhost:3000/produtos", {
            headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
        });
        produtosCache = await res.json();
        
        // Garante ordenação mantendo inativos no fim
        ordenarProdutos('ativo');
    } catch (err) {
        console.error("Erro ao carregar produtos:", err);
    }
}

inputBusca.addEventListener("input", () => {
    const termo = normalizarTexto(inputBusca.value);
    const linhas = document.querySelectorAll("#tb_tbl_produtos tr");

    linhas.forEach(linha => {
        const codigo = normalizarTexto(linha.children[0].innerText);
        const nome = normalizarTexto(linha.children[1].innerText);

        if (codigo.includes(termo) || nome.includes(termo)) {
            linha.style.display = "";
        } else {
            linha.style.display = "none";
        }
    });
});

b_addq.addEventListener("click", () => {
    limparModal();

    // Filtra para exibir APENAS produtos ATIVOS na reposição
    const produtosBaixoEstoque = produtosCache
        .filter(p => (p.ativo === 1 || p.ativo === true) && (p.qtd || 0) <= (p.qtd_min || 10))
        .sort((a, b) => (a.qtd || 0) - (b.qtd || 0));

    lista.innerHTML = "";

    produtosBaixoEstoque.forEach((p, i) => {
        const li = document.createElement("li");
        li.textContent = `${p.nome} (${p.qtd || 0} un.)`;

        li.onclick = () => {
            inpBuscaModal.value = p.nome;
            inpBuscaModal.dataset.codigo = p.codigo_barras;

            document.getElementById("s_produto").innerText = p.nome;
            document.getElementById("s_qtda").innerText = p.qtd || 0;

            lista.innerHTML = "";
            inpAddQtd.focus();
        };

        li.addEventListener("mouseenter", () => {
            indexSelecionado = i;
            atualizarDestaqueModal(lista.querySelectorAll("li"));
        });

        lista.appendChild(li);
    });

    indexSelecionado = -1;
    modal.showModal();
});

b_addf.addEventListener("click", async () => {
    const codigo = inpBuscaModal.dataset.codigo;

    if (!codigo) {
        exibirAviso("Selecione um produto primeiro.");
        return;
    }

    const qtdAdd = Number(inpAddQtd.value);
    if (qtdAdd <= 0) {
        exibirAviso("Quantidade inválida.");
        return;
    }

    try {
        await apiFetch(`http://localhost:3000/produtos/cod/${codigo}/add`, {
            method: "PUT",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem("token")}`
            },
            body: JSON.stringify({ quantidade: qtdAdd })
        });

        modal.close();
        limparModal();
        carregarProdutos();
    } catch (err) {
        exibirAviso("Erro ao atualizar o estoque.");
    }
});

function limparModal() {
    inpBuscaModal.value = "";
    inpBuscaModal.dataset.codigo = "";
    document.getElementById("s_produto").innerText = "---";
    document.getElementById("s_qtda").innerText = "0";
    inpAddQtd.value = 0; 
    lista.innerHTML = "";
    indexSelecionado = -1;
}

function selecionarProdutoModal(produto) {
    inpBuscaModal.value = produto.nome;
    inpBuscaModal.dataset.codigo = produto.codigo_barras;

    document.getElementById("s_produto").innerText = produto.nome;
    document.getElementById("s_qtda").innerText = produto.qtd || 0;

    lista.innerHTML = "";
    indexSelecionado = -1;
    
    inpAddQtd.focus();
}

function atualizarDestaqueModal(itens) {
    itens.forEach((li, i) => {
        if (i === indexSelecionado) {
            li.style.backgroundColor = "#efac4a";
            li.style.color = "#1c1c1c";
            li.scrollIntoView({ block: "nearest" });
        } else {
            li.style.backgroundColor = "";
            li.style.color = "";
        }
    });
}

inpBuscaModal.addEventListener("input", () => {
    const termo = inpBuscaModal.value.toLowerCase();
    lista.innerHTML = "";
    indexSelecionado = -1;
    
    // Apenas produtos ativos aparecem no autocompletar do modal
    const filtrados = produtosCache.filter(p =>
        (p.ativo === 1 || p.ativo === true) &&
        ((p.nome || "").toLowerCase().includes(termo) ||
        (p.codigo_barras || "").startsWith(termo))
    ).slice(0, 5);

    filtrados.forEach((p, i) => {
        const li = document.createElement("li");
        li.textContent = p.nome;
        li.onclick = () => selecionarProdutoModal(p);
        
        li.addEventListener("mouseenter", () => {
            indexSelecionado = i;
            atualizarDestaqueModal(lista.querySelectorAll("li"));
        });

        lista.appendChild(li);
    });
});

inpAddQtd.addEventListener("focus", () => {
    if (inpAddQtd.value === "0") inpAddQtd.value = "";
});

inpAddQtd.addEventListener("blur", () => {
    if (inpAddQtd.value.trim() === "") inpAddQtd.value = 0;
});

document.getElementById("b_close_modal").addEventListener("click", () => modal.close());

document.addEventListener("DOMContentLoaded", carregarProdutos);
</script>
</body>
</html>
