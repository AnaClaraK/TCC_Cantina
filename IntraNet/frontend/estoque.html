<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="styleag_es.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <title>Estoque</title>
    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.replace("login.html"); 
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="./gerarpdf.js"></script>
</head>

<body class="fundo-escuro">

<div class="d_util">
    <h2 class="h_ag">Estoque</h2>
    <button id="b_addq">
      <span id="s_addq">Adicionar quantidade</span></button>
      <button id="btnExportarPDF" class="btn-baixar-pdf" onclick="gerarPDFReposicaoEstoque()"> Baixar PDF</button>
    <div id="d_inp">
        <div class="busca-box">
            <img src="../backend/imagens/lupa.png" class="icone-busca">
            <input type="text" id="inputBusca" placeholder="Buscar por nome ou código...">

        
        </div>
    </div>
</div>

<section id="sc_tabela" class="container mt-5 area-tabela">
<table class="tabela">
    <thead>
        <tr>
            <th>Código</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Disponível</th>
            <th>Qtd Mínima</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="tb_tbl_produtos"></tbody>
</table>
</section>

<dialog id="d_modal">
    <div class="modal_box">
        <button id="b_close_modal">x</button>

        <h2>Atualizar Quantidade</h2>

        <input type="text" class="inp_m" id="inp_busca_modal" placeholder="Código ou nome">
        <ul id="lista_sugestoes"></ul>

        <p class="pm">Selecionado: <span id="s_produto">---</span></p>
        <p class="pm">Quantidade atual: <span id="s_qtda">0</span></p>

        <input type="number" class="inp_m" id="inp_add_qtd" value="0">

        <button class="b_addf" id="b_addf" type="button">Adicionar</button>

        <div class="modal_footer">
            <p class="pmf">Use as setas ↑ ↓ e Enter para selecionar</p>
        </div>
    </div>
</dialog>

<dialog id="d_aviso">
    <div class="aviso_box">
        <div id="msg_aviso"></div>
        <div class="aviso_botoes">
            <button id="b_confirmar_aviso">OK</button>
            <button id="b_cancelar_aviso">Cancelar</button>
        </div>
    </div>
</dialog>

<script>
async function apiFetch(url, options) {
    const response = await fetch(url, options);
    if (!response.ok) {
        let mensagem = `Erro na requisição: ${response.status}`;
        try {
            const dados = await response.clone().json();
            mensagem = dados.erro || dados.resposta || mensagem;
        } catch (_) {}
        throw new Error(mensagem);
    }
    return response;
}

const modal = document.getElementById("d_modal");
const b_addq = document.getElementById("b_addq");
const b_addf = document.getElementById("b_addf");
const tabela = document.getElementById("tb_tbl_produtos");

const inpBuscaModal = document.getElementById("inp_busca_modal");
const lista = document.getElementById("lista_sugestoes");
const inpAddQtd = document.getElementById("inp_add_qtd");

const modalAviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");

let produtosCache = [];
let indexSelecionado = -1;
const inputBusca = document.getElementById("inputBusca");

function normalizarTexto(texto) {
    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
    msgAviso.innerHTML = mensagem;
    bCancelarAviso.style.display = mostrarCancelar ? "inline-block" : "none";
    modalAviso.showModal();

    bConfirmarAviso.onclick = () => {
        modalAviso.close();
        if (callback) callback();
    };
    bCancelarAviso.onclick = () => {
        modalAviso.close();
    };
}

inputBusca.addEventListener("input", () => {
    const termo = normalizarTexto(inputBusca.value);
    const linhas = document.querySelectorAll("#tb_tbl_produtos tr");

    linhas.forEach(linha => {
        const codigo = normalizarTexto(linha.children[0].innerText);
        const nome = normalizarTexto(linha.children[1].innerText);

        if (codigo.includes(termo) || nome.includes(termo)) {
            linha.style.display = "";
        } else {
            linha.style.display = "none";
        }
    });
});

b_addq.addEventListener("click", () => {
    limparModal();

    const produtosBaixoEstoque = produtosCache
        .filter(p => Number(p.ativo) === 1 && (p.qtd || 0) <= 10)
        .sort((a, b) => (a.qtd || 0) - (b.qtd || 0));

    lista.innerHTML = "";

    produtosBaixoEstoque.forEach((p, i) => {
        const li = document.createElement("li");
        li.textContent = `${p.nome} (${p.qtd || 0} un.)`;

        li.onclick = () => {
            inpBuscaModal.value = p.nome;
            inpBuscaModal.dataset.codigo = p.codigo_barras;

            document.getElementById("s_produto").innerText = p.nome;
            document.getElementById("s_qtda").innerText = p.qtd || 0;

            lista.innerHTML = "";
            inpAddQtd.focus();
        };

        // Sincroniza o teclado caso o mouse passe por cima
        li.addEventListener("mouseenter", () => {
            indexSelecionado = i;
            atualizarDestaqueModal(lista.querySelectorAll("li"));
        });

        lista.appendChild(li);
    });

    indexSelecionado = -1;
    modal.showModal();
});

b_addf.addEventListener("click", async () => {
    const codigo = inpBuscaModal.dataset.codigo;

    if (!codigo) {
        exibirAviso("Selecione um produto primeiro.");
        return;
    }

    const qtdAdd = Number(inpAddQtd.value);
    if (qtdAdd <= 0) {
        exibirAviso("Quantidade inválida.");
        return;
    }

    try {
        await apiFetch(`http://localhost:3000/produtos/cod/${codigo}/add`, {
            method: "PUT",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem("token")}`
            },
            body: JSON.stringify({ quantidade: qtdAdd })
        });

        modal.close();
        limparModal();
        carregarProdutos();
    } catch (err) {
        exibirAviso("Erro ao atualizar o estoque.");
    }
});

function limparModal() {
    inpBuscaModal.value = "";
    inpBuscaModal.dataset.codigo = "";
    document.getElementById("s_produto").innerText = "---";
    document.getElementById("s_qtda").innerText = "0";
    inpAddQtd.value = 0; 
    lista.innerHTML = "";
    indexSelecionado = -1;
}

let contadorOrdenacao = 0;

function aplicarOrdenacaoTabela(idTbody, colunasIgnoradas = []) {
    const tbody = typeof idTbody === "string"
        ? document.getElementById(idTbody)
        : idTbody?.querySelector?.("tbody") || idTbody;

    if (!tbody) return;

    const tabela = tbody.closest("table");
    if (!tabela) return;

    const linhasOriginais = Array.from(tbody.querySelectorAll("tr"));
    linhasOriginais.forEach((tr, index) => {
        if (tr.dataset.indexOriginal === undefined) {
            tr.dataset.indexOriginal = index;
        }
    });

    const cabecalhos = Array.from(tabela.querySelectorAll("thead th"));

    cabecalhos.forEach((th, indice) => {
        if (colunasIgnoradas.includes(indice)) return;

        th.classList.add("sortable");
        if (!th.dataset.ordem) th.dataset.ordem = "none";

        const novoTh = th.cloneNode(true);
        novoTh.dataset.ordem = th.dataset.ordem || "none";
        novoTh.dataset.prioridadeOrdenacao = th.dataset.prioridadeOrdenacao || "";
        th.parentNode.replaceChild(novoTh, th);

        novoTh.addEventListener("click", () => {
            const estadoAtual = novoTh.dataset.ordem || "none";
            const novoEstado = estadoAtual === "none"
                ? "asc"
                : estadoAtual === "asc"
                    ? "desc"
                    : "none";

            novoTh.dataset.ordem = novoEstado;
            novoTh.classList.remove("sort-asc", "sort-desc");

            if (novoEstado === "asc") {
                novoTh.classList.add("sort-asc");
                novoTh.dataset.prioridadeOrdenacao = ++contadorOrdenacao;
            } else if (novoEstado === "desc") {
                novoTh.classList.add("sort-desc");
                novoTh.dataset.prioridadeOrdenacao = ++contadorOrdenacao;
            } else {
                novoTh.dataset.prioridadeOrdenacao = "";
            }

            const ordenacoesAtivas = Array.from(tabela.querySelectorAll("thead th"))
                .map((cab, idx) => ({
                    indice: idx,
                    estado: cab.dataset.ordem || "none",
                    prioridade: Number(cab.dataset.prioridadeOrdenacao || 0)
                }))
                .filter(item => item.estado !== "none")
                .sort((a, b) => b.prioridade - a.prioridade);

            const linhas = Array.from(tbody.querySelectorAll("tr"));

            if (ordenacoesAtivas.length === 0) {
                linhas.sort((a, b) =>
                    Number(a.dataset.indexOriginal || 0) - Number(b.dataset.indexOriginal || 0)
                );
            } else {
                const obterValor = (linha, indice) => {
                    const celula = linha.children[indice];
                    if (!celula) return "";
                    const controle = celula.querySelector("input, select");
                    return controle ? controle.value.trim() : celula.textContent.trim();
                };

                const eAgendamento = tabela.querySelectorAll("thead th").length === 7 && tbody.id === "tb_tbl_produtos";

                linhas.sort((a, b) => {
                    for (const ordem of ordenacoesAtivas) {
                        let resultado;

                        // No Agendamento, a coluna Data usa o valor original guardado no <tr>.
                        if (eAgendamento && ordem.indice === 5) {
                            const dataA = new Date(a.dataset.data || 0).getTime();
                            const dataB = new Date(b.dataset.data || 0).getTime();
                            resultado = dataA - dataB;
                        } else {
                            const valA = obterValor(a, ordem.indice);
                            const valB = obterValor(b, ordem.indice);
                            const textoA = String(valA || "").trim();
                            const textoB = String(valB || "").trim();

                            const numA = parseFloat(textoA
                                .replace(/R\$/g, "")
                                .replace(/#/g, "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim());
                            const numB = parseFloat(textoB
                                .replace(/R\$/g, "")
                                .replace(/#/g, "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim());

                            if (!Number.isNaN(numA) && !Number.isNaN(numB) && textoA !== "" && textoB !== "") {
                                resultado = numA - numB;
                            } else {
                                resultado = textoA.localeCompare(textoB, "pt-BR", {
                                    numeric: true,
                                    sensitivity: "base"
                                });
                            }
                        }

                        if (resultado !== 0) {
                            return ordem.estado === "asc" ? resultado : -resultado;
                        }
                    }

                    return Number(a.dataset.indexOriginal || 0) - Number(b.dataset.indexOriginal || 0);
                });
            }

            linhas.forEach(linha => tbody.appendChild(linha));
        });
    });
}

async function carregarProdutos() {
    try {
        const res = await apiFetch("http://localhost:3000/produtos", {
            headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
        });
        const produtos = await res.json();

        produtosCache = produtos;
        tabela.innerHTML = "";

        produtos.forEach(p => {
            tabela.innerHTML += `
                <tr>
                    <td>${p.codigo_barras || ""}</td>
                    <td>${p.nome || ""}</td>
                    <td>${p.categoria_nome || ""}</td>
                    <td>R$ ${parseFloat(p.preco || 0).toFixed(2).replace(".", ",")}</td>
                    <td>${p.qtd || 0}</td>
                    <td>${p.disponivel || 0}</td>
                    <td>${p.qtd_min || 0}</td>
                    <td>
                        <select class="select-status-produto" data-id="${p.id_produto}">
                            <option value="1" ${Number(p.ativo) === 1 ? "selected" : ""}>Ativo</option>
                            <option value="0" ${Number(p.ativo) === 0 ? "selected" : ""}>Inativo</option>
                        </select>
                    </td>
                </tr>
            `;
        });

        // Configura os ouvintes do select de status
        tabela.querySelectorAll(".select-status-produto").forEach(select => {
            select.addEventListener("change", async (e) => {
                const idProduto = e.target.getAttribute("data-id");
                const novoStatus = e.target.value;

                try {
                   // Em estoque.html (por volta da linha 400)
                const resStatus = await apiFetch(`http://localhost:3000/produtos/id/${idProduto}/status`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    },
                    body: JSON.stringify({ ativo: novoStatus })
                    });

                    if (!resStatus.ok) {
                        alert("Erro ao atualizar o status do produto.");
                        carregarProdutos(); // Reverte a seleção visual em caso de falha
                    }
                } catch (errStatus) {
                    console.error("Erro na requisição de atualização de status:", errStatus);
                    alert("Erro de conexão ao alterar status.");
                    carregarProdutos();
                }
            });
        });

        // ATIVA A ORDENAÇÃO NA TABELA DE ESTOQUE
        aplicarOrdenacaoTabela(document.querySelector(".tabela"));

    } catch (err) {
        console.error("Erro ao carregar produtos:", err);
    }
}

function selecionarProdutoModal(produto) {
    if (Number(produto.ativo) !== 1) {
        exibirAviso(`O produto "${produto.nome}" está inativo e não pode receber quantidade.`);
        return;
    }

    inpBuscaModal.value = produto.nome;
    inpBuscaModal.dataset.codigo = produto.codigo_barras;

    document.getElementById("s_produto").innerText = produto.nome;
    document.getElementById("s_qtda").innerText = produto.qtd || 0;

    lista.innerHTML = "";
    indexSelecionado = -1;
    
    inpAddQtd.focus();
}

function atualizarDestaqueModal(itens) {
    itens.forEach((li, i) => {
        if (i === indexSelecionado) {
            li.style.backgroundColor = "#efac4a";
            li.style.color = "#1c1c1c";
            li.scrollIntoView({ block: "nearest" });
        } else {
            li.style.backgroundColor = "";
            li.style.color = "";
        }
    });
}

modal.addEventListener("keydown", (e) => {
    if (!modal.open) return;
    const teclasNavegacao = ["ArrowDown", "ArrowUp", "Enter"];
    if (!teclasNavegacao.includes(e.key)) return;

    if (document.activeElement === inpAddQtd && e.key === "Enter") return;

    e.preventDefault();
    const itens = lista.querySelectorAll("li");
    if (itens.length === 0) return;

    if (e.key === "ArrowDown") {
        indexSelecionado = (indexSelecionado + 1) % itens.length;
        atualizarDestaqueModal(itens);
    }
    else if (e.key === "ArrowUp") {
        indexSelecionado = (indexSelecionado - 1 + itens.length) % itens.length;
        atualizarDestaqueModal(itens);
    }
    else if (e.key === "Enter") {
        const termo = normalizarTexto(inpBuscaModal.value);
        const filtrados = produtosCache.filter(p =>
    Number(p.ativo) === 1 &&
    (normalizarTexto(p.nome).includes(termo) ||
    normalizarTexto(p.codigo_barras).startsWith(termo))
);
        
        const listaTratada = termo === ""
    ? produtosCache.filter(p => Number(p.ativo) === 1 && (p.qtd || 0) <= 10).sort((a, b) => (a.qtd || 0) - (b.qtd || 0))
    : filtrados.slice(0, 5);

        if (indexSelecionado >= 0 && listaTratada[indexSelecionado]) {
            selecionarProdutoModal(listaTratada[indexSelecionado]);
        }
    }
}, true);

inpBuscaModal.addEventListener("input", () => {
    const termo = inpBuscaModal.value.toLowerCase();
    lista.innerHTML = "";
    indexSelecionado = -1;
    
    const filtrados = produtosCache.filter(p =>
        (p.nome || "").toLowerCase().includes(termo) ||
        (p.codigo_barras || "").startsWith(termo)
    ).slice(0, 5);

    filtrados.forEach((p, i) => {
        const li = document.createElement("li");
        li.textContent = p.nome;
        li.onclick = () => selecionarProdutoModal(p);
        
        // Sincroniza o teclado caso o mouse passe por cima da lista filtrada
        li.addEventListener("mouseenter", () => {
            indexSelecionado = i;
            atualizarDestaqueModal(lista.querySelectorAll("li"));
        });

        lista.appendChild(li);
    });
});

// --- ENGENHARIA DO ACESSÓRIO DE REMOÇÃO DO ZERO ---
inpAddQtd.addEventListener("focus", () => {
    if (inpAddQtd.value === "0") {
        inpAddQtd.value = "";
    }
});

inpAddQtd.addEventListener("blur", () => {
    if (inpAddQtd.value.trim() === "") {
        inpAddQtd.value = 0;
    }
});

const b_close_modal_btn = document.getElementById("b_close_modal");
b_close_modal_btn.addEventListener("click", () => {
    modal.close();
});

document.addEventListener("DOMContentLoaded", carregarProdutos);
</script>
</body>
</html>
