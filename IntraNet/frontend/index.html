<dialog id="d_aviso">
    <div class="aviso_box">
        <div id="msg_aviso"></div>
        <div class="aviso_botoes">
            <button id="b_confirmar_aviso">OK</button>
            <button id="b_cancelar_aviso">Cancelar</button>
        </div>
    </div>
</dialog>

    <script>
        // Variáveis para controlar qual mês estamos vendo
let dataExibicao = new Date();

const modalAviso = document.getElementById("d_aviso");
const msgAviso = document.getElementById("msg_aviso");
const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
const bCancelarAviso = document.getElementById("b_cancelar_aviso");

// Função genérica de aviso estruturada com o seu layout CSS
function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
    msgAviso.innerHTML = mensagem;
    
    bCancelarAviso.style.display = mostrarCancelar ? "inline-block" : "none";

    modalAviso.showModal();

    bConfirmarAviso.onclick = () => {
        modalAviso.close();
        if (callback) callback();
    };

    bCancelarAviso.onclick = () => {
        modalAviso.close();
    };
}

function atualizarCalendario() {
    const listaDias = document.getElementById("calendario-numeros");
    const txtDiaGrande = document.getElementById("dia-grande-js");
    const txtMes = document.getElementById("nome-mes-js");
    const txtHoje = document.getElementById("hoje-texto-js");

    const diaAtual = new Date(); // Data real de hoje
    const mes = dataExibicao.getMonth();
    const ano = dataExibicao.getFullYear();

    // 1. Atualizar Textos do Topo
    const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
    
    txtMes.innerText = meses[mes];
    txtDiaGrande.innerText = diaAtual.getDate(); // Mantém o dia de hoje no destaque
    txtHoje.innerText = `Hoje, ${diasSemana[diaAtual.getDay()]}`;

    // 2. Lógica da Grade de Dias
    const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
    const ultimoDiaMes = new Date(ano, mes + 1, 0).getDate();

    listaDias.innerHTML = ""; // Limpa a grade

    // Criar espaços vazios
    for (let i = 0; i < primeiroDiaSemana; i++) {
        const divVazia = document.createElement("div");
        divVazia.style.padding = "8px 0";
        listaDias.appendChild(divVazia);
    }

    // Criar os números
    for (let dia = 1; dia <= ultimoDiaMes; dia++) {
        const divDia = document.createElement("div");
        divDia.classList.add("dia-numero");
        divDia.innerText = dia;

        // Destaque se for hoje (apenas se estivermos no mês/ano atual)
        if (dia === diaAtual.getDate() && mes === diaAtual.getMonth() && ano === diaAtual.getFullYear()) {
            divDia.classList.add("tem-evento");
        }

        listaDias.appendChild(divDia);
    }
}

// Função para as setinhas funcionarem
function mudarMes(direcao) {
    dataExibicao.setMonth(dataExibicao.getMonth() + direcao);
    atualizarCalendario();
}

// Iniciar ao carregar a página
async function carregarAgendamentosHome() {
    const tbody = document.getElementById("tb_agendamentos_home");

    try {
        const resposta = await fetch("http://localhost:3000/agendamento", {
            headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`
            }
        });

        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }
            
        const dados = await resposta.json();

        // ORDENAÇÃO: Data mais próxima primeiro
        dados.sort((a, b) => {
            const dataA = new Date(a.data_ag || a.data);
            const dataB = new Date(b.data_ag || b.data);
            return dataA - dataB;
        });

        tbody.innerHTML = "";

        if (!dados || dados.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="sem-agendamentos">
                        Nenhum agendamento encontrado.
                    </td>
                </tr>
            `;
            return;
        }

        dados.slice(0, 8).forEach(item => {
            // LÓGICA DE FORMATAÇÃO DE DATA E HORA
            const dataRaw = item.data_ag;
            let dataFormatada = "---";

            if (dataRaw) {
                const dataObjeto = new Date(dataRaw);
                if (!isNaN(dataObjeto)) {
                    dataFormatada = dataObjeto.toLocaleString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            }

            tbody.innerHTML += `
                <tr>
                    <td>${item.cliente_nome || "Cliente"}</td>
                    <td>${item.produtos ? item.produtos.map(p => p.nome).join(", ") : "---"}</td>
                    <td>${dataFormatada}</td>
                </tr>
            `;
        });

    } catch (erro) {
        console.error("Erro ao carregar agendamentos:", erro);
        exibirAviso("Não foi possível carregar a lista de próximos agendamentos.");
        tbody.innerHTML = `
            <tr>
                <td colspan="3" class="sem-agendamentos">
                    Erro ao carregar agendamentos.
                </td>
            </tr>
        `;
    }
}

window.addEventListener("load", () => {
    atualizarCalendario();
    carregarAgendamentosHome();
});
    </script>
