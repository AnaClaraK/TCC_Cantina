<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="stylecadp.css">
    <title>Editar Perfil</title>
    <script>
        // Verifica se existe um token no localStorage
        const token = localStorage.getItem("token");
    
        if (!token) {
            // Se não tem token, nem carrega o resto da página
            alert("Acesso restrito! Redirecionando para o login...");
            window.location.href = "login.html"; 
        }
    </script>
</head>
<body class="fundo-escuro">

    <form id="formPerfil" enctype="multipart/form-data">
        <h2 class="titulo">Editar Meu Perfil</h2>
    
        <div class="container-flex">
            <div class="coluna">
                <div class="user-photo-grande">
                    <img id="preview-perfil" src=""/>
                </div>
    
                <label class="file-label">
                    Trocar Foto
                    <input type="file" name="imagem" id="inputImagemPerfil" accept="image/*">
                </label>
    
                <label class="label-amarela">Nome</label>
                <input type="text" id="edit-nome" name="nome" class="inp_p" placeholder="Seu nome">
    
                <label class="label-amarela">E-mail</label>
                <input type="email" id="edit-email" name="email" class="inp_p" placeholder="Seu e-mail">
            </div>
    
            <div class="coluna">
                <p id="titulo_seg">Segurança</p>
                
                <label class="label-amarela">Senha Atual</label>
                <input type="password" name="senha_atual" class="inp_p" placeholder="Senha atual">
                
                <label class="label-amarela">Nova Senha</label>
                <input type="password" name="nova_senha" class="inp_p" placeholder="Nova senha">
                
                <label class="label-amarela">Confirmar Senha</label>
                <input type="password" name="conf_senha" class="inp_p" placeholder="Confirme a senha">
            </div>
        </div>
    
        <div class="botoes-fileira">
            <button type="submit" class="btn-p">Salvar</button>
            <button type="button" onclick="window.location.href='index.html'" class="btn-p btn-cinza">Cancelar</button>
            <button type="button" onclick="logout()" class="btn-p btn-vermelho">Sair</button>
        </div>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nome = localStorage.getItem("usuarioNome");
            const email = localStorage.getItem("usuarioEmail");
            const foto = localStorage.getItem("usuarioFoto");

            console.log("Foto recuperada do localStorage:", foto);

            if(nome) document.getElementById('edit-nome').value = nome;
            if(email) document.getElementById('edit-email').value = email;
            
            const preview = document.getElementById('preview-perfil');

            // Verifica se a foto existe, se não é a string "null" ou "undefined"
            if(foto && foto !== "null" && foto !== "undefined" && foto !== "") {
                // Se o caminho não começar com /, nós adicionamos. Se já tiver, mantemos.
                const caminhoTratado = foto.startsWith('/') ? foto : '/' + foto;
                preview.src = "http://localhost:3000" + caminhoTratado;
            } else {
                // Imagem padrão
                preview.src = "images/def_avt.jpg";
            }
        });

        const inputImagem = document.getElementById("inputImagemPerfil");
        const preview = document.getElementById("preview-perfil");

        inputImagem.addEventListener("change", () => {
            const file = inputImagem.files[0];
            if(file) preview.src = URL.createObjectURL(file);
        });

        document.getElementById("formPerfil").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            formData.append("emailAntigo", localStorage.getItem("usuarioEmail"));

            try {
                const response = await apiFetch("http://localhost:3000/perfil/atualizar", {
                    method: "PUT",
                    body: formData
                });

                const dados = await response.json();

                if(response.ok) {
                    localStorage.setItem("usuarioNome", dados.novoNome);
                    localStorage.setItem("usuarioEmail", dados.novoEmail);
                    if(dados.novaFoto) localStorage.setItem("usuarioFoto", dados.novaFoto);
                    
                    alert("Perfil atualizado!");
                    window.location.reload(); 
                } else {
                    alert(dados.resposta || "Erro ao salvar.");
                }
            } catch (error) {
                alert("Erro de conexão.");
            }
        });
    </script>
</body>
</html>
