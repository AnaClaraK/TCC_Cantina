<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="styleag_es.css">
    <link rel="stylesheet" href="layout.css">
    <title>Reposição</title>
    <style>
        /* Estilos do Modal */
        dialog { border: none; border-radius: 8px; padding: 20px; background: #2c2c2c; color: white; }
        dialog::backdrop { background: rgba(0,0,0,0.7); }
        
        /* Estilos do Autocomplete */
        #lista_sugestoes { list-style: none; padding: 0; background: #444; position: absolute; width: 200px; z-index: 100; }
        #lista_sugestoes li { padding: 5px; cursor: pointer; border-bottom: 1px solid #555; }
        #lista_sugestoes li:hover { background: #666; }

        /* CENTRALIZAÇÃO E ESPAÇAMENTO */
        .header-acoes { 
            display: flex; 
            align-items: center; 
            justify-content: center; /* COLOCA NO MEIO */
            gap: 15px; 
            margin-bottom: 0px; 
        }

        .h_ag { 
            margin: 0; 
            font-size: 24px; 
        }

        /* Botões com o MESMO MODELO E TAMANHO */
        #b_addq, #b_apagar_prod, #b_limpar_lista {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: #1a1a1a;
            color: #ffc27a;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-weight: bold;
            transition: 0.2s;
            width: 250px; /* LARGURA FIXA PARA FICAREM IGUAIS */
            height: 45px; /* ALTURA PADRONIZADA */
        }

        #b_addq:hover, #b_apagar_prod:hover, #b_limpar_lista:hover {
            filter: brightness(1.2);
        }

        /* Ajuste da busca para acompanhar a centralização */
        #d_inp { 
            margin-bottom: 0px; 
            padding-bottom: 5px; 
            display: flex;
            justify-content: center;
        }

        #sc_tabela { 
            margin-top: 0 !important; 
            padding-top: 0 !important;
        }
        
        .tabela { 
            margin-top: 0 !important; 
        }

        .d_util {
            padding-bottom: 0px;
        }
    </style>
</head>
<body class="fundo-escuro">
    <div class="d_util">
        
        <div class="header-acoes">
            <h2 class="h_ag">Reposição</h2>

            <button id="b_addq">
                <span id="s_addq">Adicionar Produto</span>
            </button>

            <button id="b_apagar_prod">
                <span>Apagar produto</span>
            </button>

            <button id="b_limpar_lista">
                <span>Apagar lista</span>
            </button>
        </div>

        <div id="d_inp">
            <div class="busca-box">
                <img src="images/lupa.png" class="icone-busca">
                <input type="text" id="inputBusca" placeholder="Buscar por nome ou código...">
            </div>
        </div>
    </div>

    <section id="sc_tabela" class="container">
        <table class="tabela">
            <thead>
                <tr>
                    <th scope="col">Produto</th>
                    <th scope="col">Quantidade</th>
                    <th scope="col">Prioridade</th>
                    <th scope="col">Local</th>
                    <th scope="col">Concluído</th>
                </tr>
            </thead>
            <tbody id="tb_tbl_estoque">
            </tbody>
        </table>
    </section>     

    <dialog id="d_modal">
        <div class="modal_box">
            <button id="b_close_modal" onclick="document.getElementById('d_modal').close()">x</button>
            
            <h2>Adicionar à Reposição</h2>
            
            <input type="text" class="inp_m" id="inp_busca_modal" placeholder="Pesquisar produto...">
            <ul id="lista_sugestoes"></ul>
            
            <div style="margin-top: 20px;">
                <p class="pm">Produto: <span id="s_produto">---</span></p>
                <p class="pm">Estoque atual: <span id="s_qtda">0</span></p>
                <label class="pm">Qtd para repor:</label>
                <input type="number" class="inp_m" id="inp_add_qtd" value="0">
            </div>

            <div style="margin-top: 20px;">
                <button id="b_addf" type="button">Confirmar</button>
            </div>
        </div>
    </dialog>

<script>
const modal = document.getElementById("d_modal");
const b_addq = document.getElementById("b_addq");
const b_addf = document.getElementById("b_addf");
const b_apagar_prod = document.getElementById("b_apagar_prod");
const b_limpar_lista = document.getElementById("b_limpar_lista");
const corpoTabela = document.getElementById('tb_tbl_estoque');
const inpBuscaModal = document.getElementById("inp_busca_modal");
const lista = document.getElementById("lista_sugestoes");
const inputBusca = document.getElementById('inputBusca');

b_addq.addEventListener("click", () => {
    limparModal();
    modal.showModal();
});

b_addf.addEventListener("click", () => {
    const nome = document.getElementById("s_produto").innerText;
    const qtd = document.getElementById("inp_add_qtd").value;
    if (nome === "---" || qtd <= 0) {
        alert("Selecione um produto e uma quantidade válida");
        return;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${nome}</td><td>${qtd}</td><td>Alta</td><td>Geral</td><td><input type="checkbox"></td>`;
    corpoTabela.appendChild(tr);
    modal.close();
    limparModal();
});

function limparModal() {
    inpBuscaModal.value = "";
    document.getElementById("s_produto").innerText = "---";
    document.getElementById("s_qtda").innerText = "0";
    document.getElementById("inp_add_qtd").value = 0;
    lista.innerHTML = "";
}

b_apagar_prod.addEventListener("click", () => {
    if (corpoTabela.lastElementChild) {
        corpoTabela.removeChild(corpoTabela.lastElementChild);
    }
});

b_limpar_lista.addEventListener("click", () => {
    if (confirm("Deseja limpar toda a lista de reposição?")) {
        corpoTabela.innerHTML = "";
    }
});

inpBuscaModal.addEventListener("input", () => {
    const termo = inpBuscaModal.value.toLowerCase();
    lista.innerHTML = "";
    const mockProdutos = [
        {nome: "Coca Cola", qtd: 10},
        {nome: "Salgado Assado", qtd: 5}
    ];
    const filtrados = mockProdutos.filter(p => p.nome.toLowerCase().includes(termo));
    filtrados.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.nome;
        li.onclick = () => {
            inpBuscaModal.value = p.nome;
            document.getElementById("s_produto").innerText = p.nome;
            document.getElementById("s_qtda").innerText = p.qtd;
            lista.innerHTML = "";
        };
        lista.appendChild(li);
    });
});

inputBusca.addEventListener('keyup', function() {
    const termoBusca = inputBusca.value.toLowerCase().trim();
    const linhas = document.querySelectorAll('#tb_tbl_estoque tr');
    linhas.forEach(linha => {
        const celulaProduto = linha.getElementsByTagName('td')[0];
        if (celulaProduto) {
            const texto = celulaProduto.textContent.toLowerCase().trim();
            linha.style.display = texto.includes(termoBusca) ? "" : "none";
        }
    });
});
</script>
</body>
</html>
