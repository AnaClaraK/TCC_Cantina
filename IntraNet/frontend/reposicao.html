<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>
    <link rel="stylesheet" href="styleag_es.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">
    <title>Reposição</title>
    
    <style>
        /* Estilos visuais para indicação de ordenação nas colunas */
        table thead th.sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 20px !important;
        }

        table thead th.sortable::after {
            content: " ↕";
            font-size: 0.8em;
            opacity: 0.4;
            margin-left: 5px;
        }

        table thead th.sort-asc::after {
            content: " ▲";
            opacity: 1;
            color: #007bff;
        }

        table thead th.sort-desc::after {
            content: " ▼";
            opacity: 1;
            color: #007bff;
        }
    </style>

    <script>
        // Verifica se existe um token no localStorage
        const token = localStorage.getItem("token");
   
        if (!token) {
            // Se não tem token, nem carrega o resto da página
            exibirAviso("Acesso restrito! Redirecionando para o login...");
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="fundo-escuro">
    <div class="d_util">
        <div class="header-acoes">
            <h2 class="h_ag">Reposição</h2>

            <button id="b_addq">
                <span id="s_addq">Adicionar produto</span>
            </button>

            <button id="b_apagar_prod">
                <span>Apagar produto</span>
            </button>

            <button id="b_limpar_lista">
                <span>Apagar lista</span>
            </button>
        </div>

        <button id="b_imprimir_lista" onclick="gerarPdfReposicao()">
              <span>Imprimir Lista</span>
        </button>

        <div id="d_inp">
            <div class="busca-box">
                <img src="../backend/imagens/lupa.png" class="icone-busca">
                <input type="text" id="inputBusca" placeholder="Buscar por nome ou prioridade">
            </div>
        </div>
    </div>

    <section id="sc_tabela" class="container">
        <table class="tabela">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade prevista</th>
                    <th>Quantidade comprada</th>
                    <th>Prioridade</th>
                    <th>Local</th>
                    <th>Concluir</th>
                </tr>
            </thead>
            <tbody id="tb_tbl_estoque"></tbody>
        </table>
    </section>    

    <dialog id="d_modal">
        <div class="modal_box">
            <button id="b_close_modal">x</button>
            
            <h2 class="modal_titulo">Reposição</h2>
            
            <div class="autocomplete-box">
                <input type="text" class="inp_m" id="inp_busca_modal" placeholder="Pesquisar produto" autocomplete="off">
                <ul id="lista_sugestoes"></ul>
            </div>
            
            <div style="margin-top: 20px;">
                <p class="pm">Produto: <span id="s_produto">---</span></p>
                <p class="pm">Estoque atual: <span id="s_qtda">0</span></p>
                
                <label class="pm">Quantidade prevista:</label>
                <input type="number" class="inp_m" id="inp_add_qtd" placeholder="">

                <label class="pm">Local</label>
                <input type="text" class="inp_m" id="inp_add_local" placeholder="" minlength="3">

                <label class="pm">Prioridade</label>

                <input type="hidden" id="inp_add_prioridade" value="">

                <div class="select-categoria select-prioridade" id="selectPrioridade">

                    <button type="button" class="select-categoria-btn" id="btnPrioridade">
                        <span id="textoPrioridade"></span>
                        <span class="select-seta">▼</span>
                    </button>

                    <div class="select-categoria-lista" id="listaPrioridade">

                        <div class="categoria-opcao" data-value="Baixa">
                            Baixa
                        </div>

                        <div class="categoria-opcao" data-value="Média">
                            Média
                        </div>

                        <div class="categoria-opcao" data-value="Alta">
                            Alta
                        </div>

                    </div>

                </div>
            </div>
        
            <button class="b_addf">Confirmar</button>
        
            <div class="modal_footer_instrucao">
                <p>Use as setas ↑ ↓ e Enter para selecionar</p>
            </div>
        </div>
    </dialog>

    <dialog id="d_aviso">
        <div class="aviso_box">
            <p id="msg_aviso"></p>
            <div class="aviso_botoes">
                <button id="b_confirmar_aviso">OK</button>
                <button id="b_cancelar_aviso" style="display:none;">Cancelar</button>
            </div>
        </div>
    </dialog>

    <script src="gerarpdf.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <script>
    async function apiFetch(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
            let mensagem = `Erro na requisição: ${response.status}`;
            try {
                const dados = await response.clone().json();
                mensagem = dados.erro || dados.resposta || mensagem;
            } catch (_) {}
            throw new Error(mensagem);
        }
        return response;
    }

    const modal = document.getElementById("d_modal");
    const b_addq = document.getElementById("b_addq");
    const b_addf = document.querySelector(".b_addf");
    const b_close_modal = document.getElementById("b_close_modal");
    const b_apagar_prod = document.getElementById("b_apagar_prod");
    const b_limpar_lista = document.getElementById("b_limpar_lista");
    const corpoTabela = document.getElementById('tb_tbl_estoque');
    const inpBuscaModal = document.getElementById("inp_busca_modal");
    const lista = document.getElementById("lista_sugestoes");
    const inputBusca = document.getElementById('inputBusca');

    const aviso = document.getElementById("d_aviso");
    const msgAviso = document.getElementById("msg_aviso");
    const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
    const bCancelarAviso = document.getElementById("b_cancelar_aviso");
    const b_imprimir_reposicao = document.getElementById("b_imprimir_lista");

    let produtosCache = [];

    // Função universal para aplicar ordenação com setas visuais nas tabelas
    function aplicarOrdenacaoTabela(idTbody, colunasIgnoradas = []) {
        const tbody = document.getElementById(idTbody);
        if (!tbody) return;

        const tabela = tbody.closest("table");
        if (!tabela) return;

        const cabecalhos = tabela.querySelectorAll("thead th");

        cabecalhos.forEach((th, indice) => {
            if (colunasIgnoradas.includes(indice)) return;

            th.classList.add("sortable");

            // Remove ouvintes antigos clonando o elemento
            const novoTh = th.cloneNode(true);
            th.parentNode.replaceChild(novoTh, th);

            novoTh.addEventListener("click", () => {
                const direcaoAtual = novoTh.classList.contains("sort-asc") ? "desc" : "asc";

                // Atualiza classes visuais
                cabecalhos.forEach(c => c.classList.remove("sort-asc", "sort-desc"));
                novoTh.classList.add(direcaoAtual === "asc" ? "sort-asc" : "sort-desc");

                const linhas = Array.from(tbody.querySelectorAll("tr"));

                linhas.sort((a, b) => {
                    const inputA = a.children[indice]?.querySelector("input");
                    const inputB = b.children[indice]?.querySelector("input");

                    const valA = inputA ? inputA.value.trim() : a.children[indice]?.textContent.trim() || "";
                    const valB = inputB ? inputB.value.trim() : b.children[indice]?.textContent.trim() || "";

                    const numA = parseFloat(valA.replace("R$", "").replace("#", "").replace(".", "").replace(",", ".").trim());
                    const numB = parseFloat(valB.replace("R$", "").replace("#", "").replace(".", "").replace(",", ".").trim());

                    if (!isNaN(numA) && !isNaN(numB)) {
                        return direcaoAtual === "asc" ? numA - numB : numB - numA;
                    }

                    return direcaoAtual === "asc" 
                        ? valA.localeCompare(valB, "pt-BR", { numeric: true }) 
                        : valB.localeCompare(valA, "pt-BR", { numeric: true });
                });

                linhas.forEach(linha => tbody.appendChild(linha));
            });
        });
    }

    function adicionarLinhaTabela(
        nome,
        qtd,
        local,
        prioridade = "Média",
        codigo = "",
        valorComprado = "",
        status = "Pendente"
    ) {
        const tr = document.createElement('tr');
        tr.dataset.codigo = codigo;
        
        tr.innerHTML = `
            <td>${nome}</td>
            <td>${qtd}</td>
            <td><input type="number" value="${valorComprado}" class="input-reposicao input-qtd">
            </td>
            <td>${prioridade}</td>
            <td><input 
                type="text"
                value="${local}"
                class="input-reposicao input-local">
            </td>
            <td>
                <input type="checkbox" class="chk-concluido">
            </td>
        `;

        corpoTabela.appendChild(tr);

        const checkbox = tr.querySelector(".chk-concluido");
        const inputComprado = tr.querySelector('td:nth-child(3) input');

        checkbox.addEventListener("change", async function () {
            if (this.checked) {
                let qtdFinal = inputComprado.value;
                if (!qtdFinal || qtdFinal <= 0) {
                    qtdFinal = qtd;
                }

                const prodCodigo = tr.dataset.codigo;

                if (prodCodigo) {
                    try {
                        await apiFetch(`http://localhost:3000/reposicao/${prodCodigo}/concluir`, {
                            method: "PUT",
                            headers: { 
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${localStorage.getItem("token")}`
                            },
                            body: JSON.stringify({
                                quantidade_comprada: Number(qtdFinal),
                                local: tr.querySelector(".input-local").value
                            })
                        });
                        
                        exibirAviso(`Reposição de ${qtdFinal} un. adicionada ao estoque!`, () => {
                            tr.remove();
                        });
                    } catch (err) {
                        exibirAviso(err.message || "Erro ao atualizar estoque. Tente novamente.");
                        this.checked = false;
                    }
                } else {
                    exibirAviso("Reposição concluída!", () => {
                        tr.remove();
                    });
                }
            }
        });
    }

    function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
        msgAviso.innerText = mensagem;
        bCancelarAviso.style.display = mostrarCancelar ? "block" : "none";

        aviso.showModal();

        bConfirmarAviso.onclick = () => {
            aviso.close();
            if (callback) callback();
        };

        bCancelarAviso.onclick = () => {
            aviso.close();

            if (window.checkboxAtual) {
                window.checkboxAtual.checked = false;
                window.checkboxAtual.blur();
                window.checkboxAtual = null;
            }
        };
    }

    b_addq.addEventListener("click", () => {
        limparModal();
        modal.showModal();
    });

    b_close_modal.addEventListener("click", () => {
        modal.close();
    });

    function limparModal() {
        inpBuscaModal.value = "";

        if (inpBuscaModal.dataset) {
            inpBuscaModal.dataset.codigo = "";
        }

        document.getElementById("s_produto").innerText = "---";
        document.getElementById("s_qtda").innerText = "0";
        document.getElementById("inp_add_qtd").value = "";
        document.getElementById("inp_add_local").value = "";
        document.getElementById("inp_add_prioridade").value = "";

        lista.innerHTML = "";
        textoPrioridade.textContent = "";

        listaPrioridade
            .querySelectorAll(".categoria-opcao")
            .forEach(item => {
                item.classList.remove("selecionada");
            });

        selectPrioridade.classList.remove("aberto");
    }

    b_addf.addEventListener("click", async () => {
        const nome = document.getElementById("s_produto").innerText;
        const qtd = Number(document.getElementById("inp_add_qtd").value);
        const local = document.getElementById("inp_add_local").value.trim();
        const codigo = inpBuscaModal.dataset.codigo;
        const prioridade = document.getElementById("inp_add_prioridade").value;

        if (nome === "---" || !codigo) {
            exibirAviso("Por favor, selecione um produto.");
            return;
        }

        if (!qtd || qtd <= 0) {
            exibirAviso("Digite uma quantidade válida.");
            return;
        }

        if (local === "") {
            exibirAviso("Preencha o local.");
            return;
        }

        if (local.length < 3) {
            exibirAviso("O local deve ter no mínimo 3 caracteres.");
            return;
        }

        try {
            await apiFetch(`http://localhost:3000/reposicao/${codigo}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${localStorage.getItem("token")}`
                },
                body: JSON.stringify({
                    quantidade: qtd,
                    local: local,
                    prioridade: prioridade
                })
            });

            adicionarLinhaTabela(
                nome,
                qtd,
                local,
                prioridade,
                codigo,
                0,
                "Pendente"
            );

            exibirAviso("Reposição adicionada com sucesso!");

            modal.close();
            limparModal();

        } catch (err) {
            console.error("Erro na rota de reposição:", err);
            exibirAviso(err.message || "Não foi possível adicionar a reposição.");
        }
    });

    b_apagar_prod.addEventListener("click", () => {
        const linhas = corpoTabela.querySelectorAll('tr');
        if (linhas.length === 0) {
            exibirAviso("A lista está vazia.");
            return;
        }

        exibirAviso("Clique na linha do produto que deseja apagar.");

        const selecionarParaApagar = (e) => {
            const linhaClicada = e.target.closest('tr');
            if (linhaClicada && corpoTabela.contains(linhaClicada)) {
                const nomeProd = linhaClicada.cells[0].innerText;
                
                exibirAviso(`Deseja realmente remover o produto: ${nomeProd}?`, async () => {
                    const codigo = linhaClicada.dataset.codigo;

                    try {
                        await apiFetch(
                            `http://localhost:3000/reposicao/${codigo}/cancelar`,
                            {
                                method: "PUT",
                                headers: {
                                    "Authorization": `Bearer ${localStorage.getItem("token")}`
                                }
                            }
                        );

                        linhaClicada.remove();
                        exibirAviso("Produto removido com sucesso!");

                    } catch (erro) {
                        console.error(erro);
                        exibirAviso("Erro ao remover produto.");
                    }

                }, true);

                corpoTabela.removeEventListener('click', selecionarParaApagar);
                corpoTabela.style.cursor = "default";
            }
        };

        corpoTabela.addEventListener('click', selecionarParaApagar);
        corpoTabela.style.cursor = "pointer";
    });

    b_limpar_lista.addEventListener("click", () => {
        const linhas = corpoTabela.querySelectorAll('tr');
        if (linhas.length === 0) {
            exibirAviso("A lista já está vazia.");
            return;
        }

        exibirAviso("Deseja limpar toda a lista de reposição?", async () => {
            try {
                await apiFetch(
                    "http://localhost:3000/reposicao/cancelar/todos",
                    {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${localStorage.getItem("token")}`
                        }
                    }
                );

                corpoTabela.innerHTML = "";
                exibirAviso("Lista apagada!");

            } catch (erro) {
                console.error(erro);
                exibirAviso("Erro ao limpar lista.");
            }

        }, true);
    });

    async function carregarProdutos() {
        try {
            const res = await apiFetch("http://localhost:3000/reposicao/produtos", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${localStorage.getItem("token")}`
                }
            });

            produtosCache = await res.json();
        } catch (err) {
            console.error("ERRO CRÍTICO AO CARREGAR PRODUTOS:", err);

            if (err.message.includes("401")) {
                exibirAviso("Sua sessão expirou. Faça login novamente.", () => {
                    window.location.href = "login.html";
                });
            }
        }
    }

    inputBusca.addEventListener('keyup', function() {
        const termoBusca = inputBusca.value.toLowerCase().trim();
        const linhas = document.querySelectorAll('#tb_tbl_estoque tr');

        linhas.forEach(linha => {
            const celulaProduto = linha.getElementsByTagName('td')[0];
            const celulaPrioridade = linha.getElementsByTagName('td')[3];

            if (celulaProduto && celulaPrioridade) {
                const textoProduto = celulaProduto.textContent.toLowerCase().trim();
                const textoPrioridade = celulaPrioridade.textContent.toLowerCase().trim();

                if (textoProduto.includes(termoBusca) || textoPrioridade.includes(termoBusca)) {
                    linha.style.display = "";
                } else {
                    linha.style.display = "none";
                }
            }
        });
    });

    let indexSelecionado = -1;

    function atualizarDestaque(itens) {
        itens.forEach((li, i) => {
            li.classList.toggle("ativo", i === indexSelecionado);
            if (i === indexSelecionado) {
                li.scrollIntoView({ block: "nearest" });
            }
        });
    }

    inpBuscaModal.addEventListener("keydown", (e) => {
        const itens = lista.querySelectorAll("li");

        if (e.key === "ArrowDown") {
            e.preventDefault();
            indexSelecionado = (indexSelecionado + 1) % itens.length;
            atualizarDestaque(itens);
        } 
        else if (e.key === "ArrowUp") {
            e.preventDefault();
            indexSelecionado = (indexSelecionado - 1 + itens.length) % itens.length;
            atualizarDestaque(itens);
        } 
        else if (e.key === "Enter") {
            e.preventDefault();
            if (indexSelecionado > -1 && itens[indexSelecionado]) {
                itens[indexSelecionado].click();
            }
        }
    });

    inpBuscaModal.addEventListener("input", () => {
        const termo = inpBuscaModal.value.toLowerCase().trim();
        lista.innerHTML = "";
        indexSelecionado = -1; 

        if (termo === "") return;

        const filtrados = produtosCache.filter(p => {
            if (Number(p.ativo) !== 1) return false;

            const nomeProd = (p.nome || p.nome_produto || "").toLowerCase();
            const codProd = String(p.codigo_barras || p.codigo || "").toLowerCase();
            return nomeProd.includes(termo) || codProd.startsWith(termo);
        }).slice(0, 5);

        filtrados.forEach((p, i) => {
            const li = document.createElement("li");
            const nomeExibicao = p.nome || p.nome_produto || "Sem nome";
            li.textContent = nomeExibicao;

            li.onclick = () => {
                if (Number(p.ativo) !== 1) {
                    exibirAviso(`O produto "${nomeExibicao}" está inativo e não pode receber uma nova reposição.`);
                    return;
                }

                inpBuscaModal.value = nomeExibicao;
                inpBuscaModal.dataset.codigo = p.codigo_barras || p.codigo;
                document.getElementById("s_produto").innerText = nomeExibicao;
                document.getElementById("s_qtda").innerText = p.qtd || p.quantidade || 0;
                lista.innerHTML = "";
                indexSelecionado = -1;
                document.getElementById("inp_add_qtd").focus(); 
            };
            
            lista.appendChild(li);
        });
    });

    async function carregarReposicao() {
        const res = await apiFetch("http://localhost:3000/reposicao", {
            headers: {
                "Authorization": `Bearer ${localStorage.getItem("token")}`
            }
        });

        const dados = await res.json();

        const ordemPrioridade = {
            "Alta": 1,
            "Média": 2,
            "Baixa": 3
        };

        dados.sort((a, b) => {
            return (ordemPrioridade[a.prioridade] || 99) -
                   (ordemPrioridade[b.prioridade] || 99);
        });

        corpoTabela.innerHTML = "";

        dados.forEach(item => {
            adicionarLinhaTabela(
                item.nome,
                item.quantidade_prevista,
                item.local,
                item.prioridade,
                item.codigo,
                item.quantidade_comprada,
                item.status
            );
        });

        // Aplica e reativa o evento de clique e setas nos cabeçalhos após carregar os dados
        aplicarOrdenacaoTabela("tb_tbl_estoque", [5]);
    }

    const selectPrioridade = document.getElementById("selectPrioridade");
    const btnPrioridade = document.getElementById("btnPrioridade");
    const textoPrioridade = document.getElementById("textoPrioridade");
    const listaPrioridade = document.getElementById("listaPrioridade");
    const inputPrioridade = document.getElementById("inp_add_prioridade");

    btnPrioridade.addEventListener("click", (e) => {
        e.stopPropagation();
        selectPrioridade.classList.toggle("aberto");
    });

    listaPrioridade.querySelectorAll(".categoria-opcao").forEach(opcao => {
        opcao.addEventListener("click", () => {
            const valor = opcao.dataset.value;
            textoPrioridade.textContent = valor;
            inputPrioridade.value = valor;

            listaPrioridade
                .querySelectorAll(".categoria-opcao")
                .forEach(item => {
                    item.classList.remove("selecionada");
                });

            opcao.classList.add("selecionada");
            selectPrioridade.classList.remove("aberto");
        });
    });

    document.addEventListener("click", (e) => {
        if (!selectPrioridade.contains(e.target)) {
            selectPrioridade.classList.remove("aberto");
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        carregarProdutos();
        carregarReposicao();
    });

    b_imprimir_reposicao.addEventListener("click", () => {
        gerarPdfReposicao();
    });
    </script>
</body>
</html>
