    <style>
        /* Estilos visuais para indicação de ordenação nas colunas */
        table thead th.sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 34px !important;
        }

        table thead th.sortable::after {
            content: "↑↓";
            display: inline-block;
            white-space: nowrap;
            margin-left: 7px;
            font-size: 0.78em;
            letter-spacing: -2px;
            opacity: 0.38;
            font-weight: normal;
        }

        table thead th.sort-asc::after {
            content: "↑";
            opacity: 1;
            letter-spacing: 0;
        }

        table thead th.sort-desc::after {
            content: "↓";
            opacity: 1;
            letter-spacing: 0;
        }

</style>

        const token = localStorage.getItem("token");

    <script>
    async function apiFetch(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
            let mensagem = `Erro na requisição: ${response.status}`;
            try {
                const dados = await response.clone().json();
                mensagem = dados.erro || dados.resposta || mensagem;
            } catch (_) {}
            throw new Error(mensagem);
        }
        return response;
    }

    const modal = document.getElementById("d_modal");
    const b_addq = document.getElementById("b_addq");
    const b_addf = document.querySelector(".b_addf");
    const b_close_modal = document.getElementById("b_close_modal");
    const b_apagar_prod = document.getElementById("b_apagar_prod");
    const b_limpar_lista = document.getElementById("b_limpar_lista");
    const corpoTabela = document.getElementById('tb_tbl_estoque');
    const inpBuscaModal = document.getElementById("inp_busca_modal");
    const lista = document.getElementById("lista_sugestoes");
    const inputBusca = document.getElementById('inputBusca');

    const aviso = document.getElementById("d_aviso");
    const msgAviso = document.getElementById("msg_aviso");
    const bConfirmarAviso = document.getElementById("b_confirmar_aviso");
    const bCancelarAviso = document.getElementById("b_cancelar_aviso");
    const b_imprimir_reposicao = document.getElementById("b_imprimir_lista");

    let produtosCache = [];

    // Função universal para aplicar ordenação com setas visuais nas tabelas
    function aplicarOrdenacaoTabela(idTbody, colunasIgnoradas = []) {
    const tbody = document.getElementById(idTbody);
    if (!tbody) return;

    const tabela = tbody.closest("table");
    if (!tabela) return;

    const cabecalhos = Array.from(tabela.querySelectorAll("thead th"));

    // Guarda a ordem em que as linhas foram renderizadas.
    const linhasAtuais = Array.from(tbody.querySelectorAll("tr"));
    if (linhasAtuais.length > 0) {
        linhasAtuais.forEach((tr, index) => {
            if (tr.dataset.indexOriginal === undefined) {
                tr.dataset.indexOriginal = index;
            }
        });
    }

    cabecalhos.forEach((th, indice) => {
        if (colunasIgnoradas.includes(indice)) return;

        th.classList.add("sortable");

        // Evita acumular listeners quando a tabela é renderizada novamente.
        const novoTh = th.cloneNode(true);
        novoTh.classList.remove("sort-asc", "sort-desc");
        novoTh.dataset.ordem = th.dataset.ordem || "none";
        if (novoTh.dataset.ordem === "asc") novoTh.classList.add("sort-asc");
        if (novoTh.dataset.ordem === "desc") novoTh.classList.add("sort-desc");
        th.parentNode.replaceChild(novoTh, th);

        novoTh.addEventListener("click", () => {
            const estadoAtual = novoTh.dataset.ordem || "none";
            const novoEstado =
                estadoAtual === "none" ? "asc" :
                estadoAtual === "asc" ? "desc" :
                "none";

            novoTh.dataset.ordem = novoEstado;
            novoTh.classList.remove("sort-asc", "sort-desc");

            if (novoEstado === "asc") novoTh.classList.add("sort-asc");
            if (novoEstado === "desc") novoTh.classList.add("sort-desc");

            const estados = Array.from(tabela.querySelectorAll("thead th"))
                .map((cabecalho, coluna) => ({
                    coluna,
                    estado: cabecalho.dataset.ordem || "none"
                }))
                .filter(item => item.estado !== "none" && !colunasIgnoradas.includes(item.coluna));

            const linhas = Array.from(tbody.querySelectorAll("tr"));

            // Nenhuma coluna ordenada: volta exatamente para a ordem original.
            if (estados.length === 0) {
                linhas.sort((a, b) =>
                    Number(a.dataset.indexOriginal || 0) -
                    Number(b.dataset.indexOriginal || 0)
                );
            } else {
                // Permite manter várias colunas com ordenação.
                // A primeira coluna ativa é o critério principal.
                linhas.sort((a, b) => {
                    for (const item of estados) {
                        const coluna = item.coluna;
                        const direcao = item.estado === "asc" ? 1 : -1;

                        const inputA = a.children[coluna]?.querySelector("input");
                        const inputB = b.children[coluna]?.querySelector("input");

                        const valA = inputA
                            ? inputA.value.trim()
                            : a.children[coluna]?.textContent.trim() || "";
                        const valB = inputB
                            ? inputB.value.trim()
                            : b.children[coluna]?.textContent.trim() || "";

                        let resultado = 0;

                        // Datas.
                        if (
                            (a.dataset.data && coluna === 5) ||
                            (a.dataset.data && coluna === 3 && idTbody === "tb_tbl_produtos")
                        ) {
                            const dataA = new Date(a.dataset.data).getTime();
                            const dataB = new Date(b.dataset.data).getTime();

                            if (!isNaN(dataA) && !isNaN(dataB)) {
                                resultado = dataA - dataB;
                            }
                        }

                        // Números / valores em R$.
                        if (resultado === 0) {
                            const textoA = valA
                                .replace(/R\$\s*/g, "")
                                .replace("#", "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim();
                            const textoB = valB
                                .replace(/R\$\s*/g, "")
                                .replace("#", "")
                                .replace(/\./g, "")
                                .replace(",", ".")
                                .trim();

                            const numA = parseFloat(textoA);
                            const numB = parseFloat(textoB);

                            if (!isNaN(numA) && !isNaN(numB)) {
                                resultado = numA - numB;
                            }
                        }

                        // Texto.
                        if (resultado === 0) {
                            resultado = valA.localeCompare(
                                valB,
                                "pt-BR",
                                { numeric: true, sensitivity: "base" }
                            );
                        }

                        if (resultado !== 0) {
                            return resultado * direcao;
                        }
                    }

                    return (
                        Number(a.dataset.indexOriginal || 0) -
                        Number(b.dataset.indexOriginal || 0)
                    );
                });
            }

            linhas.forEach(linha => tbody.appendChild(linha));
        });
    });
}

    function adicionarLinhaTabela(
        nome,
        qtd,
        local,
        prioridade = "Média",
        codigo = "",
        valorComprado = "",
        status = "Pendente"
    ) {
        const tr = document.createElement('tr');
        tr.dataset.codigo = codigo;
        
        tr.innerHTML = `
            <td>${nome}</td>
            <td>${qtd}</td>
            <td><input type="number" value="${valorComprado}" class="input-reposicao input-qtd">
            </td>
            <td>${prioridade}</td>
            <td><input 
                type="text"
                value="${local}"
                class="input-reposicao input-local">
            </td>
            <td>
                <input type="checkbox" class="chk-concluido">
            </td>
        `;

        corpoTabela.appendChild(tr);

        const checkbox = tr.querySelector(".chk-concluido");
        const inputComprado = tr.querySelector('td:nth-child(3) input');

        checkbox.addEventListener("change", async function () {
            if (this.checked) {
                let qtdFinal = inputComprado.value;
                if (!qtdFinal || qtdFinal <= 0) {
                    qtdFinal = qtd;
                }

                const prodCodigo = tr.dataset.codigo;

                if (prodCodigo) {
                    try {
                        await apiFetch(`http://localhost:3000/reposicao/${prodCodigo}/concluir`, {
                            method: "PUT",
                            headers: { 
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${localStorage.getItem("token")}`
                            },
                            body: JSON.stringify({
                                quantidade_comprada: Number(qtdFinal),
                                local: tr.querySelector(".input-local").value
                            })
                        });
                        
                        exibirAviso(`Reposição de ${qtdFinal} un. adicionada ao estoque!`, () => {
                            tr.remove();
                        });
                    } catch (err) {
                        exibirAviso(err.message || "Erro ao atualizar estoque. Tente novamente.");
                        this.checked = false;
                    }
                } else {
                    exibirAviso("Reposição concluída!", () => {
                        tr.remove();
                    });
                }
            }
        });
    }

    function exibirAviso(mensagem, callback = null, mostrarCancelar = false) {
        msgAviso.innerText = mensagem;
        bCancelarAviso.style.display = mostrarCancelar ? "block" : "none";

        aviso.showModal();

        bConfirmarAviso.onclick = () => {
            aviso.close();
            if (callback) callback();
        };

        bCancelarAviso.onclick = () => {
            aviso.close();

            if (window.checkboxAtual) {
                window.checkboxAtual.checked = false;
                window.checkboxAtual.blur();
                window.checkboxAtual = null;
            }
        };
    }

    b_addq.addEventListener("click", () => {
        limparModal();
        modal.showModal();
    });

    b_close_modal.addEventListener("click", () => {
        modal.close();
    });

    function limparModal() {
        inpBuscaModal.value = "";

        if (inpBuscaModal.dataset) {
            inpBuscaModal.dataset.codigo = "";
        }

        document.getElementById("s_produto").innerText = "---";
        document.getElementById("s_qtda").innerText = "0";
        document.getElementById("inp_add_qtd").value = "";
        document.getElementById("inp_add_local").value = "";
        document.getElementById("inp_add_prioridade").value = "";

        lista.innerHTML = "";
        textoPrioridade.textContent = "";

        listaPrioridade
            .querySelectorAll(".categoria-opcao")
            .forEach(item => {
                item.classList.remove("selecionada");
            });

        selectPrioridade.classList.remove("aberto");
    }

    b_addf.addEventListener("click", async () => {
        const nome = document.getElementById("s_produto").innerText;
        const qtd = Number(document.getElementById("inp_add_qtd").value);
        const local = document.getElementById("inp_add_local").value.trim();
        const codigo = inpBuscaModal.dataset.codigo;
        const prioridade = document.getElementById("inp_add_prioridade").value;

        if (nome === "---" || !codigo) {
            exibirAviso("Por favor, selecione um produto.");
            return;
        }

        if (!qtd || qtd <= 0) {
            exibirAviso("Digite uma quantidade válida.");
            return;
        }

        if (local === "") {
            exibirAviso("Preencha o local.");
            return;
        }

        if (local.length < 3) {
            exibirAviso("O local deve ter no mínimo 3 caracteres.");
            return;
        }

        try {
            await apiFetch(`http://localhost:3000/reposicao/${codigo}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${localStorage.getItem("token")}`
                },
                body: JSON.stringify({
                    quantidade: qtd,
                    local: local,
                    prioridade: prioridade
                })
            });

            adicionarLinhaTabela(
                nome,
                qtd,
                local,
                prioridade,
                codigo,
                0,
                "Pendente"
            );

            exibirAviso("Reposição adicionada com sucesso!");

            modal.close();
            limparModal();

        } catch (err) {
            console.error("Erro na rota de reposição:", err);
            exibirAviso(err.message || "Não foi possível adicionar a reposição.");
        }
    });

    b_apagar_prod.addEventListener("click", () => {
        const linhas = corpoTabela.querySelectorAll('tr');
        if (linhas.length === 0) {
            exibirAviso("A lista está vazia.");
            return;
        }

        exibirAviso("Clique na linha do produto que deseja apagar.");

        const selecionarParaApagar = (e) => {
            const linhaClicada = e.target.closest('tr');
            if (linhaClicada && corpoTabela.contains(linhaClicada)) {
                const nomeProd = linhaClicada.cells[0].innerText;
                
                exibirAviso(`Deseja realmente remover o produto: ${nomeProd}?`, async () => {
                    const codigo = linhaClicada.dataset.codigo;

                    try {
                        await apiFetch(
                            `http://localhost:3000/reposicao/${codigo}/cancelar`,
                            {
                                method: "PUT",
                                headers: {
                                    "Authorization": `Bearer ${localStorage.getItem("token")}`
                                }
                            }
                        );

                        linhaClicada.remove();
                        exibirAviso("Produto removido com sucesso!");

                    } catch (erro) {
                        console.error(erro);
                        exibirAviso("Erro ao remover produto.");
                    }

                }, true);

                corpoTabela.removeEventListener('click', selecionarParaApagar);
                corpoTabela.style.cursor = "default";
            }
        };

        corpoTabela.addEventListener('click', selecionarParaApagar);
        corpoTabela.style.cursor = "pointer";
    });

    b_limpar_lista.addEventListener("click", () => {
        const linhas = corpoTabela.querySelectorAll('tr');
        if (linhas.length === 0) {
            exibirAviso("A lista já está vazia.");
            return;
        }

        exibirAviso("Deseja limpar toda a lista de reposição?", async () => {
            try {
                await apiFetch(
                    "http://localhost:3000/reposicao/cancelar/todos",
                    {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${localStorage.getItem("token")}`
                        }
                    }
                );

                corpoTabela.innerHTML = "";
                exibirAviso("Lista apagada!");

            } catch (erro) {
                console.error(erro);
                exibirAviso("Erro ao limpar lista.");
            }

        }, true);
    });

    async function carregarProdutos() {
        try {
            const res = await apiFetch("http://localhost:3000/reposicao/produtos", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${localStorage.getItem("token")}`
                }
            });

            produtosCache = await res.json();
        } catch (err) {
            console.error("ERRO CRÍTICO AO CARREGAR PRODUTOS:", err);

            if (err.message.includes("401")) {
                exibirAviso("Sua sessão expirou. Faça login novamente.", () => {
                    window.location.href = "login.html";
                });
            }
        }
    }

    inputBusca.addEventListener('keyup', function() {
        const termoBusca = inputBusca.value.toLowerCase().trim();
        const linhas = document.querySelectorAll('#tb_tbl_estoque tr');

        linhas.forEach(linha => {
            const celulaProduto = linha.getElementsByTagName('td')[0];
            const celulaPrioridade = linha.getElementsByTagName('td')[3];

            if (celulaProduto && celulaPrioridade) {
                const textoProduto = celulaProduto.textContent.toLowerCase().trim();
                const textoPrioridade = celulaPrioridade.textContent.toLowerCase().trim();

                if (textoProduto.includes(termoBusca) || textoPrioridade.includes(termoBusca)) {
                    linha.style.display = "";
                } else {
                    linha.style.display = "none";
                }
            }
        });
    });

    let indexSelecionado = -1;

    function atualizarDestaque(itens) {
        itens.forEach((li, i) => {
            li.classList.toggle("ativo", i === indexSelecionado);
            if (i === indexSelecionado) {
                li.scrollIntoView({ block: "nearest" });
            }
        });
    }

    function normalizarBusca(valor) {
        return String(valor ?? "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .trim();
    }

    let contadorBuscaProduto = 0;
    let timerBuscaProduto = null;

    function renderizarSugestoesProdutos(produtos) {
        lista.innerHTML = "";
        indexSelecionado = -1;

        const filtrados = (Array.isArray(produtos) ? produtos : [])
            .filter(p => Number(p.ativo) === 1)
            .map(p => {
                const nome = p.nome || p.nome_produto || "Sem nome";
                const codigo = String(p.codigo_barras ?? p.codigo ?? "").trim();
                const termo = normalizarBusca(inpBuscaModal.value);
                const nomeNormalizado = normalizarBusca(nome);
                const codigoNormalizado = normalizarBusca(codigo);

                let prioridade = 50;

                if (codigoNormalizado === termo) prioridade = 0;
                else if (codigoNormalizado.startsWith(termo)) prioridade = 1;
                else if (nomeNormalizado.startsWith(termo)) prioridade = 2;
                else if (nomeNormalizado.includes(termo)) prioridade = 3;
                else if (codigoNormalizado.includes(termo)) prioridade = 4;

                return { p, nome, codigo, prioridade };
            })
            .filter(item => item.prioridade < 50)
            .sort((a, b) => a.prioridade - b.prioridade || a.nome.localeCompare(b.nome, "pt-BR"))
            .slice(0, 8);

        filtrados.forEach(({ p, nome, codigo }) => {
            const li = document.createElement("li");

            if (codigo) {
                li.innerHTML = `<span class="sugestao-produto-nome"></span><span class="sugestao-produto-codigo"></span>`;
                li.querySelector(".sugestao-produto-nome").textContent = nome;
                li.querySelector(".sugestao-produto-codigo").textContent = codigo;
            } else {
                li.textContent = nome;
            }

            li.onclick = () => {
                inpBuscaModal.value = nome;
                inpBuscaModal.dataset.codigo = codigo;
                document.getElementById("s_produto").innerText = nome;
                document.getElementById("s_qtda").innerText = p.qtd ?? p.quantidade ?? 0;
                lista.innerHTML = "";
                indexSelecionado = -1;
                document.getElementById("inp_add_qtd").focus();
            };

            lista.appendChild(li);
        });

        if (filtrados.length === 0) {
            const li = document.createElement("li");
            li.className = "sem-resultado-busca";
            li.textContent = "Nenhum produto encontrado.";
            lista.appendChild(li);
        }
    }

    inpBuscaModal.addEventListener("keydown", (e) => {
    const itens = lista.querySelectorAll("li");

    if (itens.length === 0) {
        return;
    }

    if (e.key === "ArrowDown") {
        e.preventDefault();

        indexSelecionado =
            (indexSelecionado + 1) % itens.length;

        atualizarDestaque(itens);
    }

    else if (e.key === "ArrowUp") {
        e.preventDefault();

        indexSelecionado =
            (indexSelecionado - 1 + itens.length) %
            itens.length;

        atualizarDestaque(itens);
    }

    else if (e.key === "Enter") {
        e.preventDefault();

        if (
            indexSelecionado >= 0 &&
            itens[indexSelecionado]
        ) {
            itens[indexSelecionado].click();
        }
    }
});

    function normalizarBusca(valor) {
    return String(valor ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

inpBuscaModal.addEventListener("input", () => {
    const termoOriginal = inpBuscaModal.value.trim();
    const termo = normalizarBusca(termoOriginal);

    lista.innerHTML = "";
    indexSelecionado = -1;

    if (!termo) {
        return;
    }

    const resultados = produtosCache
        .filter(p => Number(p.ativo) === 1)
        .map(p => {
            const nome = String(
                p.nome ||
                p.nome_produto ||
                ""
            ).trim();

            const codigo = String(
                p.codigo_barras ||
                p.codigo ||
                ""
            ).trim();

            return {
                produto: p,
                nome,
                codigo,
                nomeBusca: normalizarBusca(nome),
                codigoBusca: codigo
                    .replace(/\D/g, "")
            };
        })
        .filter(item => {
            const termoNome = termo;
            const termoCodigo = termo.replace(/\D/g, "");

            const encontrouNome =
                termoNome !== "" &&
                item.nomeBusca.includes(termoNome);

            const encontrouCodigo =
                termoCodigo !== "" &&
                item.codigoBusca.includes(termoCodigo);

            return encontrouNome || encontrouCodigo;
        })
        .sort((a, b) => {
            const termoCodigo = termo.replace(/\D/g, "");

            const aCodigoExato =
                termoCodigo &&
                a.codigoBusca === termoCodigo;

            const bCodigoExato =
                termoCodigo &&
                b.codigoBusca === termoCodigo;

            if (aCodigoExato !== bCodigoExato) {
                return aCodigoExato ? -1 : 1;
            }

            const aCodigoInicio =
                termoCodigo &&
                a.codigoBusca.startsWith(termoCodigo);

            const bCodigoInicio =
                termoCodigo &&
                b.codigoBusca.startsWith(termoCodigo);

            if (aCodigoInicio !== bCodigoInicio) {
                return aCodigoInicio ? -1 : 1;
            }

            const aNomeInicio =
                a.nomeBusca.startsWith(termo);

            const bNomeInicio =
                b.nomeBusca.startsWith(termo);

            if (aNomeInicio !== bNomeInicio) {
                return aNomeInicio ? -1 : 1;
            }

            return a.nome.localeCompare(
                b.nome,
                "pt-BR",
                {
                    sensitivity: "base"
                }
            );
        })
        .slice(0, 8);

    if (resultados.length === 0) {
        const li = document.createElement("li");
        li.className = "sem-resultado-busca";
        li.textContent = "Nenhum produto encontrado.";
        lista.appendChild(li);
        return;
    }

    resultados.forEach((item, indice) => {
        const li = document.createElement("li");

        li.innerHTML = `
            <span class="sugestao-produto-nome">
                ${item.nome}
            </span>

            <span class="sugestao-produto-codigo">
                ${item.codigo || "Sem código"}
            </span>
        `;

        li.addEventListener("click", () => {
            const p = item.produto;

            inpBuscaModal.value = item.nome;
            inpBuscaModal.dataset.codigo =
                p.codigo_barras || p.codigo || "";

            document.getElementById("s_produto").innerText =
                item.nome;

            document.getElementById("s_qtda").innerText =
                p.qtd ??
                p.quantidade ??
                0;

            lista.innerHTML = "";
            indexSelecionado = -1;

            document.getElementById("inp_add_qtd").focus();
        });

        lista.appendChild(li);
    });
});

    async function carregarReposicao() {
        const res = await apiFetch("http://localhost:3000/reposicao", {
            headers: {
                "Authorization": `Bearer ${localStorage.getItem("token")}`
            }
        });

        const dados = await res.json();

        const ordemPrioridade = {
            "Alta": 1,
            "Média": 2,
            "Baixa": 3
        };

        dados.sort((a, b) => {
            return (ordemPrioridade[a.prioridade] || 99) -
                   (ordemPrioridade[b.prioridade] || 99);
        });

        corpoTabela.innerHTML = "";

        dados.forEach(item => {
            adicionarLinhaTabela(
                item.nome,
                item.quantidade_prevista,
                item.local,
                item.prioridade,
                item.codigo,
                item.quantidade_comprada,
                item.status
            );
        });

        // Aplica e reativa o evento de clique e setas nos cabeçalhos após carregar os dados
        aplicarOrdenacaoTabela("tb_tbl_estoque", [5]);
    }

    const selectPrioridade = document.getElementById("selectPrioridade");
    const btnPrioridade = document.getElementById("btnPrioridade");
    const textoPrioridade = document.getElementById("textoPrioridade");
    const listaPrioridade = document.getElementById("listaPrioridade");
    const inputPrioridade = document.getElementById("inp_add_prioridade");

    btnPrioridade.addEventListener("click", (e) => {
        e.stopPropagation();
        selectPrioridade.classList.toggle("aberto");
    });

    listaPrioridade.querySelectorAll(".categoria-opcao").forEach(opcao => {
        opcao.addEventListener("click", () => {
            const valor = opcao.dataset.value;
            textoPrioridade.textContent = valor;
            inputPrioridade.value = valor;

            listaPrioridade
                .querySelectorAll(".categoria-opcao")
                .forEach(item => {
                    item.classList.remove("selecionada");
                });

            opcao.classList.add("selecionada");
            selectPrioridade.classList.remove("aberto");
        });
    });

    document.addEventListener("click", (e) => {
        if (!selectPrioridade.contains(e.target)) {
            selectPrioridade.classList.remove("aberto");
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        carregarProdutos();
        carregarReposicao();
    });

    </script>
</body>
