<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>

    <link rel="stylesheet" href="styleag_es.css">
    <link rel="stylesheet" href="layout.css">

    <link
        rel="icon"
        type="image/png"
        href="/imagens/logo_insta.png"
    >

    <title>Histórico de pedido</title>

</head>

<body class="fundo-escuro">

    <div class="d_util">

        <h2 class="h_ag">
            Histórico de pedido
        </h2>

        <div id="d_inp">

            <div class="busca-box">

                <img
                    src="/imagens/lupa.png"
                    class="icone-busca"
                >

                <input
                    type="text"
                    id="inputBusca"
                    placeholder="Buscar por nome ou código..."
                >

                <button id="btnFiltro">

                    <img
                        src="/imagens/filtro.png"
                        id="img_funil"
                    >

                </button>

                <div id="menuFiltro">

                    <div
                        class="itemFiltro ativo"
                        data-origem="todos"
                    >
                        Todos
                    </div>

                    <div
                        class="itemFiltro"
                        data-origem="PDV"
                    >
                        PDV
                    </div>

                    <div
                        class="itemFiltro"
                        data-origem="Agendamento"
                    >
                        Agendamento
                    </div>

                    <div
                        class="itemFiltro"
                        data-origem="Fiado"
                    >
                        Fiado
                    </div>

                </div>

            </div>

        </div>

    </div>

    <section id="sc_tabela" class="container mt-5">

        <table class="tabela table-striped table-hover border">

            <thead class="table-dark">

                <tr>
                    <th scope="col">Nome do cliente</th>
                    <th scope="col">Pedido n°</th>
                    <th scope="col">Origem</th>
                    <th scope="col">Data e hora</th>
                    <th scope="col">Total da compra</th>
                    <th scope="col">Forma de pagamento</th>
                </tr>

            </thead>

            <tbody id="tb_tbl_produtos">
            </tbody>

        </table>

    </section>

    <!-- MODAL -->

    <dialog id="d_aviso">

        <div class="aviso_box">

            <p id="msg_aviso"></p>

            <div class="aviso_botoes">

                <button id="b_confirmar_aviso">
                    OK
                </button>

                <button
                    id="b_cancelar_aviso"
                    style="display:none;"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </dialog>

<script>


// ===============================
// VARIÁVEIS DO MODAL
// ===============================

const aviso =
document.getElementById("d_aviso");

const msgAviso =
document.getElementById("msg_aviso");

const bConfirmarAviso =
document.getElementById("b_confirmar_aviso");

const bCancelarAviso =
document.getElementById("b_cancelar_aviso");


// ===============================
// FUNÇÃO DO MODAL
// ===============================

function exibirAviso(
    mensagem,
    callback = null,
    mostrarCancelar = false
){

    msgAviso.innerText = mensagem;

    bCancelarAviso.style.display =
    mostrarCancelar
    ? "block"
    : "none";

    aviso.showModal();

    bConfirmarAviso.onclick = () => {

        aviso.close();

        if(callback){
            callback();
        }
    };

    bCancelarAviso.onclick = () => {

        aviso.close();

        if(window.checkboxAtual){

            window.checkboxAtual.checked = false;

            window.checkboxAtual.blur();

            window.checkboxAtual = null;
        }
    };
}


// ===============================
// ELEMENTOS
// ===============================

const inputBusca =
document.getElementById('inputBusca');

const corpoTabela =
document.getElementById('tb_tbl_produtos');

let origemSelecionada = "todos";


// ===============================
// BUSCAR PEDIDOS
// ===============================

async function buscarProdutosEstoque() {

    corpoTabela.innerHTML = "";

    try {

        const response =
        await fetch(
            "http://localhost:3000/historico-pedidos",
            {
                headers: {
                    Authorization:
                    `Bearer ${localStorage.getItem("token")}`
                }
            }
        );

        if (!response.ok) {
            throw new Error(`Erro HTTP: ${response.status}`);
        }

        const pedidos =
        await response.json();

        if (pedidos.length === 0) {

            corpoTabela.innerHTML = `
                <tr>
                    <td colspan="5">
                        Nenhum pedido finalizado encontrado.
                    </td>
                </tr>
            `;

            return;
        }

        pedidos.forEach(pedido => {

            let dataMostrar;

if (pedido.origem === "Agendamento") {
    dataMostrar = pedido.data_ag || pedido.data;
} else {
    dataMostrar = pedido.data;
}

const dataFormatada = new Date(dataMostrar)
    .toLocaleString("pt-BR");

            const tr =
            document.createElement("tr");

            tr.innerHTML = `

                <td>
                    ${pedido.nome || "Cliente"}
                </td>

                <td>
                    ${pedido.num_pedido}
                </td>

                <td>
                    ${pedido.origem || "-"}
                </td>

                <td>
                    ${dataFormatada}
                </td>

                <td>
                    R$ ${Number(pedido.valor_total)
                        .toFixed(2)
                        .replace(".", ",")}
                </td>

                <td>
                    ${pedido.form_pag}
                </td>

            `;

            corpoTabela.appendChild(tr);

        });

    } catch (erro) {

        console.error(
            "Erro ao carregar histórico:",
            erro
        );

        corpoTabela.innerHTML = `
            <tr>
                <td colspan="5">
                    Erro ao carregar histórico de pedidos.
                </td>
            </tr>
        `;
    }
}


// ===============================
// BUSCA
// ===============================

inputBusca.addEventListener(
    'keyup',
    function() {

        const termo =
        inputBusca.value
        .toLowerCase()
        .trim();

        const linhas =
        corpoTabela.getElementsByTagName('tr');

        for (let i = 0; i < linhas.length; i++) {

            const colunas =
            linhas[i].getElementsByTagName('td');

            if (colunas.length > 0) {

                const nomeCliente =
                colunas[0]
                .textContent
                .toLowerCase();

                const numPedido =
                colunas[1]
                .textContent
                .toLowerCase();

                if (
                    nomeCliente.includes(termo)
                    ||
                    numPedido.includes(termo)
                ) {

                    linhas[i].style.display = "";

                } else {

                    linhas[i].style.display = "none";
                }
            }
        }
    }
);

inputBusca.addEventListener(
    "keyup",
    aplicarFiltros
);


// ===============================
// FILTROS
// ===============================

function aplicarFiltros(){

    const termo =
    inputBusca.value
    .toLowerCase()
    .trim();

    const linhas =
    corpoTabela.getElementsByTagName("tr");

    for(let i = 0; i < linhas.length; i++){

        const colunas =
        linhas[i].getElementsByTagName("td");

        if(colunas.length > 0){

            const nome =
            colunas[0]
            .textContent
            .toLowerCase();

            const pedido =
            colunas[1]
            .textContent
            .toLowerCase();

            const origem =
            colunas[2]
            .textContent
            .trim();

            const buscaOk =
            nome.includes(termo)
            ||
            pedido.includes(termo);

            const origemOk =
            origemSelecionada === "todos"
            ||
            origem === origemSelecionada;

            linhas[i].style.display =
            buscaOk && origemOk
            ? ""
            : "none";
        }
    }
}


// ===============================
// MENU FILTRO
// ===============================

const btnFiltro =
document.getElementById("btnFiltro");

const menuFiltro =
document.getElementById("menuFiltro");

const itensFiltro =
document.querySelectorAll(".itemFiltro");

btnFiltro.onclick = (e) => {

    e.stopPropagation();

    menuFiltro.style.display =
    menuFiltro.style.display === "block"
    ? "none"
    : "block";
};

document.addEventListener("click", (e) => {

    if(
        !menuFiltro.contains(e.target)
        &&
        !btnFiltro.contains(e.target)
    ){
        menuFiltro.style.display = "none";
    }
});

itensFiltro.forEach(item => {

    item.onclick = () => {

        itensFiltro.forEach(i => {
            i.classList.remove("ativo");
        });

        item.classList.add("ativo");

        origemSelecionada =
        item.dataset.origem;

        menuFiltro.style.display = "none";

        aplicarFiltros();
    };
});


// ===============================
// VERIFICA LOGIN
// ===============================

const token =
localStorage.getItem("token");

if (!token) {

    exibirAviso(
        "Acesso restrito! Redirecionando para o login...",
        () => {
            window.location.href = "login.html";
        }
    );
}


// ===============================
// CARREGA TABELA
// ===============================

document.addEventListener(
    'DOMContentLoaded',
    buscarProdutosEstoque
);

</script>

</body>
</html>
