<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="sidebar_header.js"></script>

    <link rel="stylesheet" href="styleag_es.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="icon" type="image/png" href="../backend/imagens/logo_insta.png">

    <title>Histórico de Pedidos</title>
    <style>
        th.sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 20px !important;
        }
        th.sortable::after {
            content: " ⇅";
            opacity: 0.3;
            font-size: 0.8em;
        }
        th.sort-asc::after {
            content: " ▲";
            opacity: 1;
        }
        th.sort-desc::after {
            content: " ▼";
            opacity: 1;
        }
    </style>
</head>

<body class="fundo-escuro">
<div class="d_util topo-cabecalho">
    <div class="grupo-esquerda">
        <div class="titulo-historico">
            <h2 class="h_ag">Histórico de Pedidos</h2>

            <button id="btnRankingProdutos"
                class="btn-ranking"
                onclick="abrirRankingProdutos()">
                📊 Produtos mais vendidos
            </button>
        </div>
    </div>

    <div id="painel_metricas">
        <div class="grupo-direita">
            <div class="total-faturado-box">
                <span>Faturamento:</span>
                <strong id="lbl_total_mes">R$ 0,00</strong>
            </div>

            <div class="busca-box">
                <img src="../backend/imagens/lupa.png"
                     class="icone-busca"
                     alt="Buscar">

                <input
                    type="text"
                    id="inputBusca"
                    placeholder="Buscar cliente ou pedido...">

                <button id="btnFiltro" type="button">
                    <img src="../backend/imagens/filtro.png"
                         id="img_funil"
                         alt="Filtrar"
                         style="width:16px;">
                </button>

                <div id="menuFiltro">
                    <div class="itemFiltro ativo" data-origem="todos">Todos</div>
                    <div class="itemFiltro" data-origem="PDV">PDV</div>
                    <div class="itemFiltro" data-origem="Agendamento">Agendamento</div>
                    <div class="itemFiltro" data-origem="Fiado">Fiado</div>
                </div>
            </div>

            <button id="btnExportarPDF" class="btn-baixar-pdf" onclick="gerarPDFMensalPedidos()">
                Baixar PDF
            </button>
            <button id="btnLimparBackup" class="btn-limpar-historico" onclick="confirmarBackupEApagar()">
                Limpar
            </button>
        </div>
    </div>
</div>

<section id="sc_tabela" class="container mt-5">
    <table class="tabela table-striped table-hover border">
        <thead class="table-dark">
            <tr>
                <th scope="col">Nome do cliente</th>
                <th scope="col">Pedido n°</th>
                <th scope="col">Origem</th>
                <th scope="col">Data e hora</th>
                <th scope="col">Total da compra</th>
                <th scope="col">Forma de pagamento</th>
            </tr>
        </thead>
        <tbody id="tb_tbl_produtos"></tbody>
    </table>
</section>

<dialog id="d_aviso">
    <div class="aviso_box">
        <p id="msg_aviso"></p>
        <div class="aviso_botoes">
            <button id="b_confirmar_aviso">OK</button>
            <button id="b_cancelar_aviso" style="display:none;">Cancelar</button>
        </div>
    </div>
</dialog>

<dialog id="modalRankingProdutos">
    <div class="modal_box">
        <button id="b_close_ranking" onclick="modalRankingProdutos.close()">✕</button>
        <h2 class="modal_titulo">Produtos mais vendidos</h2>
        <div id="listaRankingProdutos"></div>
    </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script src="./gerarpdf.js"></script>

<script>
const corpoTabela = document.getElementById("tb_tbl_produtos");
const inputBusca = document.getElementById("inputBusca");
const btnFiltro = document.getElementById("btnFiltro");
const menuFiltro = document.getElementById("menuFiltro");
const itensFiltro = document.querySelectorAll(".itemFiltro");

let pedidosCarregados = [];
let filtroOrigemAtual = "todos";
let rankingProdutos = [];

function aplicarOrdenacaoTabela(idTbody, colunasIgnoradas = []) {
    const tbody = document.getElementById(idTbody);
    if (!tbody) return;

    const tabela = tbody.closest("table");
    if (!tabela) return;

    if (!tbody.dataset.ordemOriginal) {
        const linhasOriginais = Array.from(tbody.querySelectorAll("tr"));
        linhasOriginais.forEach((tr, index) => tr.dataset.indexOriginal = index);
        tbody.dataset.ordemOriginal = "true";
    }

    const cabecalhos = tabela.querySelectorAll("thead th");

    cabecalhos.forEach((th, indice) => {
        if (colunasIgnoradas.includes(indice)) return;

        th.classList.add("sortable");

        const novoTh = th.cloneNode(true);
        th.parentNode.replaceChild(novoTh, th);

        novoTh.addEventListener("click", () => {
            const estadoAtual = novoTh.dataset.ordem || "none";
            let novoEstado = "asc";

            if (estadoAtual === "asc") novoEstado = "desc";
            else if (estadoAtual === "desc") novoEstado = "none";

            cabecalhos.forEach(c => {
                c.classList.remove("sort-asc", "sort-desc");
                c.dataset.ordem = "none";
            });

            novoTh.dataset.ordem = novoEstado;

            const linhas = Array.from(tbody.querySelectorAll("tr"));

            if (novoEstado === "none") {
                linhas.sort((a, b) => {
                    const idxA = parseInt(a.dataset.indexOriginal || 0);
                    const idxB = parseInt(b.dataset.indexOriginal || 0);
                    return idxA - idxB;
                });
            } else {
                novoTh.classList.add(novoEstado === "asc" ? "sort-asc" : "sort-desc");

                linhas.sort((a, b) => {
                    const valA = a.children[indice]?.textContent.trim() || "";
                    const valB = b.children[indice]?.textContent.trim() || "";

                    const numA = parseFloat(valA.replace("R$", "").replace("#", "").replace(/\./g, "").replace(",", ".").trim());
                    const numB = parseFloat(valB.replace("R$", "").replace("#", "").replace(/\./g, "").replace(",", ".").trim());

                    if (!isNaN(numA) && !isNaN(numB)) {
                        return novoEstado === "asc" ? numA - numB : numB - numA;
                    }

                    return novoEstado === "asc" 
                        ? valA.localeCompare(valB, "pt-BR", { numeric: true }) 
                        : valB.localeCompare(valA, "pt-BR", { numeric: true });
                });
            }

            linhas.forEach(linha => tbody.appendChild(linha));
        });
    });
}

function formatarFormaPagamento(texto) {
    if (!texto) return "-";
    let limpo = String(texto);

    if (limpo.includes("=")) {
        const partes = limpo.split(",").map(p => p.trim()).filter(Boolean);
        const divididos = partes.map(parte => {
            const idx = parte.lastIndexOf("=");
            if (idx <= 0) return parte;
            const forma = parte.slice(0, idx).trim();
            const valor = Number(parte.slice(idx + 1).trim().replace(",", "."));
            return Number.isFinite(valor) ? `${forma}: R$ ${valor.toFixed(2).replace(".", ",")}` : forma;
        });
        return divididos.join(" + ");
    }

    limpo = limpo.replace(/f(?:1[0-2]|[1-9])/gi, "");
    limpo = limpo.replace(/[()\[\]]/g, "");
    limpo = limpo.replace(/^[-:\s]+|[-:\s]+$/g, "").trim();

    if (!limpo) return "-";

    return limpo.toLowerCase().replace(/(?:^|\s|-)\S/g, a => a.toUpperCase());
}

document.addEventListener("DOMContentLoaded", () => {
    buscarProdutosEstoque();
    configurarEventosFiltro();
});

async function buscarProdutosEstoque() {
    if (!corpoTabela) return;
    corpoTabela.innerHTML = "";

    try {
        const response = await fetch("http://localhost:3000/historico-pedidos", {
            headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`
            }
        });

        if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);

        pedidosCarregados = await response.json();
        calcularRankingProdutos();

        if (pedidosCarregados.length === 0) {
            corpoTabela.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align: center;">Nenhum pedido finalizado encontrado.</td>
                </tr>
            `;
            atualizarMetricas();
            return;
        }

        aplicarFiltrosEBusca();

    } catch (erro) {
        console.error("Erro ao carregar histórico:", erro);
        corpoTabela.innerHTML = `
            <tr>
                <td colspan="6" style="text-align: center;">Erro ao carregar histórico de pedidos.</td>
            </tr>
        `;
    }
}

function configurarEventosFiltro() {
    if (btnFiltro) {
        btnFiltro.addEventListener("click", (e) => {
            e.stopPropagation();
            menuFiltro.classList.toggle("aberto");
        });
    }

    document.addEventListener("click", () => {
        if (menuFiltro) menuFiltro.classList.remove("aberto");
    });

    itensFiltro.forEach(item => {
        item.addEventListener("click", () => {
            itensFiltro.forEach(i => i.classList.remove("ativo"));
            item.classList.add("ativo");
            filtroOrigemAtual = item.getAttribute("data-origem");
            aplicarFiltrosEBusca();
        });
    });

    if (inputBusca) {
        inputBusca.addEventListener("input", () => {
            aplicarFiltrosEBusca();
        });
    }
}

function aplicarFiltrosEBusca() {
    const termoBusca = inputBusca ? inputBusca.value.toLowerCase().trim() : "";

    const pedidosFiltrados = pedidosCarregados.filter(pedido => {
        const origemPedido = (pedido.origem || "").toLowerCase();
        const atendeOrigem = (filtroOrigemAtual === "todos") || 
                             (origemPedido === filtroOrigemAtual.toLowerCase());

        const nomeCliente = (pedido.nome || "consumidor final").toLowerCase();
        const numPedido = (pedido.num_pedido !== undefined && pedido.num_pedido !== null) 
                            ? pedido.num_pedido.toString().toLowerCase() 
                            : "";

        const atendeBusca = nomeCliente.includes(termoBusca) || numPedido.includes(termoBusca);

        return atendeOrigem && atendeBusca;
    });

    renderizarTabela(pedidosFiltrados);
    atualizarMetricas();
}

function renderizarTabela(pedidos) {
    if (!corpoTabela) return;
    corpoTabela.innerHTML = "";
    delete corpoTabela.dataset.ordemOriginal;

    if (!pedidos || pedidos.length === 0) {
        corpoTabela.innerHTML = `
            <tr>
                <td colspan="6" style="text-align: center;">Nenhum pedido encontrado.</td>
            </tr>
        `;
        return;
    }

    pedidos.forEach(pedido => {
        const dataFormatada = pedido.data ? new Date(pedido.data).toLocaleString("pt-BR") : "-";
        const valorTotalNum = Number(pedido.valor_total) || 0;
        const valorFormatado = valorTotalNum.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const pagamentoFormatado = formatarFormaPagamento(pedido.form_pag);

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${pedido.nome || "Consumidor Final"}</td>
            <td>#${pedido.num_pedido || pedido.id_pedido || "-"}</td>
            <td>${pedido.origem || "PDV"}</td>
            <td>${dataFormatada}</td>
            <td>${valorFormatado}</td>
            <td>${pagamentoFormatado}</td>
        `;
        corpoTabela.appendChild(tr);
    });

    aplicarOrdenacaoTabela("tb_tbl_produtos", []);
}

function obterPedidosDoMesAtual() {
    const agora = new Date();
    const mesAtual = agora.getMonth();
    const anoAtual = agora.getFullYear();

    return pedidosCarregados.filter(pedido => {
        if (!pedido.data) return false;
        const dataPedido = new Date(pedido.data);

        return (
            dataPedido.getMonth() === mesAtual &&
            dataPedido.getFullYear() === anoAtual
        );
    });
}

function atualizarMetricas() {
    const pedidosDoMes = obterPedidosDoMesAtual();
    let totalFaturado = 0;

    pedidosDoMes.forEach(pedido => {
        totalFaturado += Number(pedido.valor_total || 0);
    });

    const elementoTotal = document.getElementById("lbl_total_mes");
    if (elementoTotal) {
        elementoTotal.innerText = `R$ ${totalFaturado.toFixed(2).replace(".", ",")}`;
    }
}

function calcularRankingProdutos() {
    const contador = {};

    pedidosCarregados.forEach(pedido => {
        let listaProds = pedido.itens || pedido.produtos || [];

        if (typeof listaProds === "string") {
            try {
                listaProds = JSON.parse(listaProds);
            } catch (e) {
                listaProds = [];
            }
        }

        if (Array.isArray(listaProds)) {
            listaProds.forEach(prod => {
                const nome = prod.nome || prod.nome_produto || "Produto Sem Nome";
                const qtd = Number(prod.qtd || prod.quantidade || 1);

                if (nome) {
                    contador[nome] = (contador[nome] || 0) + qtd;
                }
            });
        }
    });

    rankingProdutos = Object.entries(contador)
        .map(([nome, quantidade]) => ({ nome, quantidade }))
        .sort((a, b) => b.quantidade - a.quantidade);
}

function abrirRankingProdutos() {
    const lista = document.getElementById("listaRankingProdutos");
    lista.innerHTML = "";

    if (rankingProdutos.length === 0) {
        lista.innerHTML = "<p style='padding: 10px; text-align: center;'>Nenhum dado de produto vendido encontrado.</p>";
    } else {
        rankingProdutos.forEach((produto, index) => {
            lista.innerHTML += `
                <div class="item-ranking" style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333;">
                    <span><strong>${index + 1}°</strong> ${produto.nome}</span>
                    <strong>${produto.quantidade} un.</strong>
                </div>
            `;
        });
    }

    document.getElementById("modalRankingProdutos").showModal();
}

function confirmarBackupEApagar() {
    exibirAviso(
        "Atenção: Ao confirmar, o PDF do mês será baixado automaticamente como segurança e todos os pedidos serão apagados. Deseja continuar?",
        async () => {
            gerarPDFMensalPedidos();

            try {
                const res = await fetch("http://localhost:3000/historico-pedidos/limpar", {
                    method: "DELETE",
                    headers: {
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                });

                const data = await res.json();
                if (res.ok) {
                    exibirAviso("Histórico limpo com sucesso!");
                    buscarProdutosEstoque();
                } else {
                    exibirAviso(data.erro || "Erro ao apagar histórico.");
                }
            } catch (err) {
                console.error("Erro ao apagar o histórico:", err);
                exibirAviso("Erro de conexão ao tentar limpar histórico.");
            }
        },
        true
    );
}

function exibirAviso(mensagem, acaoConfirmar = null, mostrarCancelar = false) {
    const dialog = document.getElementById("d_aviso");
    const msg = document.getElementById("msg_aviso");
    const btnConfirmar = document.getElementById("b_confirmar_aviso");
    const btnCancelar = document.getElementById("b_cancelar_aviso");

    if (!dialog) {
        alert(mensagem);
        if (acaoConfirmar) acaoConfirmar();
        return;
    }

    msg.innerText = mensagem;
    btnCancelar.style.display = mostrarCancelar ? "inline-block" : "none";

    btnConfirmar.onclick = () => {
        dialog.close();
        if (acaoConfirmar) acaoConfirmar();
    };

    btnCancelar.onclick = () => {
        dialog.close();
    };

    dialog.showModal();
}
</script>
</body>
</html>
