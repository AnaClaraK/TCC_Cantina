<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio — Grano Vita</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #111;
        }

        body {
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        #pdf-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            background: #111;
        }

        .pagina-pdf {
            display: block;
            width: 100%;
            max-width: 1920px;
            height: auto;
            background: #fff;
        }

        #carregando {
            position: fixed;
            inset: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: #efac4a;

            font-family: Arial, sans-serif;
            font-size: clamp(20px, 2vw, 34px);
            font-weight: bold;
        }

        #erro-pdf {
            position: fixed;
            inset: 0;
            z-index: 30;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 30px;
            text-align: center;

            background: #111;
            color: #efac4a;

            font-family: Arial, sans-serif;
            font-size: clamp(18px, 1.8vw, 28px);
            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="carregando">Carregando cardápio...</div>

<div id="erro-pdf">
    Não foi possível carregar o cardápio.<br>
    Coloque o arquivo <strong>cardapio.pdf</strong> na mesma pasta deste HTML.
</div>

<main id="pdf-container"></main>

<script type="module">
    import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const PDF_URL = "cardapio.pdf";

    const MONITOR_CHAVE = "grano_vita_monitor_venda";
    const SCROLL_CHAVE = "grano_vita_cardapio_scroll";

    const container = document.getElementById("pdf-container");
    const carregando = document.getElementById("carregando");
    const erroPdf = document.getElementById("erro-pdf");

    let ultimaVenda = null;
    let rolando = false;
    let animacaoScroll = null;

    function lerEstadoVenda() {
        try {
            const bruto = localStorage.getItem(MONITOR_CHAVE);

            if (!bruto) {
                return null;
            }

            return JSON.parse(bruto);
        } catch (erro) {
            console.error("Erro ao ler estado do monitor:", erro);
            return null;
        }
    }

    function vendaAtiva() {
        const estado = lerEstadoVenda();

        return (
            estado?.vendaEmAndamento === true &&
            Array.isArray(estado?.carrinho) &&
            estado.carrinho.length > 0
        );
    }

    function salvarPosicaoCardapio() {
        try {
            localStorage.setItem(
                SCROLL_CHAVE,
                String(window.scrollY || window.pageYOffset || 0)
            );
        } catch (erro) {
            console.error("Erro ao salvar posição do cardápio:", erro);
        }
    }

    function obterPosicaoSalva() {
        try {
            const valor = Number(
                localStorage.getItem(SCROLL_CHAVE) || 0
            );

            return Number.isFinite(valor) && valor >= 0
                ? valor
                : 0;
        } catch {
            return 0;
        }
    }

    function pararRolagem() {
        rolando = false;

        if (animacaoScroll !== null) {
            cancelAnimationFrame(animacaoScroll);
            animacaoScroll = null;
        }
    }

    function iniciarRolagem() {
        if (rolando || vendaAtiva()) {
            return;
        }

        rolando = true;

        let ultimoTempo = performance.now();

        function passo(agora) {
            if (!rolando || vendaAtiva()) {
                pararRolagem();
                salvarPosicaoCardapio();
                return;
            }

            const delta = agora - ultimoTempo;
            ultimoTempo = agora;

            /*
             * Velocidade aproximada:
             * 24 pixels por segundo.
             */
            const velocidade = 24;

            window.scrollBy(
                0,
                velocidade * (delta / 1000)
            );

            const limite =
                document.documentElement.scrollHeight -
                window.innerHeight;

            if (window.scrollY >= limite - 2) {
                window.scrollTo({
                    top: 0,
                    behavior: "instant"
                });
            }

            animacaoScroll =
                requestAnimationFrame(passo);
        }

        animacaoScroll =
            requestAnimationFrame(passo);
    }

    async function renderizarPDF() {
        try {
            const pdf = await pdfjsLib.getDocument(PDF_URL).promise;

            container.innerHTML = "";

            for (let numero = 1; numero <= pdf.numPages; numero++) {
                const pagina = await pdf.getPage(numero);

                const viewportOriginal =
                    pagina.getViewport({ scale: 1 });

                const larguraDisponivel =
                    Math.min(
                        window.innerWidth,
                        1920
                    );

                const escala =
                    larguraDisponivel /
                    viewportOriginal.width;

                const viewport =
                    pagina.getViewport({
                        scale: escala
                    });

                const canvas =
                    document.createElement("canvas");

                canvas.className = "pagina-pdf";

                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);

                const contexto =
                    canvas.getContext("2d", {
                        alpha: false
                    });

                container.appendChild(canvas);

                await pagina.render({
                    canvasContext: contexto,
                    viewport
                }).promise;
            }

            carregando.style.display = "none";

            /*
             * Depois que o PDF foi renderizado,
             * recupera o ponto onde o cardápio estava.
             */
            const posicaoSalva =
                obterPosicaoSalva();

            window.scrollTo({
                top: posicaoSalva,
                behavior: "instant"
            });

            if (!vendaAtiva()) {
                iniciarRolagem();
            }
        } catch (erro) {
            console.error("Erro ao carregar PDF:", erro);

            carregando.style.display = "none";
            erroPdf.style.display = "flex";
        }
    }

    function verificarVenda() {
        const ativa = vendaAtiva();

        if (ativa && !ultimaVenda) {
            salvarPosicaoCardapio();
            pararRolagem();

            window.location.href =
                "pdv.html?monitor=1";

            return;
        }

        if (!ativa && ultimaVenda) {
            /*
             * A página volta ao cardápio após a finalização
             * do monitor PDV.
             */
            salvarPosicaoCardapio();
            iniciarRolagem();
        }

        ultimaVenda = ativa;
    }

    window.addEventListener("storage", event => {
        if (event.key === MONITOR_CHAVE) {
            verificarVenda();
        }
    });

    window.addEventListener("beforeunload", () => {
        salvarPosicaoCardapio();
    });

    /*
     * Checa o estado periodicamente porque a página pode
     * ter sido aberta depois que a venda já começou.
     */
    setInterval(verificarVenda, 200);

    ultimaVenda = vendaAtiva();

    if (ultimaVenda) {
        salvarPosicaoCardapio();
    }

    renderizarPDF();
</script>

</body>
</html>
